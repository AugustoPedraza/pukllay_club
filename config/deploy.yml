# Kamal 2 deploy configuration.
#
# Wired to the real production host during plan 00-05 (D-20: GCP e2-micro,
# x86_64, us-central1-a — supersedes the original Hetzner CAX31/arm64
# assumption from plan 00-04 due to a 2026 capacity shortage across
# Hetzner/Oracle at provisioning time; see 00-CONTEXT.md D-20).

service: pukllay_club

# NOT prefixed with "ghcr.io/" — Kamal's own `repository` helper joins
# `registry.server` + `image` itself (`ghcr.io/augustopedraza/pukllay_club`
# was a double-prefix bug: `ghcr.io/ghcr.io/augustopedraza/pukllay_club`).
image: augustopedraza/pukllay_club

registry:
  server: ghcr.io
  username: augustopedraza
  password:
    - KAMAL_REGISTRY_PASSWORD

# Required by Kamal even though CI builds+pushes the image directly via
# `docker/build-push-action` (D-01/D-10) and the deploy job only pulls it
# (`--skip-push`, see deploy.yml) — Kamal's config validator rejects a
# missing `arch` unconditionally. Single arch, matching the GCP e2-micro
# host (D-20: x86_64, not the original arm64 assumption).
builder:
  arch: amd64

# GCP's metadata-based SSH key provisioning creates a non-root sudo-capable
# user ("deploy"), not direct root access (D-20). Without this, Kamal
# defaults to root and cannot connect.
ssh:
  user: deploy

servers:
  web:
    - 34.41.63.138

proxy:
  ssl: true
  host: pukllay.club
  healthcheck:
    path: /up

# Every role/accessory below explicitly declares which secrets it needs (D-11) —
# nothing relies on global availability.
env:
  clear:
    PHX_HOST: pukllay.club
    PHX_SERVER: "true"
  secret:
    - SECRET_KEY_BASE
    - DATABASE_URL
    - SENTRY_DSN

accessories:
  db:
    # Without this, Kamal names/labels the container
    # "pukllay_club-db" (default: "<service>-<accessory>") and Docker's
    # embedded DNS only resolves containers on the "kamal" network by
    # their container name — but DATABASE_URL (the GitHub secret) targets
    # hostname "db" to match Kamal's docs convention. Setting `service:
    # db` makes the container name (and therefore the resolvable
    # hostname) literally "db", matching DATABASE_URL.
    service: db
    image: pgvector/pgvector:pg17
    host: 34.41.63.138
    # Bind to localhost only — never 0.0.0.0 (D-15). Docker's own iptables
    # rules bypass UFW, so this bind is the real access control, not the
    # host firewall.
    port: "127.0.0.1:5432:5432"
    env:
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - "pg_data:/var/lib/postgresql/data"

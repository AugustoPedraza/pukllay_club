  /* Sketch 078 — slice 3 of the create scenario (the 2026-09-20 handoff). Built on 077's page rather than
     redrawn: the walk picks up exactly where 077 put it down — the game is created, the data has arrived,
     and the sheet's `Ver` has taken you into the editor.

     THE ROUND'S ONE QUESTION: the draft is incomplete and you reach for `Publicar`. WHO STOPS YOU, AND HOW?
       G1 bloquea    `Publicar` is dead until the draft is complete; a line says what is missing
       G2 avisa      `Publicar` is live; tapping it opens a confirm that names what is missing and lets you
                     publish anyway
       G3 la ficha   no gate at all — the rows show their own holes and `Publicar` just works.
                     THE DO-NOTHING BASELINE: this is what the code does today, and what makes G1/G2
                     falsifiable.
     Nothing else differs. `missing()` is computed once and all three read the same array (check 4).

     ---------------------------------------------------------------------------------------------------
     WHAT THE GATE REQUIRES IS *MEASURED*, NOT A VARIANT AXIS — and the measurement is the round's finding.

     The obvious gate ("all six club rows filled") is impossible: the live catalogue does not meet it.
     Counted against pukllay_club_dev on 2026-09-21, 434 published + 1 draft:

         campo          lo tienen                                     ¿puerta?
         estante        1 de 435   (y existe 1 SOLO estante)          NO — 433 publicados no pasarían
         copias         434 de 434, TODAS = 1, ninguna varía          NO — es un default que falta
         nivel          408/408 base · 0/26 expansiones               SÍ, condicional a is_expansion
         nombre         434/434                                       SÍ, pero sólo el marcador es detectable

     `units` has no DB default (create_games.exs:20), `enrichment_changeset` never casts it
     (game.ex:182-210), and `admin_changeset` lets a blank through unvalidated (game.ex:236-239) — so every
     game the NEW flow creates has `copias = nil` forever. The 434 ones came from the CSV seed. That makes
     copias a MISSING DEFAULT, not a gate: the editor pre-fills 1 and the gate says nothing about it.

     SO THE GATE HAS EXACTLY ONE CONDITION for a normally-enriched base game: el nivel. That is not a thin
     round, it is the round's answer — and it is the strongest argument in play about which variant is
     proportionate, because G1 kills the page's primary action over one unset select.
     AND FOR AN EXPANSION THE GATE HAS ZERO CONDITIONS. The `Tipo` toggle in the tool panel makes that
     falsifiable: flip to `expansión` and the gate must vanish in all three variants (check 9).

     ---------------------------------------------------------------------------------------------------
     WHAT IS *NOT* BEING DESIGNED AROUND, and why it is a toggle rather than a requirement.

     The one real draft in the database (id 873) is `enriched` and its name is:

         "HellasDutch/English/French/German editionEnglish/Korean edition"

     That is not a placeholder and no name rule would catch it. It is a ONE-CHARACTER PRODUCTION BUG, proven
     byte-identically against the real row while measuring for this round:

         bgg_client.ex:130   name: ~x".//name[@type='primary']/@value"so
                                     ^^^ descends into <versions> (added with versions=1), and SweetXml's
                                         `s` modifier CONCATENATES every match
         reproducción        ".//"  -> "HellasDutch/English/French/German editionEnglish/Korean edition"
                             "./"   -> "Hellas"                      (=== la fila 873, MATCH true)

     The comment at bgg_client.ex:118-122 shows this exact hazard was already found and fixed for `//item`
     -> `/items/item` when `versions=1` landed. `name` was missed — AND SO WERE `publishers` AND `artists`,
     which use `.//link[...]` and absorb every localized edition's publisher:

         Codenames  172 editoriales (37 únicas)   ·   Similo Myths 178   ·   Takenoko 161
         GameText.editorial_text/1 joins them all -> 3.304 caracteres de "editado por …" EN VIVO en la web

     A GATE THAT REJECTED THAT NAME WOULD BE PAPERING OVER A ONE-CHARACTER BUG. So the fixture's name is
     `Hellas` — what BGG supplies once the xpath is `./` — and the broken string is a TOOL-PANEL TOGGLE, not
     a gate requirement. Its job is to make a claim falsifiable rather than to be designed against:
     *the gate cannot tell a bad name from a good one* (check 8 asserts the gate's items are IDENTICAL under
     both names). Filed separately; it is not this round's question.

     ---------------------------------------------------------------------------------------------------
     WHAT WAS ALREADY DRAWN, read before anything was proposed (and it was narrower than the prose):

       075:798   if (CY === 'draft') return { label: 'Publicar', id: 'publish', dis: !hasData() };
       075:751   const hasData = () => ST === 'enriched';
       073:46    "THE PUBLISH RULE: the app must avoid publishing uncompleted games"
                 ...a rule the sketch obeys, not a variant axis.

     So "uncompleted" had been operationalised as BGG ANSWERED and nothing else — `nivel`, `copias` and
     `estante` were never in it. THAT IS THE HOLE d42 NAMES ("draft+complete -> Publicar") and it is what
     this slice fills. The `hasData()` half is KEPT VERBATIM and is not a variant: a game with no BGG data
     cannot be published in any of the three (check 10). What the three differ about is the CLUB half.

     AND THE DRAWN GATE IS GREEN ON THE ONLY GAME IT WOULD EVER HAVE BEEN ASKED ABOUT: id 873 is
     `enrichment_status: "enriched"`, so `dis: false` — Publicar is live on a draft with a garbage name, no
     nivel, no copias and no estante.

     075's LIFECYCLE DRAWING IS REUSED, NOT REDESIGNED. `Ciclo: Publicado / Borrador / Retirado` is a dot +
     text in the editor's head (075:886, CYC), which is also the app-wide status rule. It is a READ-OUT
     there, never a control, and it stays one here. Despublicar is slice 079's question, not this round's —
     the tool panel's `Ciclo` buttons are a FIXTURE switch, exactly as they were in 075.

     THE WALK IS STEPPABLE AND STATE IS CARRIED, as in 076/077: the game the walk publishes is the game the
     walk created. 075's lesson — the only route to a new state must not be a fixture reload, or the harness
     measures the tool panel instead of the page. */
  :root { --stroke: color-mix(in srgb, var(--color-text) 58%, var(--color-bg)); --ter: var(--color-secondary); --warn: #B26B00; }

     The handoff's "43%" was the 375x740 figure — the roomiest phone — so the real number is worse the smaller

     WHY IT IS NOT THE CASE d46 ARGUED AGAINST. d46 chose text paint for the top app bar because in the one

  .lhw { position: sticky; top: var(--bar); z-index: 5; margin: 0 -16px; background: var(--color-bg); }
  .lhead { width: 100%; display: flex; align-items: center; gap: 8px; padding: 10px 16px 4px; border: 0;

  /* ---- decision 29 — the fill is a BAND DRAWN AROUND THE INK, never the caption's own background ----

     method: it patched the ONE state that had been reported. Hovering a caption showed the identical defect
     (14px of colour above the text, 1.2 below) because `.lhead.tap:hover` painted the same asymmetric box.
     Decision 27 wrote the general rule — an element that draws nothing at rest but something in another state
     has TWO geometries — and then applied it to a single state. The fix has to be structural.
     A ::before anchored to the CONTENT box (which is where the ink is) and grown by --band each way is centred
     BY CONSTRUCTION, in every state, present and future. It also moves no text: the caption's own padding — and
     with it decision 21's 3:1 resting ratio — is untouched, so hovering cannot make the label jump.
     Pinned keeps a full-height bar (it is a bar under the search, not a highlight), and decision 27's padding
     halving is what centres the ink inside it. Two band shapes, one invariant: the ink is centred in whatever
     is actually drawn — and the harness now asserts that for every state that draws. */
  /* --cap: the band centres on the CAP BLOCK, because for versalita the line box is not the ink. At 14/600 the
     line box is 17px inside an 18.2px content box, and the capitals are 11px measured glyph-independently (an
     "H" probe — a J's descending tail must not drag the optical centre). Centring the LINE box left the cap
     block 0.6px high in BOTH states, so both take the same 0.6px downward nudge. Measured, --cap 0 gives -1.2
     in each; --cap 0.6 gives 0.0.
     The nudge changes neither band height nor the caption's own padding, so the breathing room and decision 21's
     resting rhythm are untouched. The harness asserts cap-block centring, so this constant is CHECKED, not
     trusted — change the font or the size and the guard fires. */
  /* --band: the breath around the cap block. Measured at 5 / 6 / 7 the band is 28.2 / 30.2 / 32.2 and its edge
     lands 24.6 / 23.6 / 22.6 from the NEXT label's capitals, against 33.2 of ink-to-ink between labels — so none
     of the three crowds the rhythm and the choice is 2px of heft. 6 gives 9.6px of breath around an 11px cap:
     a band 2.7x the cap, comfortably smaller than a row's own 64px hover. */
  .lhead { position: relative; --band: 6px; --bandp: 12.9px; --cap: 0.6px; }
  .lhead::before { content: ""; position: absolute; z-index: -1; left: 0; right: 0;
    /* NOTE the signs: this state moves the BAND while the pinned state below moves the INK (via padding), and
       raising the band is the same as lowering the ink inside it. Same --cap, opposite-looking expressions. */
    top: calc(var(--pt) - var(--band) - var(--cap)); bottom: calc(var(--cap) - var(--band));
    background: transparent; transition: background 120ms var(--ease-out-soft); }
  @media (prefers-reduced-motion: reduce) { .lhead::before { transition: none; } }
  /* decision 31 — the pinned bar is CHROME, so its height is uniform and owes nothing to the resting rhythm.
     It used to be the caption's own box, which meant it inherited decision 21's deliberate first-section
     exception (--pt 14 vs 26) and the bar under SIN DATOS measured 32.2 against JUEGOS DEL CLUB's 44.2. That
     exception is correct at rest — the 48px search already separates the first section — and meaningless once
     the label is a bar pinned under that same search.
     Because the band is a pseudo-element its thickness is independent of the box, so --bandp fixes the bar at
     44px (matching .pbar and the touch floor) for every section, with no flow change and no jump. This also
     retires decision 27's padding halving: one mechanism now serves both states, differing only in thickness. */
  .lhw.pinned .lhead::before { top: calc(var(--pt) - var(--bandp) - var(--cap)); bottom: calc(var(--cap) - var(--bandp));
    background: var(--color-surface); }

  /* decision 21 — air ABOVE a section label, none below it. Measured TEXT-TO-TEXT (the headers are transparent,
     so box edges are invisible and lie — box gaps reported the variants as identical), the list read 15px above a
     label against 17px below: INVERTED PROXIMITY. Each label clung to the label ABOVE it rather than to the rows
     it heads, which is why three 15/600 labels read as one block instead of three sections. Now 27 against 9, a
     3.0:1 ratio.
     Rejected: air above alone (1.7:1, and 8px more chrome — it keeps the loose 17px below); a hairline above each
     section (1.2:1 — the rule would do the work instead of proximity, and it draws a line this list otherwise
     does not have); and welding the label to its rows alone, which FAILED at 1.2:1 because a header's bottom
     padding feeds the gap to the NEXT header too, so welding tightened both ends at once. Proximity is a RATIO —
     the two ends have to move in opposite directions. */
  .lhead { --pt: 26px; padding-top: var(--pt); padding-bottom: 0; }
  .lgroup:first-of-type .lhead { --pt: 14px; }

  /* decision 27 — the leading air is REDISTRIBUTED when the header pins, because a pinned header has a second
     geometry the resting one never shows. At rest the caption draws nothing, so its 26px of padding-top is pure
     air; the moment it pins it gains --color-surface and that same padding becomes 26px of EMPTY TINT above the
     text, with the text jammed against the band's bottom edge (measured: 26.0 above, 0.5 below).
     Halving --pt onto both sides centres the ink in the band and keeps the box height byte-identical, so the
     sticky element's flow slot does not change and nothing jumps at the moment it pins.
     The lesson this adds to "measure ink, not boxes": an element that draws NOTHING at rest but something in
     another state has TWO geometries, and spacing tuned for the invisible one becomes visible in the other. */
  /* decision 31 retires decision 27's padding halving: the bar's geometry is the band's now, not the box's, so
     the caption's padding never changes between states and no text can move as it pins. */

  /* ---- decision 28 — a section label is VERSALITA: 14/600 uppercase, tracked ----
     From the device: "I need the look and feel of those header looks more different of the rest of the content."
     Until now a caption differed from a row name by WEIGHT alone (600 vs 400), plus keyline, cover and chevron —
     decision 20 put them at the same size and colour deliberately, following D-19j. Four differentiators that
     are all position and weight still read as "a row without a picture", because the TEXT is the same kind.
     Case changes the kind, so a label can never be mistaken for a game's name at any size.

     Why 14, measured as CAP HEIGHT rather than font-size — the only comparison that means anything for caps:

       fila 15/400        mayúscula 11px · minúscula 8px
       versalita 12/600   mayúscula  9px (82% de la may. de fila, 113% de su minúscula)
       versalita 13/600   mayúscula  9px  <- idéntica a 12: la fuente las aparea a este tamaño
       versalita 14/600   mayúscula 11px (100% / 138%)
       versalita 15/600   mayúscula 11px  <- idéntica a 14, y 4px más de chrome

     The scale collapses to two real options (9px or 11px of cap), so within each pair the cheaper one wins.
     14 matches a row name's own capitals exactly while reading 138% of the lowercase body the eye actually
     scans — full presence, different category — and it is CHEAPER than what it replaces: chrome 213 -> 209.

     Rejected: a permanent tinted band (built and measured — it does stay 3 separate masses rather than decision
     14's stripe, but it costs 24px and a whole row, and reopens decision 17's "nothing is tinted at rest", which
     is what ended seven rounds of band negotiation); and 17/600 lower-case, which restores a ladder step but is
     still the SAME kind of text, only bigger — the least answer to what was asked. */
  .lhead .ln { letter-spacing: .07em; text-transform: uppercase; }
  .lhead { font-size: 14px; }

  /* decision 20 — the section label returns to D-19j's rank, 15/600 at full strength. Audited, the ladder was
     INVERTED: the label organising 385 rows was 2px smaller and 2.8x lower contrast than a single row inside it
     (13/600 @6.17 vs 15/400 @17.16), and byte-identical to a row's SECOND line (the year, 13 @6.17) — so a
     section name carried the weight of row metadata. Cause: decision 16 demoted it to separate it from the
     banded 15/600 CONTROLS, decision 17 deleted those controls, and the demotion outlived its reason. It also
     mis-cited the BENCHMARK's "Label (group) 13/600", which was measured from a FORM section label in 065, not
     a list section header — D-19j puts a list section at 15/600, above row names.
     Against a row this still differs by weight (600 vs 400), keyline (16 vs 68) and the absent 40px cover, so
     decision 10's header-vs-row confusion cannot return: that was a 44px CONTROL with a trailing icon in the
     row-chevron slot, and no such thing exists any more.
     Rejected: 15/600 muted (fixes size, keeps the label 2.8x fainter than its own rows — the inversion partly
     survives) and 12/600 all-caps tracked (earns presence from case rather than size and costs less height, but
     it is a harder, more systemy voice than the sentence-case Spanish this admin uses everywhere else). */
  /* decision 18 — a collapsible section carries an INLINE caret after its count. Inline, not leading, so the
     caption keeps the 16 keyline and the x=16 column has no hole; and not trailing at x=339, which D-19i
     reserves for "opens a page". The visual row stays at the caption's height while the HIT BOX is stretched to
     the 44px touch floor by a pseudo-element, so reaching the floor costs no rhythm. */
  .lhead.tap { cursor: pointer; position: relative; }
  .lhead.tap::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 44px; transform: translateY(-50%); }
  .lhead.tap:hover::before { background: var(--color-surface); }
  .lhw.pinned .lhead.tap:hover::before { background: var(--color-surface-2); }
  /* the focus ring rides the same band, so it cannot frame the empty half of the box either */
  .lhead.tap:focus-visible { outline: none; }
  .lhead.tap:focus-visible::before { background: var(--color-surface); outline: 2px solid var(--color-primary); outline-offset: -2px; }
  .lhead .caret { width: 14px; height: 14px; margin-left: 4px; flex-shrink: 0; color: var(--color-text-muted);
    transition: transform 160ms var(--ease-out-soft); }
  /* decision 25 — the caret is a chevron-DOWN that flips to chevron-UP. Decision 18 had used chevR, the glyph
     D-19i reserves for "opens a page", and separated the two by POSITION alone (x=126 vs x=339) — measured, it
     was byte-identical to the row chevron (`M9 5l7 7-7 7`). Decision 10 had already written the rule the right
     way round ("a disclosure triangle, never a trailing ›") and decision 18 kept the position fix while losing
     the glyph rule. Down means expand, up means collapse; neither ever points the way a row chevron does, so the
     collision is resolved by GLYPH, not by placement. */
  .lhead[aria-expanded="true"] .caret { transform: rotate(180deg); }
  @media (prefers-reduced-motion: reduce) { .lhead .caret { transition: none; } }


  /* decision 16 — the caption gets its OWN RANK, at 16. Decision 15 made this header behave like a caption but
     it still looked like a peer: measured, byte-identical type to the two controls above it (15/600,
     rgb(35,19,57)), so it read as a group header that had lost its band and caret rather than a different kind
     of thing. It was also the only element on the page with an empty leading slot — the x=16 column ran
     caret · caret · EMPTY · cover · cover. Both causes were separated by variant and both are fixed here:
     13/600 muted is the system's existing "Label (group)" rank (BENCHMARK; iOS 13pt section header, M3
     subheader), and 16 puts its text back in the leading column. Contrast 6.17 on the page background.
     Rejected: the quieter rank alone at 68 (the hole stayed) and the move alone (type stayed identical).
     The caption no longer aligns with the rows it heads — it sits on the container keyline, which is exactly
     what a Material list subheader does, and decision 13 is untouched because the page still measures 16 / 68. */

  /* decision 9 — scrolling down slides the search away (+1 row on every viewport); the smallest flick up
     brings it back, already usable. Measured: collapsing it to a 44px icon bar saves only 16px — a quarter of
     a row — so it gained 0 rows at 375×667 and still cost a tap. */
  .device[data-bar="search"] .search { transition: transform 200ms var(--ease-out-soft); }
  .device[data-bar="search"].hidesearch .search { transform: translateY(calc(-100% - 1px)); }
  .device[data-bar="search"].hidesearch { --bar: 0px; }
  @media (prefers-reduced-motion: reduce) { .device[data-bar="search"] .search { transition: none; } }

  /* decision 19 — the per-section hint returns, as its own line inside an OPENED section only. Decision 17 had
     dropped it because a paragraph under every header was a second anatomy in a list whose whole point is one;
     decision 18 changed that premise, since a hint can now only appear where the reader has already asked for
     the section. Measured: zero cost at rest (the resting list is byte-identical — 30.9px captions, catalog at
     206), and 26px spent only in the moment the hint is relevant.
     Rejected: folding it into the caption line — measured, that wrapped the header to 2.78 lines EVEN WHILE
     COLLAPSED and pushed the catalog 206 -> 223, paying at rest on every visit for text that only matters once
     the section is open. */
  .hint { margin: 2px 0 6px; font-size: 13px; font-weight: 400; color: var(--color-text-muted); line-height: 1.4; }
  .rows { margin: -4px -16px 0; }   /* decision 21 — the label is welded to the rows it heads */
  .row { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 16px; border: 0; background: none; text-align: left; cursor: pointer; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 68px; right: 0; height: 1px; background: var(--color-border); }
  .row:hover { background: var(--color-surface); }
  .row .name { font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
  /* D-19i — a chevron means THIS ROW OPENS ANOTHER PAGE. A game row opens its editor (decision 2), so it has one. */
  .chev { width: 20px; height: 20px; flex-shrink: 0; color: var(--color-text-muted); }
  .more { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-top: 8px; }
  .more .cap { font-size: 12px; color: var(--color-text-muted); }

  /* ---- sheets (D-19e) ---- */
  .backdrop { position: absolute; inset: 0; background: color-mix(in srgb, #231339 38%, transparent); opacity: 0; pointer-events: none; transition: opacity var(--duration-base); z-index: 40; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--color-bg); border-radius: 18px 18px 0 0; z-index: 41;
    transform: translateY(105%); transition: transform 260ms var(--ease-out-soft); box-shadow: var(--shadow-lg); max-height: 85%; overflow-y: auto;
    padding: 0 0 calc(16px + env(safe-area-inset-bottom, 0px)); scrollbar-width: none; }
  .sheet::-webkit-scrollbar { display: none; }
  .sheet.open { transform: none; }
  .sheet:focus { outline: none; }
  .sheet.full { top: 24px; max-height: none; }
  .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--color-surface-2); margin: 0 auto 8px; }
  .sh-top { position: sticky; top: 0; z-index: 4; background: var(--color-bg); padding-top: 8px; margin-bottom: 8px; }
  .sheet.full .sh-top { margin-bottom: 0; }
  .sh-head { display: flex; gap: 16px; align-items: center; padding: 8px 16px 16px; border-bottom: 1px solid var(--color-border); }
  .sh-head .cov { width: 56px; height: 60px; border-radius: 6px; }
  .sh-head .tile { width: 56px; height: 60px; border-radius: 6px; background: var(--color-surface); display: grid; place-items: center; color: var(--color-accent-text); flex-shrink: 0; }
  .sh-head .tile svg { width: 28px; height: 28px; }
  .sh-txt { flex: 1; min-width: 0; }
  .sh-title { font-size: 18px; font-weight: 600; line-height: 1.3; }
  .ctx { margin: 0 0 4px; font-size: 13px; line-height: 1.3; color: var(--color-text-muted); }
  .sh-x { width: 44px; height: 44px; margin: -6px -10px 0 0; align-self: flex-start; flex-shrink: 0; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; color: var(--color-text-muted); cursor: pointer; }
  .sh-x svg { width: 22px; height: 22px; }
  .sh-x:hover { background: var(--color-surface); }
  .sh-x:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }
  .dlink { width: 100%; display: flex; align-items: center; gap: 16px; min-height: 48px; padding: 0 16px; border: 0; background: none; font-size: 16px; text-align: left; cursor: pointer; }
  .dlink:hover { background: var(--color-surface); }
  .dlink svg { width: 22px; height: 22px; color: var(--color-text-muted); flex-shrink: 0; }
  .dlink .dsub { display: block; font-size: 13px; color: var(--color-text-muted); }
  .dlink:has(.dsub) { min-height: 64px; padding-block: 8px; }
  .dlink:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }

  /* form sheet (restart 67) — the Agregar juego sheet */
  .fbody { padding: 8px 16px 16px; }
  .flab { display: block; margin: 0 0 6px; font-size: 13px; font-weight: 600; }
  .tfield { width: 100%; height: 48px; padding: 0 14px; border: 1px solid var(--stroke); border-radius: 8px; background: var(--color-bg); font-size: 16px; outline: none; }
  .tfield:focus { border-color: var(--color-primary); box-shadow: 0 0 0 1px var(--color-primary); }
  .tfield[aria-invalid="true"] { border-color: var(--color-danger); box-shadow: 0 0 0 1px var(--color-danger); }
  .fbody .hint { margin: 6px 0 0; }
  .ferr { margin: 6px 0 0; font-size: 13px; color: var(--color-danger); }
  .ferr[hidden] { display: none; }
  .fbody .obtn.wide { margin-top: 16px; }

  /* 077 — the pending sheet's BODY. Deliberately not a new sheet chrome: `.sh-top` / `.sh-head` / `.sh-x`
     are reused exactly as every other sheet uses them (D-19e), and only what sits below the rule is new.
     There is no `.tile` in the head — every other sheet's tile names an ACTION (`+`), and a status has no
     action to name; a coloured tick/cross would also be a second status idiom beside d40's dot + text. */
  .pbody { padding: 16px 16px calc(8px + env(safe-area-inset-bottom, 0px)); }
  .pwait { display: flex; gap: 14px; align-items: flex-start; }
  .pwait p, .pline { margin: 0; font-size: 14px; line-height: 1.5; color: var(--color-text-muted); }
  .spin { width: 26px; height: 26px; flex-shrink: 0; margin-top: 1px; border-radius: 50%;
    border: 3px solid var(--color-surface-2); border-top-color: var(--color-primary); animation: sp 900ms linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spin { animation: sp-pulse 1.6s var(--ease-out-soft) infinite; }
    @keyframes sp-pulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
  }
  /* 076 round 4 checked the `+` sheet's rhythm after deleting a block from the middle of a stack, on the
     grounds that nothing else notices an orphan gap. Same check here, and it failed: the ARRIVED body has no
     prose at all, so the button's own margin left 36px of nothing under the rule. The margin belongs between
     a line and the button, not above a button that is the whole body. */
  .pbody .obtn.wide { margin-top: 16px; }
  .pbody .obtn.wide:first-child { margin-top: 0; }
  .fsep { display: flex; align-items: center; gap: 12px; margin: 16px 0 8px; font-size: 13px; color: var(--color-text-muted); }
  .fsep::before, .fsep::after { content: ""; flex: 1; height: 1px; background: var(--color-border); }
  /* the edition prompt (D-03): a banner inside the sheet, games listed as compact rows */
  .edp { margin-top: 16px; padding: 12px; border: 1px solid var(--stroke); border-radius: 8px; }
  .edp p { margin: 0 0 8px; font-size: 14px; line-height: 1.4; }
  .edp .srow { min-height: 48px; padding: 4px 0; }
  .edp .eacts { display: flex; justify-content: flex-end; gap: 8px; margin: 8px -12px -4px 0; }
  .device.kbd .sheet.full, .device.kbd .sheet.form { bottom: 292px; padding-bottom: 0; }

  /* ---- editor stand-in (the real screen is sketch 063) ---- */
  .ehead { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
  .ehead .cov { width: 56px; height: 60px; border-radius: 6px; }
  .ehead h2 { margin: 0; font-size: 22px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
  .enote { margin-top: 24px; padding: 16px; border: 1px dashed var(--stroke); border-radius: 8px; font-size: 14px; line-height: 1.5; color: var(--color-text-muted); }
  /* stand-in blocks: only to give the page 063's real length, which is what justifies the pinned bar */
  .estub { height: 180px; margin: 8px -16px 0; background: repeating-linear-gradient(135deg, var(--color-surface) 0 10px, transparent 10px 20px); border-radius: 8px; }

  /* ---- dialog (D-19f) ---- */
  .dscrim { position: absolute; inset: 0; z-index: 60; background: color-mix(in srgb, #231339 38%, transparent); display: grid; place-items: center; padding: 24px; opacity: 0; pointer-events: none; transition: opacity var(--duration-base); }
  .dscrim.open { opacity: 1; pointer-events: auto; }
  .dialog { width: 100%; max-width: 312px; background: var(--color-bg); border-radius: 16px; padding: 24px 24px 12px; box-shadow: var(--shadow-lg); transform: scale(.96); transition: transform var(--duration-base) var(--ease-out-soft); }
  .dscrim.open .dialog { transform: none; }
  .dialog h2 { margin: 0 0 8px; font-size: 18px; font-weight: 600; line-height: 1.3; }
  .dialog p { margin: 0 0 16px; font-size: 14px; line-height: 1.45; color: var(--color-text-muted); }
  .dacts { display: flex; justify-content: flex-end; gap: 8px; margin-right: -12px; }
  .tbtn.dan { color: var(--color-danger); }

  /* ---- snackbar (D-19b/c) ---- */
  .snack { position: absolute; left: 12px; right: 12px; bottom: 79px; z-index: 30; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 4px 4px 4px 16px;
    background: var(--color-text); color: var(--color-bg); border-radius: 8px; font-size: 14px; opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity var(--duration-base), transform var(--duration-base) var(--ease-out-soft); }
  .snack.show { opacity: 1; transform: none; pointer-events: auto; }
  .snack span { flex: 1; padding: 8px 0; }
  .snack .tbtn { color: var(--color-accent-bg); }
  .snack .x { width: 44px; height: 44px; border: 0; background: none; color: var(--color-bg); display: grid; place-items: center; cursor: pointer; }
  .snack .x svg { width: 18px; height: 18px; }
  .snack [hidden] { display: none; }

  .kbd-sim { position: absolute; left: 0; right: 0; bottom: 0; height: 292px; z-index: 25; background: #d2d4da; display: none; padding: 10px 4px; }
  :root[data-theme="dark"] .kbd-sim { background: #2b2b30; }
  .device.kbd .kbd-sim { display: grid; grid-template-rows: repeat(4, 1fr); gap: 10px; }
  .kbd-sim .krow { display: flex; gap: 5px; justify-content: center; }
  .kbd-sim .k { flex: 0 0 31px; border-radius: 5px; background: #fff; box-shadow: 0 1px 0 rgba(0,0,0,.3); display: grid; place-items: center; font: 17px system-ui; color: #111; }
  :root[data-theme="dark"] .kbd-sim .k { background: #6b6b70; color: #fff; }
  .kbd-sim .k.wide { flex-basis: 180px; font-size: 12px; }

  /* ---- 076: the fresh row's own treatment ----
     V2 and V3 both need to say "this is the one you just made". It is the SAME anatomy in both (d17's one
     list, d19h's dot + text) so the axis stays "where", never "what it looks like": a row-width tonal wash
     plus the `sub` line the row already had. No new left edge, no badge, no pill. */
  .row.fresh { background: var(--color-accent-bg); }
  .row.fresh .name { font-weight: 600; }
  /* V3's pinned block: the new game rendered above every section. It reuses .lgroup/.lhw/.lhead verbatim so
     it cannot accidentally become a fourth kind of header — the only new thing is that it exists at all. */
  .sgnone { margin: 0; padding: 14px 16px; color: var(--color-text-muted); font-size: 14px; }
  #tools { position: fixed; right: 12px; top: 12px; z-index: 99; font: 12px system-ui; background: rgba(0,0,0,.72); color: #fff; padding: 6px 10px; border-radius: 8px; }
  #tools .vt { background: none; }
  #tools .vt.on { background: #fff; color: #000; }
  #tools .stp { border-color: rgba(255,255,255,.65); }
  #tools .stp[disabled] { opacity: .35; cursor: default; }
  #tools .now { opacity: .72; font-size: 11px; }
  #tools > div + div { margin-top: 4px; }
  #tools button.on { background: #fff; color: #000; }
  #tools button { font: inherit; color: #fff; background: none; border: 1px solid rgba(255,255,255,.3); border-radius: 6px; padding: 2px 8px; cursor: pointer; }

  /* ---------- decision 32: the press state ----------
     Measured before building: the page had 8 `:hover` rules, 6 `:focus-visible` and **ZERO `:active`**, so a
     press painted byte-identical to a hover. On a pointer that is harmless — the hover already painted. On
     TOUCH there is no hover at all, so the only feedback a tap got was the platform's own highlight, and
     `-webkit-tap-highlight-color` was authored NOWHERE: every tappable surface sat at the platform default
     (rgba(51,181,229,0.4), Android's Holo cyan, under touch emulation). That cyan appears nowhere in this palette.

     The property INHERITS, so suppressing it at the root covers every surface at once — including ones added
     later, which is why it is not enumerated per selector. */
  :root { -webkit-tap-highlight-color: transparent; }

  /* ONE press token, --color-surface-2, on every pressable surface. Rejected: press = the hover fill (lightest
     of the options — #F1ECFD on white, which a ~100ms tap on a phone in daylight can miss), and press = one
     step PAST hover everywhere (reads three ranks on a pointer, but needs a fabricated rgb(188,177,210) on the
     pinned caption, a value that exists nowhere else in the system).
     The accepted cost: a POINTER pressing a PINNED collapsible caption reads press == hover, because that
     caption's hover is already surface-2. It is the narrowest case on the page and touch never reaches it —
     touch, which is what this state exists for, has no hover to collide with. */
  .row:active,
  .ibtn:active,
  .dlink:active,
  .sh-x:active,
  .srow:active,
  .tbtn:active { background: var(--color-surface-2); }
  /* the caption paints through its band pseudo-element, never its own box (decisions 27/29/31).
     transition-duration 0s on the way IN: the band fades over 120ms, longer than a quick tap, so a
     transitioned press fill would show only partly faded — or, on a fast tap, not at all. */
  .lhead.tap:active::before,
  .lhw.pinned .lhead.tap:active::before { background: var(--color-surface-2); transition-duration: 0s; }
  @media (prefers-reduced-motion: reduce) { .lhead.tap:active::before { transition: none; } }


  /* ---------- 078: the editor, ported from 073/075 rather than redrawn ----------
     d33's spine rule, unchanged: every club value is a ROW that opens a sheet. The rows are the same
     anatomy 075 drew; what is new below them is the gate. */
  .ghead { display: flex; gap: 14px; align-items: flex-start; padding: 2px 0 18px; }
  .ghead .cov { width: 64px; height: 68px; border-radius: 7px; object-fit: cover; flex-shrink: 0; background: var(--color-surface); display: grid; place-items: center; }
  .ghead .cov.l { font-size: 26px; }
  .ghead .cov.none svg { width: 26px; height: 26px; }
  .gh-t { flex: 1; min-width: 0; }
  .gh-name { font-size: 22px; font-weight: 600; line-height: 1.22; overflow-wrap: anywhere; }
  .gh-meta { color: var(--color-text-muted); }
  /* 075:886 verbatim — the lifecycle is a dot + text, and it is a READ-OUT, never a control. */
  .gh-st { margin-top: 4px; display: flex; align-items: center; gap: 6px; font-size: 13px; flex-wrap: wrap; }
  .gh-st .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .gh-st .dot.ok { background: var(--color-success); }
  .gh-st .dot.warn { background: var(--warn); }
  .gh-st .dot.off { background: var(--color-text-muted); }
  .gh-sep { color: var(--color-text-muted); }

  .glabel { font-size: 13px; font-weight: 600; color: var(--color-text-muted); letter-spacing: .01em; padding: 22px 0 8px; }
  .frows { margin: 0 -16px; }
  .frow { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 16px;
    border: 0; background: none; text-align: left; position: relative; cursor: pointer; }
  .frow + .frow::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--color-border); }
  .frow:hover { background: var(--color-surface); }
  .frow:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }
  .fr-t { flex: 1; min-width: 0; }
  .fr-k { display: block; font-size: 15px; font-weight: 500; line-height: 1.3; color: var(--color-text); }
  .fr-v { display: block; font-size: 14px; line-height: 1.32; margin-top: 2px; color: var(--color-text-muted); overflow-wrap: anywhere; }
  .fr-v.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .fr-v.empty { font-style: italic; }
  /* ---------- G3's ONLY paint: the missing value is marked on its own row ----------
     G1 and G2 speak in a container of their own; G3 has none, so the row is where it speaks. It is the
     SAME dot the status line uses (D-19h), not a new anatomy and not a badge. Check 6 asserts it appears in
     G3 alone, and only on rows the gate actually names. */
  .frow .miss { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex-shrink: 0; }

  /* ---------- the action bar (d42), copied from 073/075 ---------- */
  .savebar { position: absolute; left: 0; right: 0; bottom: 67px; z-index: 19; display: flex; gap: 10px; align-items: center;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--color-bg); border-top: 1px solid var(--color-border); }
  .device.kbd .savebar { bottom: 0; }

  .savebar .why:empty { display: none; }
  .btn { min-height: 44px; padding: 0 18px; border-radius: 10px; border: 0; font-size: 15px; font-weight: 600;
    background: var(--color-primary); color: var(--color-primary-content);
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; cursor: pointer; }
  :root[data-theme="dark"] .btn { background: var(--color-accent-text); color: #1b1024; }
  .btn:active { filter: brightness(.92); }
  .btn.ghost { background: none; color: var(--color-accent-text); padding: 0 12px; }
  .savebar .btn:not(.ghost) { margin-left: auto; }
  /* d42: the primary always ends at the same edge. 075 used opacity .42 for the dead state; G1 keeps it
     rather than inventing a sixth treatment, and the README records that this is the SIXTH disabled control
     against 064's outright ban — counted, not waved through. */
  .btn[disabled] { opacity: .42; cursor: default; }

  /* ---------- G1's line: what is missing, in the bar, beside the dead button ---------- */
  .savebar .why .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-right: 6px; vertical-align: 1px; }

  /* ---------- the field sheets (075) ---------- */
  .sh-body { padding: 0 16px 8px; }
  .opt { width: 100%; display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 16px; margin: 0 -16px; border: 0; background: none; text-align: left; cursor: pointer; }
  .opt:hover { background: var(--color-surface); }
  .opt:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }
  .opt .ot { flex: 1; min-width: 0; }
  .opt .on2 { font-size: 16px; }
  .opt .os { display: block; font-size: 13px; color: var(--color-text-muted); margin-top: 2px; line-height: 1.35; }
  .opt .tick { width: 22px; height: 22px; color: var(--color-primary); flex-shrink: 0; }
  :root[data-theme="dark"] .opt .tick { color: var(--color-accent-text); }
  .stepper { display: flex; align-items: center; gap: 2px; justify-content: center; padding: 8px 0 4px; }
  .stepper button { width: 44px; height: 44px; border: 1px solid var(--stroke); background: none; border-radius: 10px; display: grid; place-items: center; cursor: pointer; }
  .stepper button svg { width: 18px; height: 18px; }
  .stepper .n { min-width: 48px; text-align: center; font-size: 17px; font-weight: 600; }
  .fld { width: 100%; height: 48px; padding: 0 14px; border: 1px solid var(--stroke); border-radius: 8px; background: var(--color-bg); font-size: 16px; outline: none; }
  .fld:focus { border-color: var(--color-primary); box-shadow: 0 0 0 1px var(--color-primary); }
  textarea.fld { height: auto; min-height: 96px; padding: 12px 14px; line-height: 1.45; resize: none; }

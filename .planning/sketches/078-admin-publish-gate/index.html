<script>
/* ---------- icons ---------- */
const P = {
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  chevR: '<path d="M9 5l7 7-7 7"/>',
  chevL: '<path d="M15 5l-7 7 7 7"/>',
  chevD: '<path d="M5 9l7 7 7-7"/>',
  inbox: '<path d="M4 13h4l2 3h4l2-3h4"/><path d="M5.5 5h13l2.5 8v5a2 2 0 0 1-2 2h-14a2 2 0 0 1-2-2v-5z"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  home: '<path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/>',
  shelf: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18"/>',
  dice: '<rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/>',
  img: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M4 17l5-4 4 3 3-2 4 3"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  file: '<path d="M14 3v5h5"/><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/>',
  down: '<path d="M12 5v13M6 13l6 6 6-6"/>',
  tick: '<path d="M4 12.5l5.5 5.5L20 7"/>',
  minus: '<path d="M5 12h14"/>'
};
const ic = (n, s = 1.7) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${s}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };

/* ---------- data: the 434 published games + 1 draft, exactly as the dev DB has them ----------
   The fixture's 49 thumb-less games ARE the 49 incomplete ones (no cover, no description, no year) — verified
   against pukllay_club_dev. They were bulk-imported 2026-08-10, so newest-first puts them at the bottom. */
let G = GAMES067.map((x, i) => ({
  id: i + 1, name: x.n, thumb: x.t, hue: hue(x.n),
  year: x.t ? x.y : null,               /* the 49 have no year either */
  gap: !x.t,                            /* "sin datos": no cover, no description */
  status: 'published',
  added: x.t ? 2000 + i : 0             /* the 49 all share the oldest timestamp */
}));
/* 077 — the standing draft is NOT Ark Nova any more. 342942 really is Ark Nova's BGG id, so when the walk's
   game finished enriching, the sheet said "Ark Nova agregado" directly above TWO identical `Ark Nova · 2021`
   rows and nothing on screen could say which one the sheet was about. A fixture that makes the round's own
   subject ambiguous is a fixture bug, not a finding — d3's edition prompt only ever fires for ids 1 and 2. */
G.push({ id: 900, name: 'Beyond the Sun', thumb: null, hue: hue('Beyond the Sun'), year: 2020, gap: false, status: 'draft', added: 999999, enr: 'enriched' });

/* ---------- 076: the walk's own state, and it is REAL state, not a fixture switch ----------
   071 had an `ENR` toggle that painted `pending`/`failed` onto the existing Ark Nova draft, because the dev DB
   has zero rows in either state. That is gone. This round CREATES a game and then advances it, so every
   measurement below is about the row the walk actually made — 075's lesson, where the first version of a
   data-loss check failed while the fix was correct because it was measuring the tool panel.

   That machinery is kept verbatim; 077 walks one step further along the same scenario. */
/* ---------- 076 IS DECIDED, SO ITS AXIS IS GONE FROM THE PAGE ----------
   076 chose V2 Se abre + the completion toast (d55). Per 072's convention — *"every variant toggle is
   removed once its question is answered, so what is on screen is the decision, not a menu of them"* — the
   three body-homes and the toast on/off switch are NOT carried forward as toggles. What they settled is now
   simply how the page behaves:
     · creating a draft OPENS `Borradores` and scrolls the new row into view      (V2, d55; d18 amended)
     · the new row is washed `.fresh`                                             (V2/V3's shared paint)
     · the completion announces itself                                            (the toast, d54)
   076 is still on disk and navigable if any of that needs re-feeling.

   NEW is the id `addGame` minted. It survives every render and is cleared only by ↺. */
let NEW = null;

/* ---------- 077's AXIS: when the sheet is open and the data lands, WHO SPEAKS? ----------
   From the developer, and it settles the sheet's content by fiat rather than by variant:
     *"Since I want to do it simple, until the data is retrieved if I tap that row, can I get a bottom sheet
       with a simple 'working' status?"*  and then
     *"When the data arrives this should says 'Game name agregado' and allow me to edit(ver)."*

   BOTH HALVES WERE CHECKED BEFORE ANYTHING WAS DRAWN, and they had different status:

     · a bottom sheet — the idiom EXISTS and is cheap. `openSheet` is already here, D-19e governs it (44px ✕,
       no Cancelar row), and — the part that decides it — THE LIST SCREEN ALREADY HAS THE LIVE SIGNAL:
       index.ex:41-43 subscribes to "admin:games" and index.ex:195-198 handles {:game_enriched, game_id}.
       `form.ex` has NO subscribe and NO handle_info at all. So a sheet on the list is strictly cheaper to
       build than the editor route, and it SIDESTEPS the name-clobber defect rather than repairing it: you
       never open the form, so there is no stale `name` for `admin_changeset` to write back over BGG's.

     · a "working" status — ALREADY SAID, by the row you just tapped. d24 put `● Trayendo datos de BGG…` on
       the row's second line (sub(), below); the shipped app says `Juego #<bgg_id> (cargando…)`
       (index.ex:241). A sheet that only repeats it costs a tap and adds nothing. The SAME SHAPE as 076
       round 5, where "a syncing status on that row" turned out to be built already.

   SO THE SHEET HAS TO EARN ITS TAP ON THE ARRIVAL, NOT ON THE WAIT — it is the one container that is on
   screen at the exact moment the state changes. And that is what creates this round's question, because the
   transformed sheet and d55's toast are now THE SAME ANNOUNCEMENT: both name the game, both offer `Ver`.
   The toast's suppression rule only ever covered the editor (`S.screen === 'editor'`, 076:1114), so on the
   list NOTHING stops them firing together.

   ---- DECIDED 2026-09-21: AV1 sólo la hoja (decision 56) ----
   AV2 and AV3 stay on the page and navigable; the winner is marked, not the only option.

     AV1 sólo la hoja ★ the sheet transforms; the toast is suppressed for the game whose sheet is open.
                        Check 25's rule — "the announcement never lands on top of its own subject" —
                        reaching one more container rather than a new rule.
     AV2 los dos        both fire. THE DO-NOTHING BASELINE: this is what you get if nobody writes the
                        suppression, and it is what the code would do today. Every guard below is
                        negative-tested against it.
     AV3 se retira      the sheet CLOSES on arrival and the toast is the announcement — the reading where
                        the sheet is only ever a waiting room.

   One axis: who announces the arrival while the sheet is open. The sheet's CONTENT is identical in all
   three (check 11), so nothing found here can be blamed on treatment.

   WHY AV1. AV2 loses under BOTH readings of its own defect — as built the toast is emitted behind the sheet
   and burns its 10000ms unseen (checks 19b/19c: .snack z-index 30 under .backdrop 40 and .sheet 41), and
   with the z-order raised it becomes two announcements about one game stacked on each other, which is what
   check 25's rule exists to prevent.

   AV1 DOMINATES AV3 rather than merely beating it, and the reason is structural: `render()` runs before the
   sheet repaints, so the row behind the sheet is ALREADY the finished row. AV1 therefore gives you AV3's
   result PLUS an announcement that persists — measured at t+10.4s, AV1 still says "Ark Nova agregado" while
   AV3's page says nothing at all (checks 32-33), which is 076 round 1's question returning intact. AV3's
   only advantage is that the scrim is gone and the list is bright again.

   AND AV1 DEGRADES CORRECTLY: the suppression is conditioned on `S.sheetFor`, which `closeSheet` clears, so
   closing the sheet before the data lands puts the toast back. The toast is silenced only while you are
   actually looking at the thing it would announce — which is check 25's rule, not a new one. */
let AV = 'AV1';   /* 077 is DECIDED (d56, AV1 sólo la hoja) — kept so the arrival still behaves, not a toggle */

/* ---------- 078's AXIS: the draft is incomplete and you reach for Publicar. WHO STOPS YOU, AND HOW? ----
   G1 bloquea · G2 avisa · G3 la ficha (the do-nothing baseline). See the head comment for what the gate
   REQUIRES, which is measured rather than varied. */
let GATE = 'G1';

/* ---------- the tool panel's two falsifiability levers, neither of them a variant ----------
   NAME_BROKEN  paints the real id-873 string over the fixture's name. It exists to make ONE claim
                falsifiable — *the gate cannot tell a bad name from a good one* — and check 8 asserts the
                gate's items are byte-identical under both. It is a PRODUCTION BUG (bgg_client.ex:130's
                `.//` + SweetXml `s`), filed separately, and the gate is deliberately NOT designed around it.
   IS_EXP       flips the walk's game to an expansion. 0 of 26 published expansions carry a nivel and
                408 of 408 base games do, so the gate's one condition must VANISH for an expansion in all
                three variants (check 9). Without this lever "the gate requires nivel" is unfalsifiable. */
let NAME_BROKEN = false, IS_EXP = false;
const BROKEN_NAME = 'HellasDutch/English/French/German editionEnglish/Korean edition';

/* d42's three club values, and which of them the gate is allowed to name.
   MEASURED, NOT CHOSEN — see the head comment's table. `copias` is absent on purpose: 434 of 434 published
   games have exactly 1, so it is a MISSING DEFAULT (units has no DB default, enrichment never casts it,
   admin_changeset lets a blank through) and the editor pre-fills it rather than the gate blocking on it.
   `estante` is absent because 433 of 434 published games would fail a gate that named it. */
const UNITS_DEFAULT = 1;
function missing(g) {
  if (!g || g.status !== 'draft') return [];
  const out = [];
  /* the marcador is the ONLY name failure any rule can detect. The id-873 string is not one — that is the
     point of NAME_BROKEN, and check 8 is where it is asserted rather than asserted away. */
  if (g.name === `Juego #${g.bgg_id}`) out.push({ k: 'name', n: 'el nombre' });
  /* 408/408 base games carry a nivel · 0/26 expansions do. The condition is the club's own rule, read off
     its own catalogue, not a preference. */
  if (!g.is_expansion && !g.weight_band) out.push({ k: 'weight_band', n: 'el nivel' });
  return out;
}
/* 073:46's rule, KEPT VERBATIM and not a variant: a game with no BGG data cannot be published in any of the
   three (check 10). 075's `hasData()` was the whole of the drawn gate; this slice adds the club half to it
   rather than replacing it. */
const hasData = g => enrOf(g) === 'enriched';
const gateOpen = g => hasData(g) && missing(g).length === 0;

const enrOf = g => g.enr || 'enriched';
const byId = id => G.find(g => g.id === id);
const TOTAL = () => G.length;
const GAPS = () => G.filter(g => g.gap);
const DRAFTS = () => G.filter(g => g.status === 'draft');
let PEND_MODE = 50;
const pend = () => PEND_MODE === 50 ? GAPS().length + DRAFTS().length : PEND_MODE;
/* newest first (decision 3) */
const byNew = () => [...G].sort((a, b) => b.added - a.added);

const PAGE = 50;
const S = { screen: 'juegos', shown: PAGE, q: '', kept: null, recent: [], open: { gap: false, draft: false }, sheetFor: null };
let KBD_SIM = true, opener = null;

const main = $('#main'), device = $('#device');
/* 076, found in a screenshot of the `falló` step and sent back as a fix rather than drawn around:
   a FAILED game was getting the decorative letter tile. 071's fall-through is thumb -> `.none` (the grey image
   glyph, for `gap` games) -> a coloured initial. The new game is not `gap` — that flag means "imported without
   data", which this game is not — so a row whose enrichment had just DIED rendered a cheerful green "J" beside
   the words "Error al traer datos de BGG". In the shipped app that game has no cover at all, exactly like the
   49, so the honest tile is `.none`.
   Stated as a rule rather than a special case: a cover exists only once enrichment has succeeded. */
/* a function DECLARATION, not a const arrow, so the harness can swap it for 071's predicate and prove the
   guard fails without it. A top-level `const` is a lexical binding the page's own closures capture directly —
   it is not on `window` and cannot be overridden from outside, which silently made the first negative test
   pass while changing nothing. */
function noCover(g) { return !g.thumb && enrOf(g) !== 'enriched'; }
const cover = (g, cls = 'cov') => enrOf(g) === 'pending'
  ? `<span class="${cls} skel" aria-hidden="true"></span>`
  : g.thumb
  ? `<img class="${cls}" src="${esc(g.thumb)}" alt="" loading="lazy">`
  : (g.gap || window.noCover(g)) ? `<span class="${cls} none" aria-hidden="true">${ic('img')}</span>`
    : `<span class="${cls} l" style="--h:${g.hue}" aria-hidden="true">${esc(g.name[0])}</span>`;
const jn = n => n === 1 ? '1 juego' : `${n} juegos`;

/* decision 8 — the three groups PARTITION the catalog (49 + 1 + 385 = 435); a game is never in two of them */
/* decision 18 — the two EXCEPTION sections close at rest, so the catalog is not 50 rows down. `shut` marks a
   section as collapsible AND collapsed by default; the body section has no `shut`, so it never collapses and the
   empty-page state decision 15 found stays unreachable. */
const GROUPS = [
  { key: 'gap', name: 'Sin datos', shut: true, hint: 'Se ven en la web sin tapa ni descripción.', has: g => g.status !== 'draft' && g.gap },
  { key: 'draft', name: 'Borradores', one: 'borrador', shut: true, hint: 'Todavía no se ven en la web.', has: g => g.status === 'draft' },
  { key: 'rest', name: 'Juegos del club', hint: null, has: g => g.status !== 'draft' && !g.gap }
];
const inGroup = k => byNew().filter(GROUPS.find(x => x.key === k).has);

/* a row's second line: the year. The GROUP names the state, so a row never repeats it — inside "Sin datos"
   all 49 rows saying "● Sin datos" under a heading that already says it was pure noise. */
/* decision 24 — enrichment is the row's SECOND LINE, the slot the year already occupies, as a dot + text
   (D-19h). No new anatomy, no new left edge. It does NOT repeat the section's state — a draft is a draft whether
   or not BGG answered — which is what decision 1 actually objected to.
   The row keeps its chevron and nothing else: D-19i reserves the trailing slot for "opens a page" and decision 2
   says picking a game opens its editor, so Reintentar belongs in the editor, not in the row. */
function sub(g) {
  const e = enrOf(g);
  if (e === 'pending') return '<span class="dot"></span>Trayendo datos de BGG…';
  if (e === 'failed') return '<span class="dot err"></span>Error al traer datos de BGG';
  return g.year ? esc(String(g.year)) : '';
}
/* pending arrives BEFORE the name does: draft_changeset writes the placeholder "Juego #<bgg_id>"
   (game.ex:159-166). 071 hardcoded that string; here the created row carries its own, so the walk's name is
   the one the app would really have written. */
const rowName = g => esc(g.name);
/* `fresh` is the ONLY thing V2 and V3 add to a row, and both add exactly the same thing — so a finding about
   WHERE the row is cannot be blamed on how it is painted. In V1 it is never applied (check 3 asserts it). */
/* ---------- 077: a pending row opens a SHEET, so D-19i takes its chevron away ----------
   D-19i is explicit, and it is the rule that decides this rather than taste: *"a chevron means THIS ROW
   OPENS ANOTHER PAGE. Rows that act in place (show an answer, open a sheet) have none."* 076's comment on
   this very line invoked the other half of it — *"a game row opens its editor (decision 2), so it has one"*
   — which stops being true for a pending row the moment the sheet exists.

   THE COST IS REAL AND IS COUNTED, NOT WAVED THROUGH (check 8): the pending row becomes the ONLY game row
   in a 435-row list without a trailing chevron. Either it honestly signals that this row goes nowhere, or
   the list's rhythm wobbles on exactly one row. The measurement is which of those it looks like. */
/* a function DECLARATION called through `window`, never a top-level const — 076 documented the trap twice:
   a top-level `const`/`let` is a LEXICAL BINDING, not a property of `window`, so the page's own closures
   capture it directly and a harness assignment changes nothing while appearing to. Both of 076's first
   negative tests passed against an unmodified page for exactly that reason. Check 4 restores the chevron
   through this hook and asserts check 3 goes red. */
function opensSheet(g) { return enrOf(g) === 'pending'; }
const gameRow = g => { const p = window.opensSheet(g); return `<button class="row${g.id === NEW ? ' fresh' : ''}" data-act="${p ? 'pending' : 'open'}" data-id="${g.id}" aria-label="${esc(g.name)}">
  ${cover(g)}<span class="txt"><span class="name">${rowName(g)}</span>${sub(g) ? `<span class="sub">${sub(g)}</span>` : ''}</span>
  ${p ? '' : `<span class="chev" aria-hidden="true">${ic('chevR')}</span>`}</button>`; };

/* ---------- screens ---------- */
/* decision 6 — the compact bar mirrors the page's own back link + title. Exactly ONE of the two back controls is
   focusable at a time (inert on the other), so the accessibility tree never carries a duplicate "Juegos". */
const BAR = { juegos: { back: null, title: 'Juegos' } };
function renderBar() {
  const b = S.screen === 'editor'
    ? { back: 'Juegos', title: byId(S.editing).name }
    : BAR[S.screen];
  $('#pbar').innerHTML = (b.back ? `<button class="back" data-act="juegos">${ic('chevL')}${esc(b.back)}</button>` : '')
    + `<span class="pbt">${esc(b.title)}</span>`;
}
function render() {
  /* the bar belongs to the editor alone. Hidden FIRST, so a render that lands on the list can never leave a
     bar from the previous screen on top of it — the shape 076 found when ↺ deleted the game the editor was
     about and the next render ran against a missing id. */
  const sb = $('#savebar'); if (sb) { sb.hidden = true; sb.innerHTML = ''; }
  if (S.screen === 'juegos') renderJuegos();
  else if (S.screen === 'editor') renderEditor();
  $('#t-juegos').innerHTML = ic('dice'); $('#t-admin').innerHTML = ic('grid');
  $('#t-web').innerHTML = ic('home'); $('#t-est').innerHTML = ic('shelf');
  device.dataset.bar = S.screen === 'juegos' ? 'search' : 'title';
  renderBar(); updateBar();
}

let lastY = 0;
const HIDE_AFTER = 140;   /* past the title row; the search is stuck from ~116 */

/* the pinned tier takes over once the title row has gone behind it.
   Juegos pins the search itself (decision 7); every other screen pins the back + title bar. */
const scroller = () => $('#scroller');
function updateBar() {
  const search = main.querySelector('.search');
  if (search) {                                   /* Juegos: the field is the pinned tier */
    /* sticky top:0 pins to the SCROLLER's top edge, not the viewport's — compare against that, not 0 */
    const sc = scroller(), y = sc.scrollTop, scTop = sc.getBoundingClientRect().top;
    search.classList.toggle('stuck', search.getBoundingClientRect().top - scTop <= 0.5);
    /* decision 9 — hide going down, show going up. Never while the field has focus (its dropdown is open),
       and never near the top, where the search belongs to the resting layout. */
    const dy = y - lastY;
    if (y <= HIDE_AFTER || document.activeElement === $('#q')) device.classList.remove('hidesearch');
    else if (Math.abs(dy) > 6) device.classList.toggle('hidesearch', dy > 0);
    lastY = y;
    /* Franjas A/B need to know when a heading has actually pinned, so it can gain a background only there.
       Sticky pins to the SCROLLER's top edge offset by --bar, never the viewport's. */
    const barPx = parseFloat(getComputedStyle(device).getPropertyValue('--bar')) || 0;
    main.querySelectorAll('.lhw').forEach(w => {
      const sec = w.closest('.lgroup').getBoundingClientRect();
      /* held at the bar = its top has reached the bar AND its own section still extends past it. Without the
         second half, a header that has scrolled entirely out of view still counts as pinned — three at once. */
      w.classList.toggle('pinned', w.getBoundingClientRect().top - scTop <= barPx + 0.5 && sec.bottom - scTop > barPx + 0.5);
    });
    device.classList.remove('scrolled'); $('#pbar').inert = true;
    return;
  }
  /* the element that must scroll away before the bar takes over: the title row, or the editor's game head */
  const ph = main.querySelector('.ehead'); if (!ph) return;   /* decision 22 — Juegos has no title row */
  const on = scroller().scrollTop > ph.offsetTop + ph.offsetHeight - 44;
  device.classList.toggle('scrolled', on);
  $('#pbar').inert = !on;
  const inPage = main.querySelector('.back'); if (inPage) inPage.inert = on;
}

/* decision 8 — one list, three collapsible groups. The two work groups sit on top, collapsed by default, so at
   rest both counts are on screen AND the newest-first catalog starts immediately. No Pendientes page, no badge.
   The caret is LEADING and rotates (decision 10): a disclosure triangle, never a trailing "›", which under
   D-19i means "opens a page". */
/* decision 17 — ONE LIST. The page is a single continuous list whose sections happen to hold different content,
   not a block of work groups plus a catalog. Every section header is the SAME caption — a span, no caret, no
   control, 13/600 muted at 16, sticky, gaining its fill only when it pins — so the rhythm is uniform by
   construction. This is the iOS plain-table / Contacts model the BENCHMARK already records, and it supersedes
   the whole band negotiation: decisions 10, 11, 13, 14 and 15 existed only because there were TWO kinds of
   header. There is now one. Decision 16's caption rank survives, generalised to every section. */
function groupSection(g) {
  const all = inGroup(g.key), paged = g.key === 'rest' ? all.slice(0, S.shown) : all;
  const open = !g.shut || !!S.open[g.key];
  /* ONE anatomy still (decision 17): same tag family, rank, colour, height and 16 keyline. The only difference
     is a disclosure caret, which is the thing that TELLS you a section collapses — honest signalling, not a
     second kind of header. It sits INLINE after the count, so there is no leading slot and therefore no hole in
     the x=16 column (decision 16's defect). The hit box is stretched to 44 by a pseudo-element so the caption's
     visual rhythm is not loosened to reach the touch floor. */
  /* decision 24 — a failure inside a CLOSED section is otherwise invisible: measured, the row is not even in
     the DOM at rest. The caption carries it as the SAME dot + text a row would use (D-19h), never a badge — and
     only while closed, since an open section shows the rows themselves. Costs the resting page nothing.
     This is decision 18's move again: an optional affordance on ONE anatomy, not a second kind of header. */
  const bad = all.filter(x => enrOf(x) === 'failed').length;
  const warn = (bad && !open) ? `<span class="warn"><span class="dot err"></span>${bad} con error</span>` : '';
  const head = g.shut
    ? `<button class="lhead tap" data-act="group" data-g="${g.key}" aria-expanded="${open}">
        <span class="ln">${g.name}</span><span class="cnt">${all.length}</span>${warn}
        <span class="caret" aria-hidden="true">${ic('chevD')}</span></button>`
    : `<span class="lhead"><span class="ln">${g.name}</span><span class="cnt">${all.length}</span></span>`;
  return `<section class="lgroup${g.key === 'rest' ? ' main' : ''}${open ? '' : ' shut'}">
    <h2 class="lhw">${head}</h2>
    ${open && g.hint ? `<p class="hint">${g.hint}</p>` : ''}
    ${open ? `<div class="rows">${all.length ? paged.map(gameRow).join('') : `<p class="snone">No hay ${g.name.toLowerCase()}.</p>`}</div>
    ${g.key === 'rest' && S.shown < all.length ? `<div class="more"><button class="tbtn" data-act="more">Mostrar más</button><span class="cap">${S.shown} de ${all.length}</span></div>` : ''}` : ''}
  </section>`;
}

/* decision 22 — no resting page title: the tab bar names the page, the field leads it, and the + keeps the
   header icon's right edge beside the field. The h1 stays in the accessibility tree as .sr. */
function renderJuegos() {
  main.innerHTML = `
    <h1 class="sr">Juegos</h1>
    <div class="search">
      <div class="srow-wrap">
        <div class="sfield">
          <input id="q" type="search" placeholder="Buscá un juego" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="sugg" aria-label="Buscá un juego">
          <span class="sico" id="sico" aria-hidden="true">${ic('search')}</span>
          <div class="sugg" id="sugg" role="listbox" hidden></div>
        </div>
        <button class="ibtn" data-act="add" aria-label="Agregar un juego">${ic('plus')}</button>
      </div>
    </div>
    ${GROUPS.map(groupSection).join('')}`;
}

/* ---------- 078: the editor, drawn for real ----------
   077's stub said "el editor del juego — sketch 063. No se vuelve a dibujar en este sketch". This slice IS
   about the editor, so it is drawn: 075's `ghead` + `DATOS DEL CLUB` rows + d42's action bar, with the gate
   added. Nothing about the rows is new — d33's spine rule (every value is a row that opens a sheet) and the
   status dot + text are both reused verbatim from 075. */

/* 075:746 verbatim — the lifecycle as a dot + text. A READ-OUT in the head, never a control. */
const CYC = { published: { n: 'Publicado', k: 'ok' }, draft: { n: 'Borrador', k: 'warn' }, retired: { n: 'Retirado', k: 'off' } };

const BANDS = [
  { v: '', n: 'Sin nivel', s: 'No aparece en ninguna fila por nivel' },
  { v: 'intro', n: 'Para arrancar', s: 'Se explica en 5 minutos' },
  { v: 'medio', n: 'Intermedio', s: 'Una tarde tranquila' },
  { v: 'estratega', n: 'Ingenio estratega', s: 'Pide pensar varias jugadas' },
  { v: 'experto', n: 'Experto', s: 'Para quien ya tiene rodaje' }
];
/* THE DATABASE HAS EXACTLY ONE SHELF AND EXACTLY ONE GAME ON IT (measured 2026-09-21). 075 drew three
   invented ones; the fixture is corrected to the truth here, because the round's central claim about
   `estante` — that it cannot be a gate — rests on how little it is used. Drawing three shelves would have
   made the catalogue look furnished. */
const SHELVES = [
  { v: '', n: 'Sin ubicar', s: 'Es lo normal: 433 de 434 juegos publicados están así' },
  { v: 'a', n: 'Estante A', s: 'El único estante cargado' }
];
const bandOf = v => BANDS.find(b => b.v === (v || '')) || BANDS[0];
const shelfOf = v => SHELVES.find(b => b.v === (v || '')) || SHELVES[0];

function renderEditor() {
  const g = byId(S.editing);
  const st = CYC[g.status] || CYC.published;
  const meta = [g.year, g.bgg_id ? 'BGG ' + g.bgg_id : null].filter(Boolean).join(' · ');
  const miss = missing(g);
  const missKeys = miss.map(m => m.k);

  /* G3 has no container of its own, so the ROW is where it speaks — the same dot the status line uses
     (D-19h), never a badge. In G1 and G2 the rows are untouched, so a finding about the rows cannot be
     blamed on the gate's paint. Check 6 asserts the dot exists in G3 alone. */
  const r = (key, k, v, empty, clamp) => {
    const flag = GATE === 'G3' && missKeys.includes(key) ? '<span class="miss" aria-hidden="true"></span>' : '';
    return `<button class="frow" data-field="${key}">
      <span class="fr-t"><span class="fr-k">${esc(k)}</span><span class="fr-v${empty ? ' empty' : ''}${clamp ? ' clamp' : ''}">${esc(v)}</span></span>
      ${flag}<span class="chev" aria-hidden="true">${ic('chevR')}</span></button>`;
  };

  /* ---------- `copias` is PRE-FILLED, in every variant, and it is not a gate item ----------
     434 of 434 published games have exactly 1 copy and none varies. `units` has no DB default, enrichment
     never casts it and admin_changeset lets a blank through — so without this the new flow leaves every
     game at nil forever. The fix is a default, not a gate: the row shows 1 and says where it came from.
     Check 7 asserts the value is 1 and that `copias` is NOT among the gate's items in any variant. */
  const units = g.units == null ? UNITS_DEFAULT : g.units;
  const unitsNote = g.units == null ? ' (por defecto)' : '';

  main.innerHTML = `
    <button class="back" data-act="juegos">${ic('chevL')}Juegos</button>
    <div class="ghead">${cover(g, 'cov')}<div class="gh-t">
      <div class="gh-name" id="ghname">${esc(g.name)}</div>
      <div class="gh-st"><span class="dot ${st.k}"></span>${esc(st.n)}${meta ? `<span class="gh-sep">·</span><span class="gh-meta">${esc(meta)}</span>` : ''}</div>
    </div></div>
    ${gateBlockHTML(g, miss)}
    <div class="glabel">DATOS DEL CLUB</div>
    <div class="frows">
      ${r('name', 'Nombre', g.name)}
      ${r('weight_band', 'Nivel', bandOf(g.weight_band).n, !g.weight_band)}
      ${r('units', 'Copias', String(units) + unitsNote)}
      ${r('shelf_id', 'Estante', shelfOf(g.shelf_id).n, !g.shelf_id)}
      ${r('is_expansion', 'Es una expansión', g.is_expansion ? 'Sí' : 'No')}
      ${r('description', 'Descripción en español', g.description || 'Sin descripción', !g.description, true)}
    </div>
    <div style="height:72px"></div>`;

  renderSavebar(g, miss);
}

/* ---------- G3's honesty clause, and the reason it is not simply "nothing" ----------
   G3 is the do-nothing baseline for the GATE, not a licence to hide the state. The rows already carry
   their own holes (the `.miss` dot above) — that IS G3's answer to "how does the unmet requirement reach
   you". No block, no bar copy, no confirm. */
function gateBlockHTML(g, miss) { return ''; }

/* ---------- d42's bar, and the one place the three variants disagree ----------
   The bar itself is IDENTICAL in all three — same height, same position, same two buttons in the same
   order. What differs is exactly two things, and nothing else:
     · whether `Publicar` is disabled            (G1 only)
     · whether the bar carries a `why` line       (G1 only)
   G2 and G3 render a byte-identical bar; they diverge only at the TAP (see `doPublish`). That is
   deliberate: it makes G2 vs G3 a question about the moment of the tap rather than about the resting page,
   which is what the round is actually asking. Check 5 asserts the bar's geometry is the same in all three. */
function renderSavebar(g, miss) {
  const bar = $('#savebar'); if (!bar) return;
  if (g.status !== 'draft') {
    /* not this round's question — the lifecycle of a PUBLISHED game is slice 079. The bar still has to say
       something truthful here, so it says the one thing that is: the changes save. */
    bar.innerHTML = `<button class="btn" data-act="save">Guardar cambios</button>`;
    bar.hidden = false; return;
  }
  const blocked = GATE === 'G1' && !gateOpen(g);
  /* the `why` line names WHAT is missing, never merely THAT something is. A bar that said "faltan datos"
     would make you hunt the rows for which — the defect 076 round 1 found in the create sheet's hint. */
  const why = blocked
    ? (!hasData(g)
      ? `<span class="dot"></span>Todavía estamos trayendo los datos de BGG.`
      : `<span class="dot"></span>Falta ${miss.map(m => m.n).join(' y ')} para publicarlo.`)
    : '';
  bar.innerHTML = `<span class="why">${why}</span>
    <button class="btn ghost" data-act="save">Guardar</button>
    <button class="btn" data-act="publish" id="publish"${blocked ? ' disabled' : ''}>Publicar</button>`;
  bar.hidden = false;
}

/* ---------- the tap, and G2's whole existence ----------
   G1 never gets here while incomplete (the button is dead). G3 publishes straight through — which is
   exactly what `publish_game/1` -> `status_changeset/2` does today: it casts and validates ONLY :status
   (catalog.ex:490-494, game.ex:218-222), so a draft with no nivel goes live. G2 interposes a confirm that
   NAMES what is missing and still lets you through.

   G2's confirm is an `alertdialog`, not a snackbar, because it needs an answer before anything happens —
   d49's own distinction: a toast is a container for events, and this is a question. */
function doPublish() {
  const g = byId(S.editing); if (!g) return;
  const miss = missing(g);
  if (!hasData(g)) return;                       /* 073:46's rule, in every variant */
  /* ---------- FOUND BY THE HARNESS, NOT DRAWN: a disabled button is not a gate ----------
     The first version of G1 lived ENTIRELY in the `disabled` attribute. Check 11d drives step 5 of the
     walk, which calls this function the way any other caller would, and it published a draft with no nivel
     while the button on screen was visibly dead. The paint said no and the code said yes.

     That is not a sketch artefact — IT IS EXACTLY THE SHIPPED SITUATION. `publish_game/1` ->
     `status_changeset/2` casts and validates ONLY `:status` (catalog.ex:490-494, game.ex:218-222), so
     whatever the editor renders, the transition itself has no opinion. G1 is only a real gate if the refusal
     lives HERE, where every caller passes, and is merely REFLECTED in the button.

     Recorded rather than quietly patched, because it is the strongest thing this round learned about what
     "a gate" has to mean in the implementation. */
  if (GATE === 'G1' && miss.length) return;
  if (GATE === 'G2' && miss.length) {
    return openDialog({
      title: 'Publicar sin completarlo',
      text: `Falta ${miss.map(m => m.n).join(' y ')}. Se va a ver en la web igual.`,
      yes: 'Publicar igual',
      run: () => publishNow(g)
    });
  }
  publishNow(g);
}
function publishNow(g) {
  g.status = 'published';
  render();
  snack(`${g.name} se está viendo en la web`);
  walkUI();
}

/* ---------- the search (069) ---------- */
/* decision 4 — one field, three answers: a name searches, a BGG id or link offers to add it,
   no match offers to create it by name. The shipped parser already accepts a number or a BGG link. */
const BGG_RE = /^(?:\s*(\d{2,7})\s*|.*boardgamegeek\.com\/boardgame(?:expansion)?\/(\d{2,7})\b.*)$/i;
const bggId = q => { const m = String(q).match(BGG_RE); return m ? (m[1] || m[2]) : null; };

function markMatch(name, q) {
  const n = norm(q.trim()), i = norm(name).indexOf(n);
  if (i < 0 || !n) return esc(name);
  return esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + n.length)) + '</mark>' + esc(name.slice(i + n.length));
}
const sugRow = (g, q) => `<button class="srow" role="option" data-act="open" data-id="${g.id}">${cover(g)}<span class="txt"><span class="ttl">${markMatch(g.name, q)}</span><span class="sub">${sub(g)}</span></span></button>`;

function renderSugg() {
  const box = $('#sugg'), inp = $('#q'); if (!box || !inp) return;
  const q = inp.value, sico = $('#sico');
  /* a kept name: the magnifier became a ✕ that goes back (069 decision 60) */
  if (S.kept) { box.hidden = true; inp.setAttribute('aria-expanded', 'false'); return; }
  sico.outerHTML = `<span class="sico" id="sico" aria-hidden="true">${ic('search')}</span>`;

  if (!q.trim()) {                                   /* focused + empty → Últimas búsquedas */
    const rec = S.recent.map(byId).filter(Boolean).slice(0, 3);
    if (!rec.length) { box.hidden = true; inp.setAttribute('aria-expanded', 'false'); return; }
    box.innerHTML = `<div class="sglabel">Últimas búsquedas</div>` + rec.map(g => sugRow(g, '')).join('');
    box.hidden = false; inp.setAttribute('aria-expanded', 'true'); return;
  }

  const id = bggId(q);
  if (id) {                                          /* a BGG number or link → add, don't search */
    box.innerHTML = `<button class="srow create" role="option" data-act="addbgg" data-bgg="${esc(id)}">
      <span class="cov">${ic('plus')}</span>
      <span class="txt"><span class="ttl">Agregar desde BGG</span><span class="sub">BGG ${esc(id)} · se agrega como borrador</span></span></button>`;
    box.hidden = false; inp.setAttribute('aria-expanded', 'true'); return;
  }

  /* ROUND 2: the search's "Crear «…»" answer is deleted with `Crear a mano` — same unbuilt path, and leaving
     one of the two live would keep the door open through a different handle. d4's create-aware search keeps
     its OTHER answer: paste a BGG number or link and the dropdown still offers `Agregar desde BGG` (above).
     A name with no match now simply finds nothing, which is the truth. */
  const hits = G.filter(g => norm(g.name).includes(norm(q.trim()))).slice(0, 6);
  box.innerHTML = hits.length
    ? hits.map(g => sugRow(g, q)).join('')
    : `<p class="sgnone">No hay ningún juego con ese nombre.</p>`;
  box.hidden = false; inp.setAttribute('aria-expanded', 'true');
}

/* a new screen always starts at the top — otherwise the bar shows on arrival at a page you never scrolled */
function go(screen) { S.screen = screen; scroller().scrollTop = 0; lastY = 0; device.classList.remove('hidesearch'); render(); }

function openGame(id, from) {
  S.recent = [id, ...S.recent.filter(x => x !== id)].slice(0, 3);
  S.editing = id; S.from = from || S.screen;
  device.classList.remove('kbd'); go('editor');
}

/* ---------- sheets ---------- */
/* 077 — the chrome is a named helper because the pending sheet REPAINTS ITSELF IN PLACE when the data
   lands. Rebuilding that string at the repaint site is how the two copies drift apart, which is the defect
   class this project already has several entries for. One source, two callers. */
function sheetChrome(head, body) {
  return `<div class="sh-top"><div class="grab"></div><div class="sh-head">${head}
      <button class="sh-x" data-act="close" aria-label="Cerrar">${ic('x')}</button></div></div>${body}`;
}
function openSheet(head, body, from, opt = {}) {
  opener = from || null;
  const sh = $('#sheet');
  sh.className = 'sheet' + (opt.full ? ' full' : '') + (opt.form ? ' form' : '');
  sh.innerHTML = sheetChrome(head, body);
  sh.classList.add('open'); $('#backdrop').classList.add('open');
  setTimeout(() => { const f = sh.querySelector('input'); f ? f.focus() : sh.querySelector('button:not(.sh-x)')?.focus(); }, 60);
}
function closeSheet() { S.sheetFor = null; device.classList.remove('kbd'); $('#sheet').classList.remove('open'); $('#backdrop').classList.remove('open'); opener?.isConnected && opener.focus?.({ preventScroll: true }); }

/* decision 4 — the "+" sheet. ROUND 2: the manual path and its separator are gone (see the note below the
   function); what remains is the BGG field, the hint, and `Agregar`.

   ROUND 4 — THE HINT IS DELETED OUTRIGHT, and nothing replaces it. The developer's call, taken with its
   cost stated rather than smoothed over: the `+` path now says NOTHING about the lifecycle before you
   commit, while the SEARCH path still does ("BGG 342942 · se agrega como borrador" in its suggestion row).
   Two doors into one action, one of which warns. That asymmetry is measured by check 16b2 so it stays
   visible instead of becoming folklore, and the 4000ms snackbar afterwards is the only other place it is
   said — in V1, followed by a page with no trace of the game at all.
   What the label and placeholder still carry: `Número o link de BGG` + `342942`, which is the format
   example, and is all a placeholder can honestly hold. The LINK form still has no example here while the
   repair sheet's identical field does (075's idSheet builds d38's worked
   `…/boardgame/155426/…` → `155426`); left as its own slice rather than bolted on.

   SUPERSEDED, kept for the record — rounds 2 and 3 on the hint's TEXT: `Enrichment.attrs_from_bgg_item/1`
   (enrichment.ex:54-72) returns year, min/max players, min/max playtime, playing_time, min_age, description,
   bgg_weight, bgg_rating, bgg_rank, mechanics, themes, designers, artists and publishers, plus the cover via
   `image_attrs/3`. `weight_band` is NOT among them — the only things that ever write the club's `nivel` are
   `admin_changeset` (staff, by hand) and the band-audit tool. So the sheet was promising the one value a
   member still has to fill in themselves, on the screen where they are being told what they get for free.
   "y el nivel" is deleted. Everything else the line claims is true, and "queda como borrador hasta que lo
   publiques" is exactly what `draft_changeset` does (status :draft, game.ex:159).

   NOTE FOR ANYONE EDITING THIS FUNCTION: do not put an HTML comment inside the template literal below.
   `<!--` is a legal HTML-like line comment in a classic script, so it swallows the rest of the line and
   breaks the literal. It happened twice while building this sketch. */
function addSheet(from, prefill) {
  openSheet(
    `<span class="tile" aria-hidden="true">${ic('plus')}</span>
     <div class="sh-txt"><p class="ctx">${TOTAL()} juegos en el club</p><div class="sh-title">Agregar juego</div></div>`,
    `<div class="fbody">
       <label class="flab" for="bg">Número o link de BGG</label>
       <input class="tfield" id="bg" value="${esc(prefill || '')}" placeholder="342942" inputmode="text" autocomplete="off">
       <p class="ferr" id="bgerr" hidden></p>
       <button class="obtn pri wide" data-act="addgo" id="addgo"${(prefill || '').trim() ? '' : ' disabled'}>Agregar</button>
     </div>`, from, { form: true });
  if (KBD_SIM) device.classList.add('kbd');
}

/* ---------- 077: THE PENDING SHEET ----------
   The developer's design, taken as given rather than offered as variants:
     *"until the data is retrieved if I tap that row, can I get a bottom sheet with a simple 'working'
       status?"*  -> the waiting state below
     *"When the data arrives this should says 'Game name agregado' and allow me to edit(ver)."*
       -> the arrived state, which REPLACES the waiting one in place, in the same sheet.

   WHAT THE BODY DELIBERATELY DOES NOT SAY, and this is d51/d53 being obeyed rather than rediscovered:
   the arrived state carries NO list of what came back. d51 had to delete `y el nivel` from exactly such a
   list once enrichment turned out never to write `weight_band`, and d53 then deleted the enumerating hint
   outright. A sheet that said "ya tiene tapa, jugadores y duración" would be that same list, rebuilt on a
   new screen, needing to be kept true forever against a changing `attrs_from_bgg_item/1`. The title says
   what happened and `Ver` goes and shows you; nothing claims WHICH fields arrived.

   `Ver`, not `Editar`: d55 already chose that word for this exact destination on the toast, and there is no
   read-only admin view — `Ver` and `Editar` both land on /admin/juegos/:id/editar. Consistency decides it;
   the honesty argument for `Editar` is recorded in the README as open.

   THE FAILURE BRANCH IS DRAWN MINIMALLY AND IS OUT OF SCOPE. The developer scoped this round *"until the
   data is retrieved"*, but a sheet that is open when the job dies has to say SOMETHING, so it says the one
   thing that is load-bearing — the game still exists as a draft — and sends you where `Reintentar` lives
   (073). Designing the failure is slice 079. */
function sheetParts(g) {
  const e = enrOf(g), id = `BGG ${esc(String(g.bgg_id))}`;
  if (e === 'pending') return {
    head: `<div class="sh-txt"><p class="ctx">${id}</p><div class="sh-title">Trayendo datos de BGG…</div></div>`,
    /* true in ALL THREE variants, which is why it can be said at all: AV1 repaints this sheet, AV3 closes it
       and the toast speaks, AV2 does both. On d39's dedicated pending SCREEN the same promise
       ("te avisamos cuando lleguen") had no mechanism behind it anywhere in the app — form.ex has no
       subscribe and no handle_info. Here the list already holds the signal (index.ex:41-43, :195-198). */
    body: `<div class="pbody"><div class="pwait"><div class="spin"></div>
      <p>Podés cerrar esto. El juego ya quedó agregado como borrador y te avisamos cuando lleguen los datos.</p></div></div>`
  };
  if (e === 'enriched') return {
    head: `<div class="sh-txt"><p class="ctx">${id}</p><div class="sh-title">${esc(g.name)} agregado</div></div>`,
    body: `<div class="pbody"><button class="obtn pri wide" data-act="sheetgo" data-id="${g.id}">Ver</button></div>`
  };
  return {
    head: `<div class="sh-txt"><p class="ctx">${id}</p><div class="sh-title">No pudimos traer los datos</div></div>`,
    body: `<div class="pbody"><p class="pline">${esc(g.name)} quedó agregado igual, como borrador.</p>
      <button class="obtn pri wide" data-act="sheetgo" data-id="${g.id}">Ver</button></div>`
  };
}

function openPendingSheet(g, from) {
  if (!g) return;
  S.sheetFor = g.id;
  const { head, body } = sheetParts(g);
  openSheet(head, body, from);
}

/* the arrival, with the sheet already open. Same `sheetParts`, same `sheetChrome` — so the waiting state and
   the arrived state cannot diverge in chrome, only in content (check 3 asserts the chrome is byte-identical
   across all three variants). */
function repaintSheet(g) {
  const sh = $('#sheet'); if (!sh.classList.contains('open') || S.sheetFor !== g.id) return;
  const { head, body } = sheetParts(g);
  sh.innerHTML = sheetChrome(head, body);
}

/* ---------- `Crear a mano` is GONE, and decision 4 is amended rather than drifted ----------
   Round 1 left it on screen but disabled, on the reasoning that deleting it would silently reverse d4. The
   developer's call in round 2 is to delete it, which makes this an explicit amendment instead — the thing
   d47 was convened to require.

   The case for deleting rather than disabling:
     · It is UNBUILT, not merely unfinished. `catalog.ex:325` is the ONLY game insert in the app and it goes
       through `Game.draft_changeset`, which does `validate_required([:bgg_id])` (game.ex:157). There is no
       by-name context function, no route, and nothing to enable.
     · It was never used. The 41 `no_bgg_id` games are LEGACY CSV-seed rows (seed/report.ex), so "11% of the
       catalogue" is a fact about the 2026-08-10 import, not evidence that anyone wants this door.
     · Disabled, it cost 106px of a 435px sheet — 24% — to say "no".

   d4's OTHER half stands untouched: the 44px `+` rightmost in the header, the BGG number-or-link field, and
   the edition prompt are all still here. What is withdrawn is only the manual path, in BOTH places that
   offered it — the sheet and the search's "Crear «…»" suggestion — because leaving one live would keep the
   unbuilt door open through a different handle. `createManual` and its two actions are deleted with them. */

/* D-03 — a BGG id that already belongs to a game: warn, list the holders, let staff confirm an edition */
function editionPrompt(id) {
  const holders = [byId(1), byId(2)];
  const body = $('#sheet').querySelector('.fbody');
  if (body.querySelector('.edp')) return;
  body.insertAdjacentHTML('beforeend', `<div class="edp">
    <p>Ya tenés ${holders.map(g => esc(g.name)).join(' y ')} con este BGG ID. ¿Es otra edición?</p>
    ${holders.map(g => `<button class="srow" data-act="open" data-id="${g.id}">${cover(g)}<span class="txt"><span class="ttl">${esc(g.name)}</span><span class="sub">${sub(g)}</span></span></button>`).join('')}
    <div class="eacts"><button class="tbtn" data-act="edcancel">Cancelar</button><button class="obtn" data-act="edok">Sí, agregar edición</button></div></div>`);
}

/* ---------- 076: the create, exactly as the shipped changeset writes it ----------
   catalog.ex:325 -> Game.draft_changeset(%Game{}, %{bgg_id: id}) (game.ex:155-167):
       cast [:bgg_id] · validate_required [:bgg_id] · validate_number greater_than: 0
       put_change :status,            :draft
       put_change :enrichment_status, "pending"
       put_change :name,              "Juego #<bgg_id>"
   Everything else is nil. 071's version invented `pending: true` and then renamed the row to "Ark Nova" on a
   1600ms timer — a success path on a stopwatch, with no failure branch and no state the page could be asked
   about. Both are gone: the outcome is a STEP the walk takes, so `failed` is reachable at all.

   THE ROUND'S BRANCH, and it is the whole variant axis — three lines, nothing else differs. */
function addGame(bgg) {
  /* 078 — the club's own columns are carried explicitly, because their NIL-NESS is the round's subject.
     draft_changeset (game.ex:155-167) writes bgg_id, status, enrichment_status and the placeholder name and
     NOTHING ELSE; `units` has no DB default (create_games.exs:20) and enrichment_changeset never casts
     weight_band, units or shelf_id (game.ex:182-210). So all three are genuinely nil here, exactly as they
     are on the real row 873. `is_expansion` IS cast by enrichment (from the BGG item type), so it arrives
     with the data rather than starting nil — the IS_EXP lever below sets it at that moment, not at create. */
  const g = {
    id: 1000 + G.length, name: `Juego #${bgg}`, bgg_id: bgg, thumb: null, hue: hue(bgg),
    year: null, gap: false, status: 'draft', enr: 'pending', added: 1e6 + G.length,
    weight_band: null, units: null, shelf_id: null, is_expansion: false, description: null
  };
  G.push(g); NEW = g.id;
  closeSheet(); S.screen = 'juegos'; S.shown = PAGE;

  /* V1 — 071 verbatim: the list is left exactly as it was. The game is inside a collapsed section and the
          only evidence is a counter and a snackbar with a 4000ms life. The baseline every check below is
          negative-tested against.
     V2 — the section that now holds it opens, and the row is scrolled to. d8's collapsed-by-default is NOT
          repealed: this opens it once, at the create moment, for the game you just made.
     V3 — d3 taken literally ("the game added five minutes ago is the first row"): the row is rendered above
          every section until its status resolves. It does NOT leave Borradores, which is the cost this
          variant is here to pay and check 13 is here to count. */
  S.open.draft = true;                 /* d55/d18-amended: the section that holds it opens, and STAYS open */
  render();
  scrollNewIntoView();

  snack('Juego agregado como borrador');
  walkUI();
}

/* d8 partitions the catalog and the tapped-heading rule (the `group` handler) keeps a heading where the finger
   left it. Neither applies here — nothing was tapped — so the scroll is to the ROW, and it is measured against
   `.tabs`'s top rather than the scroller's, because the 67px tab bar overlays the scroller (075's trap: the
   scroller's own rect reports 740 while the eye stops at 673).

   AND THE CEILING IS TWO THINGS, NOT ONE. Drawn first against `--bar` alone (the pinned search), the row
   landed at y121-185, visible and above the fold — and `elementFromPoint` at its centre returned
   `.lhead | BORRADORES 2`. d17 makes every section header STICKY, so `Borradores`' own caption pins directly
   under the search and sits on top of the row the scroll just delivered. Height, visibility and fold checks
   all pass straight through that; only a hit test sees it.

   This is charged to the DRAWING, not to V2 — 074 and 075 between them charged three costs that turned out to
   be artefacts of how I drew them, and this would have been a fourth. The ceiling is now measured from the
   pinned header's own rect, so it cannot drift if d17's caption changes height. */
function scrollNewIntoView() {
  const row = main.querySelector(`.row[data-id="${NEW}"]`); if (!row) return;
  const sc = scroller(), scTop = sc.getBoundingClientRect().top;
  const barPx = parseFloat(getComputedStyle(device).getPropertyValue('--bar')) || 0;
  /* the caption of the section the row is in — it is what pins under the bar, and it is the real ceiling */
  const cap = row.closest('.lgroup')?.querySelector('.lhw');
  const capPx = cap ? cap.getBoundingClientRect().height : 0;
  sc.scrollTop += row.getBoundingClientRect().top - scTop - barPx - capPx - 8;
  updateBar();
}

/* ---------- 076: the moment the job ends ----------
   The three shipped outcomes, and `failed` is reachable on ATTEMPT 1, not only after three retries:
     missing credentials  enrich_game_worker.ex:65-68  -> mark_failed_and_broadcast -> {:cancel, reason}
     BGG has no such item enrich_game_worker.ex:78-80  -> the same, immediately
     anything else        enrich_game_worker.ex:82-87  -> "failed" only once attempt >= max_attempts
   All three collapse into ONE column value ("failed", :97) and ONE user-facing string
   ("Error al traer datos de BGG.", index.ex:373 / form.ex:263) — so the page can never say which happened.
   That is slice 079's question; here it only has to be REACHABLE, which in 071 it was not. */
function enrichmentArrived(outcome) {
  const g = byId(NEW); if (!g) return;
  if (outcome === 'enriched') {
    /* Enrichment.maybe_put_name/3 replaces the placeholder — and `Hellas` is what BGG really returns for
       207330 ONCE bgg_client.ex:130's xpath is `./name[...]` instead of `.//name[...]`. The `.//` form
       concatenates the game's name with every VERSION's name; reproduced byte-identically against the real
       row in the README. NAME_BROKEN paints that string on instead, as a falsifiability lever. */
    g.enr = 'enriched'; g.name = NAME_BROKEN ? BROKEN_NAME : 'Hellas'; g.year = 2002;
    /* enrichment_changeset DOES cast :is_expansion and :description (game.ex:182-210) — so these arrive
       WITH the data. weight_band, units and shelf_id do not, and stay nil. That asymmetry is the whole
       reason the gate has anything to talk about. */
    g.is_expansion = IS_EXP;
    g.description = 'Un juego de mayorías en la Grecia antigua: cada ciudad-estado disputa el control de las regiones del mapa.';
  } else {
    g.enr = 'failed';                                          /* the name STAYS "Juego #<bgg_id>" — nothing replaces it */
  }
  if (S.screen === 'juegos') render();

  /* ROUND 5: the completion speaks, and it NAMES THE GAME.
     Naming it is not decoration — the create path can be run repeatedly (d3's list is newest-first precisely
     because staff add in batches), and a bare "listo" would not say WHICH of them finished. On success the
     name is the one that just arrived from BGG, which is itself the news; on failure the placeholder is all
     there is, because nothing ever replaces it (076 round 1, check 12).

     FAILURE ALSO COUNTS AS FINISHING, and gets a toast too. The developer said "when the sync finish" and a
     failure is a finish — arguably the one you most need told about, since the row will otherwise sit in a
     collapsed section saying "Error al traer datos de BGG" to nobody. Same anatomy, different verb, and the
     action is the same: go and look at it.

     NOT DRAWN, deliberately: a toast for a game whose editor you are already looking at. `S.screen` is
     checked so the announcement never lands on top of the thing it is announcing. */
  /* ---------- 077's AXIS, and it is the only place the three variants differ ----------
     The sheet and d55's toast have become THE SAME ANNOUNCEMENT — both name the game, both offer `Ver`.
     The toast's own suppression rule was written for the editor alone (`S.screen === 'editor'`, 076:1114),
     so on the list nothing stops the two firing together. Which is right is this round's question. */
  const sheetOpen = S.sheetFor === g.id && $('#sheet').classList.contains('open');

  if (AV === 'AV3' && sheetOpen) closeSheet();   /* se retira: the sheet's job was the WAIT, and the wait is over */
  else if (sheetOpen) repaintSheet(g);           /* AV1 and AV2: the sheet transforms in place */

  /* check 25's rule, unchanged and still decided: the announcement never lands on top of its own subject.
     AV1 extends it from the editor to the sheet — the same rule reaching one more container, NOT a new one.
     AV2 is the do-nothing baseline: it is exactly what the code does if nobody writes that extension, and
     every guard about the collision is negative-tested against it. */
  const onItsOwnSubject = (S.screen === 'editor' && S.editing === g.id) || (AV === 'AV1' && sheetOpen);
  if (!onItsOwnSubject) {
    const ok = outcome === 'enriched';
    snack(ok ? `${g.name} ya tiene sus datos` : `No pudimos traer los datos de ${g.name}`,
      { label: 'Ver', run: () => openGame(g.id, 'juegos') });
  }
  walkUI();
}

/* ---------- d33's spine rule: every club value is a ROW that opens a SHEET ----------
   Ported from 075 unchanged in shape. The only thing 078 adds is that `units` opens on its DEFAULT rather
   than on nil — the stepper cannot start from "nothing", and 434 of 434 published games say the number it
   should start from is 1. */
const shTop = (t, sub) => `<div class="sh-txt"><div class="sh-title">${esc(t)}</div>${sub ? `<div class="sh-sub">${esc(sub)}</div>` : ''}</div>`;

function openFieldSheet(key, from) {
  const g = byId(S.editing); if (!g) return;
  const optRow = (pick, v, n, sub, on) => `<button class="opt" data-pick="${pick}" data-val="${esc(v)}">
    <span class="ot"><span class="on2">${esc(n)}</span>${sub ? `<span class="os">${esc(sub)}</span>` : ''}</span>
    ${on ? `<span class="tick">${ic('tick', 2.2)}</span>` : ''}</button>`;

  if (key === 'weight_band') {
    return openSheet(shTop('Nivel', 'Cuánto pide el juego a quien lo juega por primera vez.'),
      `<div class="sh-body">${BANDS.map(b => optRow('weight_band', b.v, b.n, b.s, (g.weight_band || '') === b.v)).join('')}</div>`, from);
  }
  if (key === 'shelf_id') {
    return openSheet(shTop('Estante', 'Dónde está la caja en el club.'),
      `<div class="sh-body">${SHELVES.map(b => optRow('shelf_id', b.v, b.n, b.s, (g.shelf_id || '') === b.v)).join('')}</div>`, from);
  }
  if (key === 'is_expansion') {
    return openSheet(shTop('Es una expansión', 'Se muestra junto al juego base.'),
      `<div class="sh-body">${[['No', '0'], ['Sí', '1']].map(([n, v]) => optRow('is_expansion', v, n, '', String(+g.is_expansion) === v)).join('')}</div>`, from);
  }
  if (key === 'units') {
    const n = g.units == null ? UNITS_DEFAULT : g.units;
    return openSheet(shTop('Copias', 'Cuántas cajas del juego tiene el club.'),
      `<div class="sh-body"><div class="stepper">
        <button data-step="-1" aria-label="Una copia menos">${ic('minus')}</button>
        <span class="n" id="unitsn">${n}</span>
        <button data-step="1" aria-label="Una copia más">${ic('plus')}</button></div>
        <p class="hint" style="text-align:center">Casi siempre es 1: los 434 juegos publicados tienen una sola caja.</p></div>`, from);
  }
  if (key === 'name') {
    return openSheet(shTop('Nombre', 'Como lo llama el club.'),
      `<div class="fbody"><input class="fld" id="fname" value="${esc(g.name)}" aria-label="Nombre">
       <button class="obtn wide pri" data-pick="name">Guardar</button></div>`, from, { form: true });
  }
  if (key === 'description') {
    return openSheet(shTop('Descripción en español', 'Lo que se lee en la ficha del juego.'),
      `<div class="fbody"><textarea class="fld" id="fdesc" aria-label="Descripción en español">${esc(g.description || '')}</textarea>
       <button class="obtn wide pri" data-pick="description">Guardar</button></div>`, from, { form: true });
  }
}

/* one writer for every field, so the gate can never read a value the sheet wrote differently. */
function setField(key, raw) {
  const g = byId(S.editing); if (!g) return;
  if (key === 'is_expansion') g.is_expansion = raw === '1';
  else if (key === 'units') g.units = Math.max(1, +raw);
  else if (key === 'weight_band' || key === 'shelf_id') g[key] = raw || null;
  else g[key] = raw.trim() || null;
  closeSheet(); render(); walkUI();
}

/* ---------- dialog / snackbar ---------- */
const DLG = { run: null };
/* ---------- FOUND IN A SCREENSHOT: the confirm was painted as a DELETE ----------
   The dialog is shared with 077, where its only caller was destructive, so `dlg-yes` carried `.dan` —
   danger red — unconditionally. G2's confirm inherited it, and "Publicar igual" came out in the same red
   the app uses for throwing something away. Publishing is the OPPOSITE of destructive: it is the thing the
   whole flow exists to reach, and the confirm is a courtesy, not a warning about loss.
   `danger` now defaults to FALSE, so a caller has to ask for red rather than get it by inheritance —
   and check 18 asserts G2's is not red. */
function openDialog({ title, text, yes, run, danger = false }) {
  DLG.run = run; $('#dlg-t').textContent = title; $('#dlg-d').textContent = text;
  $('[data-act="dlg-yes"]').textContent = yes;
  $('[data-act="dlg-yes"]').classList.toggle('dan', !!danger);
  $('#dscrim').classList.add('open');
  setTimeout(() => $('[data-act="dlg-no"]').focus(), 60);
}
function closeDialog() { $('#dscrim').classList.remove('open'); DLG.run = null; }
let snackT;
function snack(msg, action) {
  const s = $('#snack'), [t, b, x] = [s.querySelector('span'), s.querySelector('.tbtn'), s.querySelector('.x')];
  t.textContent = msg; b.hidden = !action; x.hidden = !action;
  if (action) { b.textContent = action.label; b.onclick = () => { action.run(); hide(); }; x.innerHTML = ic('x'); x.onclick = hide; }
  s.classList.add('show'); clearTimeout(snackT); snackT = setTimeout(hide, action ? 10000 : 4000);
  function hide() { s.classList.remove('show'); }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  /* 078 — a club row opens its sheet (d33). Handled before [data-act] so a row inside the editor never
     falls through to the list's `open`. */
  const fr = e.target.closest('[data-field]');
  if (fr) return openFieldSheet(fr.dataset.field, fr);
  const pk = e.target.closest('[data-pick]');
  if (pk) {
    const k = pk.dataset.pick;
    if (k === 'name') return setField('name', $('#fname').value);
    if (k === 'description') return setField('description', $('#fdesc').value);
    return setField(k, pk.dataset.val);
  }
  const stp = e.target.closest('[data-step]');
  if (stp) {
    const n = $('#unitsn'); n.textContent = Math.max(1, +n.textContent + (+stp.dataset.step));
    const g = byId(S.editing); if (g) g.units = +n.textContent;
    return;
  }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'open') return openGame(+t.dataset.id, S.screen);
  /* 077 — a pending row acts in place (see gameRow and D-19i above) */
  if (a === 'pending') return openPendingSheet(byId(+t.dataset.id), t);
  /* the sheet's `Ver`. It must CLOSE before navigating: leaving the sheet open over the editor would put a
     status about the game on top of the game, which is check 25's rule in yet another place. */
  if (a === 'sheetgo') { const id = +t.dataset.id; closeSheet(); return openGame(id, 'juegos'); }
  if (a === 'juegos') return go('juegos');
  if (a === 'group') {
    /* decision 8's rule, kept: the tapped heading stays exactly where the finger left it, so opening a section
       never scrolls the page out from under you. Re-query after the render — reusing the stale node silently
       mutated the page once and every later measurement was wrong. */
    const k = t.dataset.g, top = t.getBoundingClientRect().top;
    S.open[k] = !S.open[k]; render();
    const now = main.querySelector(`[data-g="${k}"]`);
    if (now) scroller().scrollTop += now.getBoundingClientRect().top - top;
    return;
  }
  if (a === 'more') { S.shown += PAGE; return render(); }
  if (a === 'add') return addSheet(t);
  if (a === 'addbgg') { const id = t.dataset.bgg; closeSuggest(); return addSheet(null, id); }
  if (a === 'addgo') {
    const v = $('#bg').value.trim(), id = bggId(v);
    if (!id) { $('#bg').setAttribute('aria-invalid', 'true'); const er = $('#bgerr'); er.textContent = 'Pegá un número de BGG o el link del juego.'; er.hidden = false; return; }
    if (id === '13') return editionPrompt(id);
    return addGame(id);
  }
  if (a === 'edcancel') { $('.edp')?.remove(); return; }
  if (a === 'edok') return addGame('13');
  if (a === 'close') return closeSheet();
  /* 078 — the editor's rows, the field sheets, and the bar */
  if (a === 'save') { snack('Cambios guardados'); return; }
  if (a === 'publish') return doPublish();
  if (a === 'dlg-no') return closeDialog();
  if (a === 'dlg-yes') { const r = DLG.run; closeDialog(); r?.(); return; }
});
function closeSuggest() { const b = $('#sugg'); if (b) { b.hidden = true; $('#q')?.setAttribute('aria-expanded', 'false'); } }
$('#backdrop').addEventListener('click', closeSheet);
$('#dscrim').addEventListener('click', e => { if (e.target.id === 'dscrim') closeDialog(); });
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.kept = null; renderSugg(); }
  if (e.target.id === 'bg') {
    e.target.removeAttribute('aria-invalid'); $('#bgerr').hidden = true;
    /* ROUND 3: `Agregar` is live only once there is something to submit. The empty-field ERROR path is not
       deleted with it — it still fires for a non-empty value that does not parse ("mi juego favorito"),
       which is a different failure and still needs saying. */
    const b = $('#addgo'); if (b) b.disabled = !e.target.value.trim();
  }
});
document.addEventListener('focusin', e => {
  if (e.target.id === 'q') { if (KBD_SIM) device.classList.add('kbd'); renderSugg(); }
  if (e.target.id === 'bg' && KBD_SIM) device.classList.add('kbd');
});
document.addEventListener('focusout', e => {
  if (e.target.id === 'q') setTimeout(() => { if (document.activeElement?.id !== 'q' && !$('#sugg')?.contains(document.activeElement)) { device.classList.remove('kbd'); closeSuggest(); } }, 180);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#dscrim').classList.contains('open')) return closeDialog();
  if ($('#sheet').classList.contains('open')) return closeSheet();
  if (!$('#sugg')?.hidden) { closeSuggest(); $('#q')?.blur(); }
});

/* ---------- tools ---------- */
document.addEventListener('click', e => {
  const th = e.target.closest('[data-theme-set]'); if (th) { document.documentElement.dataset.theme = th.dataset.themeSet; mark('[data-theme-set]', th); }
  const k = e.target.closest('[data-kbd-set]'); if (k) { KBD_SIM = k.dataset.kbdSet === '1'; if (!KBD_SIM) device.classList.remove('kbd'); mark('[data-kbd-set]', k); }
  /* 077's axis. Switching re-renders from the SAME state — the created game is not rebuilt, so AV1/AV2/AV3
     are three renderings of one walk rather than three walks. It only changes what happens AT the arrival,
     so switching it after the data has landed shows nothing; ↺ and walk it again. */
  const v = e.target.closest('[data-g-set]');
  /* 078's axis. Switching re-renders from the SAME state — the created game is not rebuilt, so G1/G2/G3 are
     three renderings of one walk rather than three walks. It is live at every step, including after the
     game is already published, so the variants can be compared at any point of the walk. */
  if (v) { GATE = v.dataset.gSet; mark('[data-g-set]', v); render(); walkUI(); return; }
  const ex = e.target.closest('[data-exp-set]');
  if (ex) {
    IS_EXP = ex.dataset.expSet === '1'; mark('[data-exp-set]', ex);
    /* it applies to a game whose data has ALREADY arrived too, because enrichment_changeset casts
       :is_expansion and the flip is what makes "the gate's one condition vanishes for an expansion"
       falsifiable AFTER the fact rather than only on a fresh walk. */
    const g = NEW ? byId(NEW) : null; if (g && enrOf(g) === 'enriched') g.is_expansion = IS_EXP;
    render(); walkUI(); return;
  }
  const nm = e.target.closest('[data-nm-set]');
  if (nm) {
    NAME_BROKEN = nm.dataset.nmSet === '1'; mark('[data-nm-set]', nm);
    const g = NEW ? byId(NEW) : null;
    if (g && enrOf(g) === 'enriched') g.name = NAME_BROKEN ? BROKEN_NAME : 'Hellas';
    render(); walkUI(); return;
  }
  const w = e.target.closest('[data-walk]');
  if (w) {
    const k = w.dataset.walk;
    if (k === 'create') { if (!NEW) addGame('207330'); return; }
    if (k === 'edit') { closeSheet(); openGame(NEW, 'juegos'); walkUI(); return; }
    if (k === 'nivel') { const g = byId(NEW); if (g) { g.weight_band = 'medio'; render(); walkUI(); } return; }
    if (k === 'publish') { doPublish(); return; }
    if (k === 'reset') {
      /* ↺ must also LEAVE THE EDITOR. Found by check 25, which reaches the editor through the toast's «Ver»
         and then resets: the game was spliced out of `G` while `S.screen` was still 'editor', so the next
         render called `renderEditor` on an id that no longer existed. A reset that deletes the thing the
         current screen is about has to change the screen too. */
      if (NEW) { const i = G.findIndex(x => x.id === NEW); if (i > -1) G.splice(i, 1); }
      /* 077 — and it must CLOSE THE SHEET too, for the same reason 076 found it must leave the editor:
         a reset that deletes the game the sheet is about leaves a sheet describing a game that is gone. */
      closeSheet();
      NEW = null; S.open = { gap: false, draft: false }; S.shown = PAGE; S.editing = null;
      S.screen = 'juegos'; scroller().scrollTop = 0; lastY = 0;
      device.classList.remove('hidesearch'); render(); walkUI(); return;
    }
    return enrichmentArrived(k);
  }
});
function mark(sel, on) { $$(sel).forEach(b => b.classList.toggle('on', b === on)); }

/* the walk's own read-out — which step you are on, and what the app would have written. Kept in the tool
   panel, never in `.device`, so nothing it says can be mistaken for part of the design. */
function walkUI() {
  const g = NEW ? byId(NEW) : null, e = g ? enrOf(g) : null;
  const inEditor = S.screen === 'editor' && S.editing === NEW;
  const miss = g ? missing(g) : [];
  $('[data-walk="create"]').disabled = !!NEW;
  $('[data-walk="enriched"]').disabled = !g || e !== 'pending';
  $('[data-walk="edit"]').disabled = !g || e !== 'enriched' || inEditor;
  $('[data-walk="nivel"]').disabled = !g || !inEditor || !!g.weight_band || g.status !== 'draft';
  /* step 5 stays live even when the gate would refuse it — otherwise the walk could only ever reach the
     variant that lets you through, and the round's own question would be unmeasurable from the panel.
     What each variant DOES with the tap is the thing being compared. */
  $('[data-walk="publish"]').disabled = !g || !inEditor || g.status !== 'draft';
  const where = inEditor ? ' · estás en el editor' : '';
  const gaps = miss.length ? ` · falta ${miss.map(m => m.n).join(' y ')}` : ' · completo';
  $('#walkNow').textContent = !g ? 'Paso 0 — nada creado todavía'
    : e === 'pending' ? `Paso 1 — ${g.name} · draft · pending · el job está encolado`
    : g.status === 'published' ? `Paso 5 — ${g.name} · PUBLICADO · se ve en la web`
    : `Paso ${inEditor ? (g.weight_band ? '4' : '3') : '2'} — ${g.name} · draft · enriched${gaps}${where}`;
}

/* ---------- harness handles, and the reason they are needed at all ----------
   `const`/`let` at the top level of a classic script are LEXICAL bindings, NOT properties of `window` — so
   a harness that reads or assigns `window.X` for one of them silently measures nothing. 076 hit this twice
   and 077 once, each time producing a green check against an unmodified page.

   FUNCTION DECLARATIONS ARE DIFFERENT: they bind on the global object, so `window.missing = ...` really
   does change what the page's own `missing(g)` call sites resolve to. `missing` and `render` are
   declarations ON PURPOSE, so verify.js check 12 can falsify checks 3 and 6 rather than merely appear to.

   Everything else the harness needs is exported here EXPLICITLY, as getters — never as a one-time copy,
   which would capture `NEW` and `S.editing` stale the moment the walk advanced. */
Object.defineProperties(window, {
  byId: { get: () => byId }, enrOf: { get: () => enrOf }, gateOpen: { get: () => gateOpen },
  S: { get: () => S }, NEW: { get: () => NEW }
});

scroller().addEventListener('scroll', updateBar, { passive: true });
render(); walkUI();
</script>
</body>
</html>

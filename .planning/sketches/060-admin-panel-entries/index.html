<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketch 060 — Admin Home Entries</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #d9d4e0; font-family: var(--font-sans); color: var(--color-text); }
  :root[data-theme="dark"] body { background: #140a22; }
  button { font: inherit; color: inherit; }

  /* ================= sketch chrome (not part of the design) ================= */
  #state-nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9998;
    background: #1b1026; color: #fff; font-family: system-ui, sans-serif; font-size: 13px;
    padding: 8px 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
  }
  #state-nav .lbl { opacity: .6; margin-right: 4px; }
  .stab { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
  .stab.active { background: #fff; color: #1b1026; border-color: #fff; }
  #sketch-tools {
    position: fixed; bottom: 12px; left: 12px; z-index: 9999; font-family: system-ui; font-size: 12px;
    background: rgba(0,0,0,.75); color: #fff; padding: 8px 10px; border-radius: 8px; display: flex; flex-direction: column; gap: 6px;
  }
  #sketch-tools button { background: #333; color: #fff; border: 0; border-radius: 4px; padding: 3px 7px; cursor: pointer; }
  #sketch-tools button.on { background: #fff; color: #000; }
  #tools-body { display: none; flex-direction: column; gap: 6px; }
  #tools-body.show { display: flex; }
  .notes { max-width: 760px; margin: 16px auto 80px; padding: 0 16px; font-family: system-ui; font-size: 13px; color: #3b3347; line-height: 1.5; }
  :root[data-theme="dark"] .notes { color: #cfc3e2; }
  .notes h3 { margin: 0 0 4px; font-size: 14px; }
  .notes ul { margin: 4px 0 0; padding-left: 18px; }

  /* ================= device frame ================= */
  .stage { display: flex; justify-content: center; padding: 8px 12px 0; }
  .device {
    width: 375px; max-width: 100%; height: 740px; background: var(--color-bg);
    border-radius: 22px; box-shadow: 0 10px 40px rgba(0,0,0,.28); overflow: hidden;
    position: relative; display: flex; flex-direction: column;
  }
  .device.desk { width: 1180px; border-radius: 10px; height: 760px; }
  .scroller { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; }
  .has-tabs .scroller { padding-bottom: 72px; }
  .desk.has-tabs .scroller { padding-bottom: 0; }

  /* ================= header — ONE header for every state (signed out, public signed in, admin) ================= */
  .hdr { position: sticky; top: 0; z-index: 20; background: var(--color-bg); border-bottom: 1px solid var(--color-border); }
  .hdr-in { display: flex; align-items: center; gap: 8px; padding: 6px 12px; min-height: 56px; max-width: 1280px; margin: 0 auto; }
  .desk .hdr-in { padding: 6px 32px; }
  .icon-btn {
    width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; position: relative;
    border: 0; background: transparent; border-radius: var(--radius-md); cursor: pointer; color: var(--color-text);
    transition: background var(--duration-fast) var(--ease-standard);
  }
  .icon-btn:hover { background: var(--color-surface); }
  .icon-btn:active { transform: scale(.96); }
  .icon-btn svg { width: 24px; height: 24px; }
  .brand { display: flex; align-items: center; gap: 8px; color: var(--color-text); cursor: pointer; flex-shrink: 0; text-decoration: none; }
  .brand img { height: 28px; width: auto; display: block; }
  .brand .img-dark { display: none; }
  :root[data-theme="dark"] .brand .img-light { display: none; }
  :root[data-theme="dark"] .brand .img-dark { display: block; }
  .brand .word { font-family: var(--font-display); font-size: 1.35rem; letter-spacing: .02em; line-height: 1; white-space: nowrap; }

  /* ================= page ================= */
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 32px; }
  .desk main { padding: 28px 32px 48px; }
  #main { transition: opacity var(--duration-fast) var(--ease-standard); }
  #main.swapping { opacity: 0; }
  .back {
    display: inline-flex; align-items: center; gap: 2px; min-height: 44px; margin: -8px 0 -4px -10px; padding: 0 10px 0 4px;
    color: var(--color-text-muted); font-size: var(--text-sm); font-weight: 600; border: 0; background: none; cursor: pointer; border-radius: var(--radius-md);
  }
  .back:hover { color: var(--color-text); background: var(--color-surface); }
  .back svg { width: 18px; height: 18px; }
  .ptitle { font-family: var(--font-display); font-size: 2rem; letter-spacing: .02em; line-height: 1.05; margin: 4px 0 2px; font-weight: 400; }
  .psub { font-size: var(--text-sm); color: var(--color-text-muted); margin: 0 0 16px; }
  /* neutral placeholder bodies — page contents are designed in 060-063 */
  .ph-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
  .ph-list li { padding: 13px 14px; border-top: 1px solid var(--color-border); font-size: var(--text-sm); display: flex; justify-content: space-between; gap: 12px; }
  .ph-list li:first-child { border-top: 0; }
  .ph-list li span:last-child { color: var(--color-text-muted); white-space: nowrap; }
  .ph-note { font-size: 11px; color: var(--color-text-muted); margin: 10px 2px 0; font-style: italic; }
  .fake-shelf h2 { font-family: var(--font-display); font-size: 1.3rem; margin: 18px 0 8px; letter-spacing: .02em; font-weight: 400; }
  .fake-rail { display: flex; gap: 10px; overflow: hidden; }
  .fake-poster { flex: 0 0 104px; height: 146px; border-radius: var(--radius-md); background: var(--color-surface-2); }
  .login { max-width: 360px; margin: 40px auto 0; }
  .field label { display: block; font-size: var(--text-sm); font-weight: 600; margin-bottom: 6px; }
  .field input { width: 100%; min-height: 48px; border-radius: var(--radius-md); border: 1px solid var(--color-surface-2); background: var(--color-bg); color: var(--color-text); padding: 0 14px; font-size: var(--text-base); }
  .login .btn { width: 100%; margin-top: 12px; min-height: 44px; border-radius: var(--radius-md); border: 1px solid var(--color-border); background: var(--color-surface); font-weight: 600; cursor: pointer; }

  /* ================= ONE row anatomy: drawer + every sheet ================= */
  .group-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-muted); margin: 16px 0 4px; }
  .dlinks { display: flex; flex-direction: column; margin: 0 -16px; }
  .dlink {
    display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border: 0; background: none; width: 100%;
    text-align: left; font-size: var(--text-base); font-weight: 500; cursor: pointer; border-left: 3px solid transparent; color: var(--color-text);
    transition: background var(--duration-fast) var(--ease-standard);
  }
  .dlink:hover { background: var(--color-surface); }
  .dlink:active { background: var(--color-surface-2); }
  .dlink .slot { width: 28px; height: 28px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .dlink .ico { width: 22px; height: 22px; color: var(--color-text-muted); }
  .dlink .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dlink .lbl .sub { display: block; font-size: 12px; font-weight: 400; color: var(--color-text-muted); margin-top: 1px; }
  .dlink:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }
  /* 060: page-level rows = the same anatomy; a secondary line may wrap, so the row grows past 48px */
  .page-rows .dlink { padding-block: 8px; min-height: 56px; }
  .page-rows .dlink .lbl { white-space: normal; }
  .dlink.ok .ico { color: var(--color-success); }
  .var-nav { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; width: 100%; }
  .dlink .chev { width: 16px; height: 16px; color: var(--color-text-muted); flex-shrink: 0; }
  .dlink .count { font-size: 12px; font-weight: 700; color: var(--color-accent-text); background: var(--color-accent-bg); border-radius: var(--radius-full); padding: 2px 8px; }
  .dlink.on { background: var(--color-surface); border-left-color: var(--color-primary); font-weight: 700; }
  .dlink.on .ico, .dlink.on .chev { color: var(--color-primary); }
  :root[data-theme="dark"] .dlink.on { border-left-color: var(--color-accent-text); }
  :root[data-theme="dark"] .dlink.on .ico, :root[data-theme="dark"] .dlink.on .chev { color: var(--color-accent-text); }
  .dlink.static { cursor: default; }
  .dlink.static:hover, .dlink.static:active { background: none; }
  .dlink.danger, .dlink.danger .ico { color: var(--color-danger); }
  :root[data-theme="dark"] .dlink.danger, :root[data-theme="dark"] .dlink.danger .ico { color: #F2A3B8; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .dlink.danger, :root:not([data-theme="light"]) .dlink.danger .ico { color: #F2A3B8; } }
  .dlink[disabled] { cursor: progress; }
  .dlink[disabled]:not(.danger) { opacity: .4; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; background: var(--color-accent-bg); color: var(--color-accent-text);
    font-weight: 700; font-size: 11px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .avatar.ring { width: 26px; height: 26px; box-shadow: 0 0 0 2px var(--color-bg), 0 0 0 3.5px var(--color-success); }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ================= drawer ================= */
  .backdrop {
    position: absolute; inset: 0; z-index: 40; background: color-mix(in srgb, var(--color-text) 38%, transparent);
    opacity: 0; pointer-events: none; transition: opacity var(--duration-base) var(--ease-standard);
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: absolute; top: 0; bottom: 0; right: 0; width: 84%; max-width: 360px; z-index: 50; background: var(--color-bg);
    display: flex; flex-direction: column; padding: 8px 0 max(16px, env(safe-area-inset-bottom)); overflow: hidden; box-shadow: var(--shadow-lg);
    transform: translateX(100%); transition: transform var(--duration-slow) var(--ease-out-soft);
  }
  .drawer.open { transform: translateX(0); }
  .drawer-top { display: flex; align-items: center; justify-content: space-between; min-height: 48px; margin-bottom: 4px; padding: 0 8px 0 16px; flex-shrink: 0; }
  /* list scrolls; the theme block is pinned to the drawer's bottom edge, so it sits in the same visible spot in every state */
  .drawer-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 8px; }
  .drawer-bottom { flex-shrink: 0; padding: 0 16px; }
  .drawer-bottom .divider { margin-top: 0; }
  .divider { height: 1px; background: var(--color-border); margin: 12px 0; }
  .theme-row { display: flex; justify-content: center; gap: 4px; }
  .theme-row .icon-btn { color: var(--color-text-muted); }
  .theme-row .icon-btn svg { width: 20px; height: 20px; }

  /* ================= bottom sheet ================= */
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 60; background: var(--color-bg);
    border-radius: 18px 18px 0 0; padding: 8px 16px max(16px, calc(env(safe-area-inset-bottom) + 8px)); box-shadow: var(--shadow-lg);
    transform: translateY(105%); transition: transform var(--duration-slow) var(--ease-out-soft);
    max-height: 85%; overflow-y: auto; overflow-x: hidden;
  }
  .sheet.open { transform: translateY(0); }
  .sheet.dragging { transition: none; }
  .sheet .group-label { margin-top: 4px; }
  .grab { width: 36px; height: 4px; border-radius: 4px; background: var(--color-border); margin: 4px auto 12px; }
  .sheet-text { font-size: var(--text-sm); color: var(--color-text-muted); line-height: 1.5; margin: 0 0 8px; }
  .sheet-text b { color: var(--color-text); font-weight: 600; overflow-wrap: anywhere; }
  .desk .sheet { left: auto; right: 32px; bottom: auto; top: 112px; width: 340px; border-radius: var(--radius-lg); opacity: 0; pointer-events: none; transform: translateY(-8px); transition: opacity var(--duration-base), transform var(--duration-base); }
  .desk .sheet.open { opacity: 1; pointer-events: auto; transform: none; }
  .desk .sheet.center { left: 50%; right: auto; top: 30%; transform: translate(-50%, -8px); }
  .desk .sheet.center.open { transform: translate(-50%, 0); }
  .desk .grab { display: none; }
  .steps { position: relative; transition: height var(--duration-slow) var(--ease-out-soft); }
  .steps.animating { overflow: hidden; }
  .step { transition: opacity var(--duration-base) var(--ease-standard), transform var(--duration-slow) var(--ease-out-soft); }
  .step[aria-hidden="true"] { position: absolute; top: 0; left: 0; right: 0; opacity: 0; pointer-events: none; }
  .step-account[aria-hidden="true"] { transform: translateX(-24px); }
  .step-confirm[aria-hidden="true"] { transform: translateX(24px); }
  @media (prefers-reduced-motion: reduce) { .step, .steps, .sheet, .drawer, #main { transition: none; } }

  /* ================= tab bar (admin only) ================= */
  .tabs {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--color-bg);
    border-top: 1px solid var(--color-border); display: flex; padding: 4px 4px max(10px, env(safe-area-inset-bottom));
  }
  .tabs button {
    flex: 1; min-width: 0; min-height: 52px; border: 0; background: none; cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--color-text-muted);
    border-radius: var(--radius-md); -webkit-tap-highlight-color: transparent;
    transition: color var(--duration-fast) var(--ease-standard), transform var(--duration-fast);
  }
  .tabs button:hover { color: var(--color-text); }
  .tabs button:active { transform: scale(.96); }
  .tabs button svg { width: 24px; height: 24px; }
  .tabs .tab-ico { position: relative; width: 56px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 15px; transition: background var(--duration-base) var(--ease-out-soft); }
  .tabs .tab-lbl { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabs button.on { color: var(--color-primary); }
  .tabs button.on .tab-ico { background: var(--color-accent-bg); }
  .tabs button.on .tab-lbl { font-weight: 700; }
  :root[data-theme="dark"] .tabs button.on { color: var(--color-accent-text); }
  :root[data-theme="dark"] .tabs button.on .tab-ico { background: color-mix(in srgb, var(--color-accent-text) 22%, transparent); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tabs button.on .tab-ico { background: color-mix(in srgb, var(--color-accent-text) 22%, transparent); } }
  .tabs .badge { position: absolute; top: 0; left: 30px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--color-secondary); color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
  .desk .tabs { position: sticky; top: 57px; bottom: auto; border-top: 0; border-bottom: 1px solid var(--color-border); justify-content: safe center; gap: 8px; padding: 0 16px; overflow-x: auto; }
  .desk .tabs button { flex: 0 0 auto; flex-direction: row; min-height: 44px; padding: 0 14px; font-size: 13px; gap: 8px; border-radius: var(--radius-full); }
  .desk .tabs button svg { width: 18px; height: 18px; }
  .desk .tabs .tab-ico { width: auto; height: auto; background: none !important; }
  .desk .tabs button.on { background: var(--color-accent-bg); }
  .desk .tabs .badge { position: static; margin-left: 6px; }

  /* ================= toast ================= */
  .toast {
    position: absolute; left: 50%; top: 68px; z-index: 70; transform: translate(-50%, -12px); opacity: 0; pointer-events: none;
    background: var(--color-text); color: var(--color-bg); font-size: var(--text-sm); font-weight: 600; border-radius: var(--radius-full);
    padding: 10px 16px; display: flex; gap: 8px; align-items: center; white-space: nowrap;
    transition: opacity var(--duration-base), transform var(--duration-base) var(--ease-out-soft);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast svg { width: 18px; height: 18px; }
</style>
</head>
<body>

<div id="state-nav">
  <div class="var-nav">
    <span class="lbl">Sketch 060 · Inicio de Admin · Estado</span>
    <button class="stab active" data-m="admin">Admin (sesión iniciada)</button>
    <button class="stab" data-m="public">Sitio público con sesión</button>
    <button class="stab" data-m="out">Sin sesión</button>
  </div>
</div>

<div class="stage"><div class="device" id="device"></div></div>

<div class="notes" id="notes"></div>
<div id="sketch-tools">
  <button id="tools-toggle" style="align-self:flex-start">⚙ tools</button>
  <div id="tools-body">
    <div>Tema: <button data-theme-set="light">☀</button> <button data-theme-set="dark">☾</button> <button data-theme-set="system">Sistema</button></div>
    <div>Vista: <button data-vp="phone" class="on">Teléfono</button> <button data-vp="desk">Escritorio</button></div>
    <div>Rol: <button data-role="owner" class="on">Dueña</button> <button data-role="staff">Staff</button></div>
    <div>Datos: <button data-pend="1" class="on">Con pendientes</button> <button data-pend="0">Todo al día</button></div>
  </div>
</div>

/* ---------------- render ---------------- */
const device = document.getElementById('device');
function fitNav() { document.body.style.paddingTop = (document.getElementById('state-nav').offsetHeight + 8) + 'px'; }
window.addEventListener('resize', fitNav);

function render() {
  fitNav();

/* Header, tabs and drawer persist; only the page content swaps (LiveView navigate inside one live_session layout). */
function softSwap() {
  const main = device.querySelector('#main');
  if (!main || S.mode !== 'admin') return render();
  main.classList.add('swapping');
  setTimeout(() => {
    const top = activeTop();
    main.innerHTML = adminBody();
    device.querySelectorAll('.tabs [data-tab]').forEach(b => {
      if (b.dataset.tab === 'account') return;
      const on = b.dataset.tab === top; b.classList.toggle('on', on); on ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current');
    });
    device.querySelectorAll('.drawer .dlink[data-nav]').forEach(b => {
      const on = b.dataset.nav === top; b.classList.toggle('on', on); on ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current');
    });
    device.querySelector('.scroller').scrollTop = 0;
    main.classList.remove('swapping');
  }, 100);
}

/* ---------------- overlays ---------------- */
let returnFocus = null;
function resetSteps(sh) {
  sh.querySelectorAll('.steps').forEach(steps => {
    clearTimeout(steps._t); steps.classList.remove('animating'); steps.style.height = '';
    steps.querySelectorAll('.step').forEach(st => {
      const first = st.classList.contains('step-account');
      st.style.transition = 'none';
      first ? st.removeAttribute('aria-hidden') : st.setAttribute('aria-hidden', 'true'); st.inert = !first;
      void st.offsetWidth; st.style.transition = '';
    });
  });
}
function setStep(sh, name) {
  const steps = sh && sh.querySelector('.steps'); if (!steps) return;
  const from = steps.querySelector('.step:not([aria-hidden="true"])');
  const to = steps.querySelector('.step-' + name);
  if (!to || from === to) return;
  steps.style.height = from.offsetHeight + 'px'; steps.classList.add('animating');
  from.setAttribute('aria-hidden', 'true'); from.inert = true;
  to.removeAttribute('aria-hidden'); to.inert = false;
  void steps.offsetHeight; steps.style.height = to.offsetHeight + 'px';
  clearTimeout(steps._t); steps._t = setTimeout(() => { steps.style.height = ''; steps.classList.remove('animating'); }, 300);
  const f = to.querySelector(name === 'confirm' ? '[data-act="cancel-logout"]' : '[data-act="ask-logout"]');
  f && f.focus({ preventScroll: true });
}
function closeAll() {
  const had = device.querySelector('.drawer.open,.sheet.open');
  device.querySelectorAll('.open').forEach(el => { el.classList.remove('open'); el.style.transform = ''; });
  if (had && returnFocus && document.contains(returnFocus)) returnFocus.focus({ preventScroll: true });
  if (had) returnFocus = null;
}
function openEl(sel, opener) {
  const keep = returnFocus || opener;
  closeAll(); returnFocus = keep;
  const el = device.querySelector(sel); if (!el) return;
  resetSteps(el);
  void el.offsetWidth; el.classList.add('open'); device.querySelector('.backdrop').classList.add('open');
  const first = el.querySelector('button:not([disabled])'); first && first.focus({ preventScroll: true });
}
function showToast(msg) {
  const t = device.querySelector('#toast'); t.querySelector('span').textContent = msg;
  void t.offsetWidth; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2600);
}
function setTheme(v) { if (v === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v; }

/* swipe a bottom sheet down to dismiss (phone) */
let drag = null, suppressClick = false;
device.addEventListener('pointerdown', e => {
  const sh = e.target.closest('.sheet.open'); if (!sh || S.vp === 'desk') return;
  if (!e.target.closest('.grab') && sh.scrollTop > 0) return;
  const onButton = e.target.closest('button') && !e.target.closest('.grab');
  drag = { sh, y: e.clientY, dy: 0, pending: !!onButton };
  if (!onButton) sh.classList.add('dragging');
});
window.addEventListener('pointermove', e => {
  if (!drag) return; const dy = Math.max(0, e.clientY - drag.y);
  if (drag.pending) { if (dy < 8) return; drag.pending = false; drag.sh.classList.add('dragging'); }
  drag.dy = dy; drag.sh.style.transform = `translateY(${dy}px)`;
});
window.addEventListener('pointerup', () => {
  if (!drag) return; const { sh, dy, pending } = drag; drag = null; sh.classList.remove('dragging');
  if (pending) return;
  if (dy > 8) { suppressClick = true; setTimeout(() => suppressClick = false, 0); }
  if (dy > 80) closeAll(); else sh.style.transform = '';
});

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  if (suppressClick) { e.stopPropagation(); e.preventDefault(); return; }
  const t = e.target.closest('[data-pend],[data-m],[data-vp],[data-role],[data-theme-set],[data-act],[data-nav]');
  if (!t) return;
  if (t.dataset.pend) { S.pend = t.dataset.pend === '1'; document.querySelectorAll('[data-pend]').forEach(b => b.classList.toggle('on', b === t)); return render(); }
  if (t.dataset.m) { S.mode = t.dataset.m; S.screen = home(); return render(); }
  if (t.dataset.vp) { S.vp = t.dataset.vp; document.querySelectorAll('[data-vp]').forEach(b => b.classList.toggle('on', b === t)); return render(); }
  if (t.dataset.role) { S.role = t.dataset.role; if (S.screen === 'staff' && S.role !== 'owner') S.screen = home(); document.querySelectorAll('[data-role]').forEach(b => b.classList.toggle('on', b === t)); return render(); }
  if (t.dataset.themeSet) return setTheme(t.dataset.themeSet);
  if (t.dataset.nav) {
    const n = t.dataset.nav;
    const wasOpen = !!device.querySelector('.drawer.open,.sheet.open');
    if (n === 'pub:about') { closeAll(); return showToast('Quiénes Somos (sin cambios)'); }
    if (n === 'pub:inicio') { if (S.mode === 'out') { closeAll(); return; } S.mode = 'public'; closeAll(); return setTimeout(render, wasOpen ? 200 : 0); }
    // re-tapping the active tab pops to that tab's root, or scrolls to top if already there
    if (t.dataset.tab && S.mode === 'admin' && activeTop() === n) {
      if (S.screen !== n) { S.screen = n; return softSwap(); }
      return device.querySelector('.scroller').scrollTo({ top: 0, behavior: 'smooth' });
    }
    const fromAdmin = S.mode === 'admin';
    S.mode = 'admin'; S.screen = n; closeAll();
    // inside admin: swap content under the closing overlay; entering admin: rebuild after it closes
    return fromAdmin ? softSwap() : setTimeout(render, wasOpen ? 200 : 0);
  }
  const a = t.dataset.act;
  if (a === 'open-drawer') openEl('.drawer', t);
  else if (a === 'open-account') openEl('#sheet-account', t);
  else if (a === 'ask-logout') {
    const sh = t.closest('.sheet');
    setStep(sh, 'confirm');
  }
  else if (a === 'cancel-logout') setStep(t.closest('.sheet'), 'account');
  else if (a === 'close') closeAll();
  else if (a === 'logout') {
    t.disabled = true; t.querySelector('.slot').innerHTML = '<span class="spin"></span>'; t.querySelector('.lbl').textContent = 'Cerrando sesión…';
    t.closest('.dlinks').querySelectorAll('.dlink').forEach(b => { if (b !== t) b.disabled = true; });
    setTimeout(() => { closeAll(); setTimeout(() => { S.mode = 'out'; S.screen = home(); S.toast = 'Cerraste sesión'; render(); }, 220); }, 550);
  }
  else if (a === 'login') { S.mode = 'admin'; S.screen = home(); S.toast = 'Entraste como ' + USER.email; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const confirm = device.querySelector('.sheet.open .step-confirm:not([aria-hidden="true"])');
  if (confirm) setStep(confirm.closest('.sheet'), 'account'); else closeAll();
});
document.getElementById('tools-toggle').addEventListener('click', () => document.getElementById('tools-body').classList.toggle('show'));
render();
</script>
</body>
</html>

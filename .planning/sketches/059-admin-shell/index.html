<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketch 059 — Admin Shell</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #d9d4e0; font-family: var(--font-sans); padding-top: 96px; color: var(--color-text); }
  :root[data-theme="dark"] body { background: #140a22; }
  button { font: inherit; color: inherit; }

  /* ================= sketch chrome (not part of the design) ================= */
  #variant-nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9998;
    background: #1b1026; color: #fff; font-family: system-ui, sans-serif; font-size: 13px;
    padding: 8px 12px; display: flex; flex-direction: column; gap: 6px;
  }
  #variant-nav .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  #variant-nav .lbl { opacity: .6; margin-right: 4px; }
  .vtab, .stab {
    background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 12px;
  }
  .vtab.active, .stab.active { background: #fff; color: #1b1026; border-color: #fff; }
  #sketch-tools {
    position: fixed; bottom: 12px; left: 12px; z-index: 9999; font-family: system-ui; font-size: 12px;
    background: rgba(0,0,0,.75); color: #fff; padding: 8px 10px; border-radius: 8px; opacity: .45;
    transition: opacity .2s; display: flex; flex-direction: column; gap: 6px;
  }
  #sketch-tools:hover { opacity: 1; }
  #sketch-tools button { background: #333; color: #fff; border: 0; border-radius: 4px; padding: 3px 7px; cursor: pointer; }
  #sketch-tools button.on { background: #fff; color: #000; }
  .notes { max-width: 760px; margin: 16px auto 80px; padding: 0 16px; font-family: system-ui; font-size: 13px; color: #3b3347; line-height: 1.5; }
  :root[data-theme="dark"] .notes { color: #cfc3e2; }
  .notes h3 { margin: 0 0 4px; font-size: 14px; }
  .notes ul { margin: 4px 0 0; padding-left: 18px; }

  /* ================= device frame ================= */
  .stage { display: flex; justify-content: center; padding: 8px 12px 0; }
  .device {
    width: 375px; max-width: 100%; height: 740px; background: var(--color-bg);
    border-radius: 22px; box-shadow: 0 10px 40px rgba(0,0,0,.28); overflow: hidden;
    position: relative; display: flex; flex-direction: column;
    transition: width var(--duration-slow) var(--ease-out-soft);
  }
  .device.desk { width: 1180px; border-radius: 10px; height: 760px; }
  .scroller { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; }

  /* ================= shared shell pieces ================= */
  .hdr {
    position: sticky; top: 0; z-index: 20; background: var(--color-bg);
    border-bottom: 1px solid var(--color-border);
  }
  .hdr-in { display: flex; align-items: center; gap: 8px; padding: 6px 12px; min-height: 56px; max-width: 1280px; margin: 0 auto; }
  .desk .hdr-in { padding: 6px 32px; }
  .icon-btn {
    width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center;
    border: 0; background: transparent; border-radius: var(--radius-md); cursor: pointer; position: relative;
    color: var(--color-text); transition: background var(--duration-fast) var(--ease-standard);
  }
  .icon-btn:hover { background: var(--color-surface); }
  .icon-btn:active { transform: scale(.96); }
  .icon-btn svg { width: 24px; height: 24px; }
  .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--color-text); cursor: pointer; flex-shrink: 0; }
  .brand img { height: 28px; width: auto; display: block; }
  .brand .img-dark { display: none; }
  :root[data-theme="dark"] .brand .img-light { display: none; }
  :root[data-theme="dark"] .brand .img-dark { display: block; }
  .brand .word { font-family: var(--font-display); font-size: 1.35rem; letter-spacing: .02em; line-height: 1; white-space: nowrap; }
  .spacer { flex: 1; }
  .desk-links { display: none; gap: 20px; margin-left: 16px; }
  .desk .desk-links { display: flex; }
  .desk-links a { font-size: var(--text-sm); font-weight: 600; color: var(--color-text-muted); text-decoration: none; padding: 16px 0 13px; border-bottom: 3px solid transparent; cursor: pointer; }
  .desk-links a.on { color: var(--color-primary); border-color: var(--color-primary); }
  :root[data-theme="dark"] .desk-links a.on { color: var(--color-accent-text); border-color: var(--color-accent-text); }

  /* signed-in dot on the hamburger (variant A) */
  .dot { position: absolute; top: 9px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--color-success); box-shadow: 0 0 0 2px var(--color-bg); }

  /* avatar */
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; background: var(--color-accent-bg); color: var(--color-accent-text);
    font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 2px var(--color-bg), 0 0 0 3.5px var(--color-success); flex-shrink: 0;
  }
  .avatar.lg { width: 44px; height: 44px; font-size: 16px; }
  .avatar.plain { box-shadow: none; }

  /* mode label */
  .mode-pill { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--color-text-muted); border: 1px solid var(--color-border); border-radius: var(--radius-full); padding: 2px 8px; white-space: nowrap; }

  /* page head */
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 32px; }
  .desk main { padding: 28px 32px 48px; }
  .back {
    display: inline-flex; align-items: center; gap: 2px; min-height: 44px; margin: -8px 0 -4px -10px; padding: 0 10px 0 4px;
    color: var(--color-text-muted); font-size: var(--text-sm); font-weight: 600; border: 0; background: none; cursor: pointer; border-radius: var(--radius-md);
  }
  .back:hover { color: var(--color-text); background: var(--color-surface); }
  .back svg { width: 18px; height: 18px; }
  .crumb { font-size: var(--text-sm); color: var(--color-text-muted); display: flex; gap: 6px; align-items: center; min-height: 28px; }
  .crumb a { color: inherit; cursor: pointer; text-decoration: none; }
  .crumb a:hover { color: var(--color-text); text-decoration: underline; }
  .ptitle { font-family: var(--font-display); font-size: 2rem; letter-spacing: .02em; line-height: 1.05; margin: 4px 0 2px; }
  .psub { font-size: var(--text-sm); color: var(--color-text-muted); margin: 0 0 16px; }

  /* neutral placeholder body — rows are designed in 060-062, kept plain here on purpose */
  .ph-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; background: var(--color-bg); }
  .ph-list li { padding: 13px 14px; border-top: 1px solid var(--color-border); font-size: var(--text-sm); display: flex; justify-content: space-between; gap: 12px; }
  .ph-list li:first-child { border-top: 0; }
  .ph-list li span:last-child { color: var(--color-text-muted); white-space: nowrap; }
  .ph-note { font-size: 11px; color: var(--color-text-muted); margin: 10px 2px 0; font-style: italic; }
  .fake-shelf h2 { font-family: var(--font-display); font-size: 1.3rem; margin: 18px 0 8px; letter-spacing: .02em; }
  .fake-rail { display: flex; gap: 10px; overflow: hidden; }
  .fake-poster { flex: 0 0 104px; height: 146px; border-radius: var(--radius-md); background: var(--color-surface-2); }

  /* ================= drawer ================= */
  .backdrop {
    position: absolute; inset: 0; z-index: 40; background: color-mix(in srgb, var(--color-text) 38%, transparent);
    opacity: 0; pointer-events: none; transition: opacity var(--duration-base) var(--ease-standard);
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: absolute; top: 0; bottom: 0; right: 0; width: 84%; max-width: 360px; z-index: 50;
    background: var(--color-bg); display: flex; flex-direction: column; padding: 8px 16px 16px;
    transform: translateX(100%); transition: transform var(--duration-slow) var(--ease-out-soft);
    box-shadow: var(--shadow-lg); overflow-y: auto;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; min-height: 48px; }
  .group-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-muted); margin: 16px 0 4px; }
  .dlinks { display: flex; flex-direction: column; margin: 0 -16px; }
  .dlink {
    display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border: 0; background: none; width: 100%;
    text-align: left; font-size: var(--text-base); font-weight: 500; cursor: pointer; border-left: 3px solid transparent;
    transition: background var(--duration-fast) var(--ease-standard);
  }
  .dlink:hover { background: var(--color-surface); }
  .dlink:active { background: var(--color-surface-2); }
  .dlink .ico { width: 22px; height: 22px; color: var(--color-text-muted); flex-shrink: 0; }
  .dlink .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dlink .chev { width: 16px; height: 16px; color: var(--color-text-muted); flex-shrink: 0; }
  .dlink.on { background: var(--color-surface); border-left-color: var(--color-primary); font-weight: 700; }
  .dlink.on .ico, .dlink.on .chev { color: var(--color-primary); }
  :root[data-theme="dark"] .dlink.on .ico, :root[data-theme="dark"] .dlink.on .chev { color: var(--color-accent-text); }
  :root[data-theme="dark"] .dlink.on { border-left-color: var(--color-accent-text); }
  .count { font-size: 12px; font-weight: 700; color: var(--color-accent-text); background: var(--color-accent-bg); border-radius: var(--radius-full); padding: 2px 8px; white-space: nowrap; }
  .divider { height: 1px; background: var(--color-border); margin: 12px 0; }
  .drawer-bottom { margin-top: auto; padding-top: 8px; }
  .theme-row { display: flex; justify-content: center; gap: 4px; }
  .theme-row .icon-btn { color: var(--color-text-muted); }
  .theme-row .icon-btn svg { width: 20px; height: 20px; }

  /* account card (A drawer, C sheet) */
  .account {
    display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius-lg);
    background: var(--color-surface); margin-top: 4px;
  }
  .account .who { min-width: 0; flex: 1; }
  .account .email { font-weight: 600; font-size: var(--text-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .account .state { font-size: 12px; color: var(--color-text-muted); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .account .state i { width: 7px; height: 7px; border-radius: 50%; background: var(--color-success); display: inline-block; }

  /* logout row — explicit label + icon, never a bare "Salir" */
  .logout {
    display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 0 12px; margin-top: 4px;
    border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); cursor: pointer;
    font-weight: 600; font-size: var(--text-sm); color: var(--color-danger); text-align: left;
    transition: background var(--duration-fast) var(--ease-standard), border-color var(--duration-fast);
  }
  .logout:hover { background: color-mix(in srgb, var(--color-danger) 8%, var(--color-bg)); border-color: color-mix(in srgb, var(--color-danger) 40%, var(--color-border)); }
  .logout:active { transform: scale(.99); }
  .logout svg { width: 20px; height: 20px; }
  :root[data-theme="dark"] .logout { color: #F2A3B8; }

  /* ================= bottom sheet ================= */
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 60; background: var(--color-bg);
    border-radius: 18px 18px 0 0; padding: 8px 16px 20px; box-shadow: var(--shadow-lg);
    transform: translateY(105%); transition: transform var(--duration-slow) var(--ease-out-soft);
    max-height: 85%; overflow-y: auto;
  }
  .sheet.open { transform: translateY(0); }
  .desk .sheet { left: auto; right: 24px; bottom: auto; top: 60px; width: 340px; border-radius: var(--radius-lg); transform: translateY(-8px); opacity: 0; pointer-events: none; transition: opacity var(--duration-base), transform var(--duration-base); }
  .desk .sheet.open { transform: none; opacity: 1; pointer-events: auto; }
  .desk .sheet.center { left: 50%; right: auto; top: 30%; transform: translate(-50%, -8px); }
  .desk .sheet.center.open { transform: translate(-50%, 0); }
  .grab { width: 36px; height: 4px; border-radius: 4px; background: var(--color-border); margin: 4px auto 12px; }
  .desk .grab { display: none; }
  .sheet h3 { font-family: var(--font-display); font-size: 1.5rem; letter-spacing: .02em; margin: 4px 0 6px; font-weight: 400; }
  .sheet p { font-size: var(--text-sm); color: var(--color-text-muted); margin: 0 0 16px; line-height: 1.45; }
  .sheet-actions { display: flex; flex-direction: column; gap: 8px; }
  .btn {
    min-height: 44px; border-radius: var(--radius-md); border: 1px solid var(--color-border); background: var(--color-bg);
    font-weight: 600; font-size: var(--text-sm); cursor: pointer; padding: 0 16px;
    transition: background var(--duration-fast) var(--ease-standard);
  }
  .btn:hover { background: var(--color-surface); }
  .btn:active { transform: scale(.99); }
  .btn.danger { background: var(--color-danger); border-color: var(--color-danger); color: #fff; }
  .btn.danger:hover { filter: brightness(1.07); }

  /* ================= variant C: bottom tab bar ================= */
  .dock {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--color-bg);
    border-top: 1px solid var(--color-border); display: flex; padding: 4px 4px max(10px, env(safe-area-inset-bottom));
  }
  .dock button {
    flex: 1; min-width: 0; min-height: 52px; isolation: isolate; -webkit-tap-highlight-color: transparent;
    transition: color var(--duration-fast) var(--ease-standard), transform var(--duration-fast); border: 0; background: none; cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--color-text-muted);
    border-radius: var(--radius-md); position: relative;
  }
  .dock button svg { width: 24px; height: 24px; }
  .dock button.on { color: var(--color-primary); }
  :root[data-theme="dark"] .dock button.on { color: var(--color-accent-text); }
  .dock button:hover { color: var(--color-text); }
  .dock .tab-ico { position: relative; width: 56px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 15px; transition: background var(--duration-base) var(--ease-out-soft); }
  .dock button.on .tab-ico { background: var(--color-accent-bg); }
  .dock button.on .tab-lbl { font-weight: 700; }
  :root[data-theme="dark"] .dock button.on .tab-ico { background: color-mix(in srgb, var(--color-accent-text) 22%, transparent); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .dock button.on .tab-ico { background: color-mix(in srgb, var(--color-accent-text) 22%, transparent); } }
  .dock .tab-lbl { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dock button:active { transform: scale(.96); }
  .dock .badge-dot.small { min-width: 8px; width: 8px; height: 8px; padding: 0; top: 4px; left: 34px; }
  .dock .badge-dot { position: absolute; top: 0; left: 30px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--color-secondary); color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
  .has-dock .scroller { padding-bottom: 72px; }
  .desk .dock { position: sticky; top: 57px; bottom: auto; border-top: 0; border-bottom: 1px solid var(--color-border); justify-content: safe center; gap: 8px; padding: 0 16px; order: -1; overflow-x: auto; }
  .desk .dock button { flex: 0 0 auto; flex-direction: row; min-height: 44px; padding: 0 14px; font-size: 13px; gap: 8px; }
  .desk .dock button svg { width: 18px; height: 18px; }
  .desk .dock .tab-ico { width: auto; height: auto; background: none !important; }
  .desk .dock button { border-radius: var(--radius-full); }
  .desk .dock button.on { background: var(--color-accent-bg); }
  .desk .dock .badge-dot { position: static; margin-left: 6px; }
  .desk.has-dock .scroller { padding-bottom: 0; }

  #c-main { transition: opacity var(--duration-fast) var(--ease-standard); }
  #c-main.swapping { opacity: 0; }
  .sheet.dragging { transition: none; }

  /* ================= signed-out: ingresar ================= */
  .login { max-width: 360px; margin: 40px auto 0; }
  .field label { display: block; font-size: var(--text-sm); font-weight: 600; margin-bottom: 6px; }
  .field input { width: 100%; min-height: 48px; border-radius: var(--radius-md); border: 1px solid var(--color-surface-2); background: var(--color-bg); color: var(--color-text); padding: 0 14px; font-size: var(--text-base); }
  .field input:focus { outline: 2px solid var(--color-primary); outline-offset: 1px; }
  .login .btn { width: 100%; margin-top: 12px; background: var(--color-surface); }

  /* ================= toast ================= */
  .toast {
    position: absolute; left: 50%; top: 68px; z-index: 70; transform: translate(-50%, -12px); opacity: 0;
    background: var(--color-text); color: var(--color-bg); font-size: var(--text-sm); font-weight: 600; border-radius: var(--radius-full);
    padding: 10px 16px; display: flex; gap: 8px; align-items: center; white-space: nowrap; pointer-events: none;
    transition: opacity var(--duration-base), transform var(--duration-base) var(--ease-out-soft);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast svg { width: 18px; height: 18px; }
</style>
</head>
<body>

<div id="variant-nav">
  <div class="row">
    <span class="lbl">Variante</span>
    <button class="vtab" data-v="A">A: Drawer carries the account</button>
    <button class="vtab" data-v="B">B: Avatar + account sheet</button>
    <button class="vtab" data-v="C">C: Bottom tab bar ★ Winner</button>
  </div>
  <div class="row">
    <span class="lbl">Estado</span>
    <button class="stab active" data-m="admin">Admin (sesión iniciada)</button>
    <button class="stab" data-m="public">Sitio público con sesión</button>
    <button class="stab" data-m="out">Sin sesión</button>
  </div>
</div>

<div class="stage"><div class="device" id="device"></div></div>

<div class="notes" id="notes"></div>

<div id="sketch-tools"><button id="tools-toggle" style="align-self:flex-end">⚙ tools</button><div id="tools-body" style="display:none;flex-direction:column;gap:6px">
  <div>Tema: <button data-theme-set="light">☀</button> <button data-theme-set="dark">☾</button> <button data-theme-set="system">Sistema</button></div>
  <div>Vista: <button data-vp="phone" class="on">Teléfono</button> <button data-vp="desk">Escritorio</button></div>
  <div>Rol: <button data-role="owner" class="on">Dueño</button> <button data-role="staff">Staff</button></div>
</div></div>

/* ---------------- render + events ---------------- */
const device = document.getElementById('device');
function fitNav() { document.body.style.paddingTop = (document.getElementById('variant-nav').offsetHeight + 8) + 'px'; }
window.addEventListener('resize', fitNav);
function render() {
  fitNav();
  device.className = 'device' + (S.vp === 'desk' ? ' desk' : '') + (S.v === 'C' && S.mode === 'admin' ? ' has-dock' : '');
  device.innerHTML = ({ A: variantA, B: variantB, C: variantC })[S.v]() + `<div class="toast" id="toast">${ic('check')}<span></span></div>`;
  document.getElementById('notes').innerHTML = NOTES[S.v];
  document.querySelectorAll('.vtab').forEach(b => b.classList.toggle('active', b.dataset.v === S.v));
  document.querySelectorAll('.stab').forEach(b => b.classList.toggle('active', b.dataset.m === S.mode));
  if (S.toast) { showToast(S.toast); S.toast = null; }
}
let returnFocus = null;
function closeAll() {
  const had = device.querySelector('.drawer.open,.sheet.open');
  device.querySelectorAll('.open').forEach(el => { el.classList.remove('open'); el.style.transform = ''; });
  if (had && returnFocus && document.contains(returnFocus)) returnFocus.focus({ preventScroll: true });
  if (had) returnFocus = null;
}
function openEl(sel, withBackdrop = true, opener = null) {
  const keep = returnFocus || opener;
  closeAll(); returnFocus = keep;
  const el = device.querySelector(sel); if (!el) return;
  void el.offsetWidth; el.classList.add('open'); if (withBackdrop) device.querySelector('.backdrop').classList.add('open');
  const first = el.querySelector('button:not([disabled]), a, input'); first && first.focus({ preventScroll: true });
}
/* Variant C: header + tab bar persist; only the page content swaps (as a LiveView
   navigate inside one live_session layout would). Soft fade, scroll reset, tab state patched. */
function softSwap() {
  const main = device.querySelector('#c-main');
  if (!main || S.v !== 'C' || S.mode !== 'admin') return render();
  main.classList.add('swapping');
  setTimeout(() => {
    const top = activeTop();
    main.innerHTML = pageHead({ backStyle: 'back' }) + adminBody();
    device.querySelectorAll('.dock [data-tab]').forEach(b => {
      const on = b.dataset.tab === top || (b.dataset.tab === 'more' && !device.querySelector(`.dock [data-tab="${top}"]`));
      b.classList.toggle('on', on); on && b.dataset.tab !== 'more' ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current');
    });
    device.querySelectorAll('#sheet-more .dlink').forEach(b => b.classList.toggle('on', b.dataset.nav === top));
    device.querySelector('.scroller').scrollTop = 0;
    main.classList.remove('swapping');
  }, 100);
}
/* Drag a bottom sheet down to dismiss (phone only). */
let drag = null, suppressClick = false;
device.addEventListener('pointerdown', e => {
  const sh = e.target.closest('.sheet.open'); if (!sh || S.vp === 'desk') return;
  if (!e.target.closest('.grab') && sh.scrollTop > 0) return;
  if (e.target.closest('button') && !e.target.closest('.grab')) { drag = { sh, y: e.clientY, dy: 0, pending: true }; return; }
  drag = { sh, y: e.clientY, dy: 0, pending: false }; sh.classList.add('dragging');
});
window.addEventListener('pointermove', e => {
  if (!drag) return; const dy = Math.max(0, e.clientY - drag.y);
  if (drag.pending) { if (dy < 8) return; drag.pending = false; drag.sh.classList.add('dragging'); }
  drag.dy = dy; drag.sh.style.transform = `translateY(${dy}px)`;
});
window.addEventListener('pointerup', () => {
  if (!drag) return; const { sh, dy, pending } = drag; drag = null; sh.classList.remove('dragging');
  if (pending) return;
  if (dy > 8) { suppressClick = true; setTimeout(() => suppressClick = false, 0); }
  if (dy > 80) closeAll(); else sh.style.transform = '';
});
function showToast(msg) {
  const t = device.querySelector('#toast'); t.querySelector('span').textContent = msg;
  void t.offsetWidth; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2600);
}
function setTheme(v) {
  if (v === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v;
}

document.addEventListener('click', e => {
  if (suppressClick) { e.stopPropagation(); e.preventDefault(); return; }
  const t = e.target.closest('[data-v],[data-m],[data-vp],[data-role],[data-theme-set],[data-act],[data-nav],[data-go-public]');
  if (!t) return;
  if (t.dataset.v) { S.v = t.dataset.v; return render(); }
  if (t.dataset.m) { S.mode = t.dataset.m; if (S.mode === 'admin') S.screen = 'panel'; return render(); }
  if (t.dataset.vp) { S.vp = t.dataset.vp; document.querySelectorAll('[data-vp]').forEach(b => b.classList.toggle('on', b === t)); return render(); }
  if (t.dataset.role) { S.role = t.dataset.role; if (S.screen === 'staff' && S.role !== 'owner') S.screen = 'panel'; document.querySelectorAll('[data-role]').forEach(b => b.classList.toggle('on', b === t)); return render(); }
  if (t.dataset.themeSet) return setTheme(t.dataset.themeSet);
  if (t.dataset.goPublic) { if (S.mode !== 'out') { S.mode = 'public'; render(); } return; }
  if (t.dataset.nav) {
    const n = t.dataset.nav;
    if (n.startsWith('pub:')) { if (n === 'pub:about') { closeAll(); showToast('Quiénes Somos (sin cambios)'); return; } S.mode = S.mode === 'out' ? 'out' : 'public'; closeAll(); setTimeout(render, 180); return; }
    const wasOpen = !!device.querySelector('.drawer.open,.sheet.open');
    // Re-tapping the active tab pops to that tab's root (or scrolls to top when already there).
    if (t.dataset.tab && S.mode === 'admin' && activeTop() === n) {
      if (S.screen !== n) { S.screen = n; return softSwap(); }
      return device.querySelector('.scroller').scrollTo({ top: 0, behavior: 'smooth' });
    }
    const canSoft = S.v === 'C' && S.mode === 'admin';
    S.mode = 'admin'; S.screen = n; closeAll();
    // C swaps content underneath the closing sheet (no wait); other variants re-render after the close animation.
    if (canSoft) softSwap(); else setTimeout(render, wasOpen ? 180 : 0); return;
  }
  const a = t.dataset.act;
  if (a === 'open-drawer') openEl('.drawer', true, t);
  else if (a === 'open-account') openEl('#sheet-account', true, t);
  else if (a === 'open-more') openEl('#sheet-more', true, t);
  else if (a === 'ask-logout') openEl('#sheet-logout');
  else if (a === 'close') closeAll();
  else if (a === 'logout') { closeAll(); setTimeout(() => { S.mode = 'out'; S.toast = 'Cerraste sesión'; render(); }, 200); }
  else if (a === 'login') { S.mode = 'admin'; S.screen = 'panel'; S.toast = 'Entraste como ' + USER.email; render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });
document.getElementById('tools-toggle').addEventListener('click', () => { const b = document.getElementById('tools-body'); b.style.display = b.style.display === 'none' ? 'flex' : 'none'; });
render();
</script>
</body>

  .stp:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  .stp-n { min-width: 24px; text-align: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .sheet .stp { background: var(--color-surface); }
  .useg { display: inline-flex; gap: 2px; padding: 2px; background: var(--color-surface); border-radius: 10px; flex-shrink: 0; }
  .useg > button, .useg > .ustep { position: relative; min-width: 44px; height: 34px; border: 0; background: none; border-radius: 8px; cursor: pointer;
    font-size: 14px; font-weight: 400; color: var(--color-text); padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; transition: background var(--duration-fast); }
  .useg > button::before { content: ''; position: absolute; inset: -5px 0; }
  .useg > .on { background: var(--color-bg); box-shadow: 0 1px 3px rgba(0,0,0,.14); font-weight: 600; }
  :root[data-theme="dark"] .useg > .on { background: var(--color-surface-2); }
  .zone-int .useg { background: var(--color-surface-2); }
  .zone-int .useg > .on { background: var(--color-bg); }
  :root[data-theme="dark"] .zone-int .useg { background: color-mix(in srgb, #000 30%, var(--color-surface)); }
  :root[data-theme="dark"] .zone-int .useg > .on { background: var(--color-surface-2); }
  .useg > button:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 1px; }
  .useg > .ustep { padding: 0 2px; cursor: default; }
  .ustep .stp { width: 26px; height: 26px; background: none; }
  .ustep .stp::before { inset: -9px -2px; }
  .ustep .stp svg { width: 14px; height: 14px; }
  .ustep .stp-n { min-width: 18px; font-size: 14px; }
  .r6 .sbox.rows .srow.urow { min-height: 48px; }
  .r6 .sbox.rows .srow.static:hover { background: none; }

  /* ================= R12: En el inicio action + Datos de BGG in one line ================= */
  .filas6 { position: relative; }
  /* C2: soft full-width button closing the box */
  .cta2-wrap { padding: 4px 12px 8px; }
  .cta2 { width: 100%; min-height: 40px; border: 0; border-radius: var(--radius-md); background: var(--color-bg); color: var(--color-primary); font-size: 13px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: background var(--duration-fast), transform var(--duration-fast); }
  .cta2 svg { width: 16px; height: 16px; }
  .cta2:hover { background: var(--color-surface-2); }
  .cta2:active { transform: scale(.98); }
  .cta2:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  :root[data-theme="dark"] .cta2 { color: var(--color-accent-text); background: color-mix(in srgb, #000 22%, var(--color-surface)); }
  /* R13: Datos de BGG — public-style facts, preview + Ver más / Ver menos */
  .r6 .bgg6 { padding: 0; }
  .r6 .bgg6 .bgg-body { padding: 12px 16px 0; }
  .bgg-foot { margin: 16px 0 0; font-size: 12px; color: var(--color-text-muted); }
  .r6 .bgg-body > .bgg-link { margin: 0 0 0 -12px; }
  .bgg-more { width: 100%; min-height: 44px; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;
    font-size: 13px; font-weight: 600; color: var(--color-primary); border-radius: 0 0 var(--radius-lg) var(--radius-lg); transition: background var(--duration-fast); }
  .bgg-more:hover { background: var(--color-surface-2); }
  .bgg-more:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }
  .bgg-more .chev { width: 16px; height: 16px; transition: transform var(--duration-base) var(--ease-out-soft); }
  .bgg6.open .bgg-more .chev { transform: rotate(180deg); }
  :root[data-theme="dark"] .bgg-more { color: var(--color-accent-text); }
  .bgg-empty { margin: 0; padding: 12px 16px; }
  /* B3: read-only said once, beside the section label */
  .sec-note { display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; font-size: 12px; font-weight: 400; color: var(--color-text-muted); vertical-align: 1px; }
  .sec-note svg { width: 12px; height: 12px; }

  /* ================= 065: one label per job — identical block in 060–063 =================
     Composing the whole admin (sketch 065) turned up three answers to "this is a labelled block
     inside a page": 11px uppercase muted (Agregar juego · Filas del inicio · Equipo · Sin ubicar),
     12px sentence muted (Nombre · Subtítulo) and 13px sentence in full colour (Portada · En el club).
     Two labels, one size, from here on:
       SECTION label  13px/600, full text colour, sentence case — names a block on the page
       FIELD label    13px/600, muted                          — names one input inside a block
     .group-label keeps exactly the job 059 gave it — the header of a group of rows in the drawer or a
     sheet — so it only changes where 061/062 had borrowed it for a page body.
     A group of setting rows on a page is the editor's soft box, never 062's hairlines (063 R3/R6). */
  #device main :is(.sec-label, .group-label) {
    font-size: 13px; font-weight: 600; letter-spacing: .01em; line-height: 1.3; text-transform: none;
    color: var(--color-text); margin: 0 0 8px;
  }
  #device main :is(.flabel, .field label) {
    font-size: 13px; font-weight: 600; letter-spacing: .01em; line-height: 1.3; text-transform: none;
    color: var(--color-text-muted);
  }
  #device main .lhead :is(.sec-label, .group-label) { margin: 0; }
  #device main .sgroup { margin: 0; border: 0; padding: 4px 0; overflow: hidden;
    background: var(--color-surface); border-radius: var(--radius-lg); }
  #device main .sgroup .srow { min-height: 40px; padding: 4px 16px; }
  #device main .sgroup .srow + .srow { border-top: 0; }
  #device main .sgroup .srow .gname { font-size: 14px; }
  #device main .sgroup .srow .val { font-size: 13px; }
  #device main .sgroup .srow:hover { background: var(--color-surface-2); }

  /* The page head sits the same distance above the first block as blocks sit from each other.
     Sections are 24px apart everywhere (.jsec + .jsec in 061/062, .sec + .sec in 063), but the head
     was 16px above the first block on list pages — and 12px on Asignar, whose spacer follows .trow
     instead of .ptitle and so missed the polish rule that bumped the others to 16. One gap now. */
  #device main > .psub { margin-bottom: 24px; }
  #device main > :is(.ptitle, .trow) + div[style*="height"] { height: 24px !important; }
  /* One title height. A page title lands in the same place whether it sits alone (Web, sección),
     shares its row with a control (Asignar's Renombrar) or is the editor's editable name. Before
     this it jumped up to 7px between drill-downs, because a 44px control centred the 26px title
     inside its row while a bare title started at the row's top. */
  #device main .trow > .ptitle, #device main .tline > .tfield { align-self: flex-start; }

  /* ================= 064: admin button system (S3 Contorno, weight-tuned) — identical block in 059–063 =================
     One anatomy: 44px · radius-md · 14px/600 · 16px icon · 8px gap. The role is the only thing that changes the paint:
       Principal  .obtn / .b-pri  1px primary stroke, primary label — at most one per block, last in its row
       Secundaria .b-sec          1px neutral --stroke (≥ 3:1, the same token as text fields), text-color label
       Terciaria  .tbtn           no stroke, secondary-purple label (one step lighter than Principal)
       Peligro    .tbtn.danger    no stroke, danger label — never Principal, confirms in a sheet
     No disabled buttons (Guardar only shows with changes; submits validate on tap). Sheets keep 059 rows.
     Scoped with #device so it wins over each sketch's older local .obtn/.tbtn rules. */
  :root { --stroke: color-mix(in srgb, var(--color-text) 58%, var(--color-bg)); --ter: var(--color-secondary); }
  :root[data-theme="dark"] { --stroke: color-mix(in srgb, var(--color-text) 42%, var(--color-bg)); --ter: var(--color-text-muted); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --stroke: color-mix(in srgb, var(--color-text) 42%, var(--color-bg)); --ter: var(--color-text-muted); } }
  #device :is(.obtn, .tbtn, .b-pri, .b-sec):not(.snack .tbtn) { min-height: 44px; border-radius: var(--radius-md); font-size: 14px; font-weight: 600; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
  #device :is(.obtn, .tbtn, .b-pri, .b-sec) svg:not(.spin) { width: 16px; height: 16px; }
  #device :is(.obtn, .b-pri, .b-sec) { padding: 0 16px; border: 1px solid; background: var(--color-bg); opacity: 1; }
  #device :is(.obtn, .b-pri) { border-color: var(--color-primary); color: var(--color-primary); }
  #device :is(.obtn, .b-pri):hover { background: color-mix(in srgb, var(--color-primary) 7%, var(--color-bg)); }
  :root[data-theme="dark"] #device :is(.obtn, .b-pri) { border-color: var(--color-accent-text); color: var(--color-accent-text); background: transparent; }
  :root[data-theme="dark"] #device :is(.obtn, .b-pri):hover { background: color-mix(in srgb, var(--color-accent-text) 10%, transparent); }
  #device .b-sec { border-color: var(--stroke); color: var(--color-text); }
  #device .b-sec:hover { background: var(--color-surface); }
  :root[data-theme="dark"] #device .b-sec { background: transparent; }
  :root[data-theme="dark"] #device .b-sec:hover { background: color-mix(in srgb, var(--color-text) 8%, transparent); }
  #device .tbtn:not(.b-pri):not(.b-sec):not(.snack .tbtn) { padding: 0 12px; border: 0; background: none; color: var(--ter); }
  #device .tbtn:not(.b-pri):not(.b-sec):not(.snack .tbtn):hover { background: color-mix(in srgb, var(--ter) 10%, transparent); }
  /* Peligro repeats the Terciaria selector chain so it outranks it (plain .tbtn.danger lost to the :not() chain) */
  #device .tbtn.danger:not(.b-pri):not(.b-sec):not(.snack .tbtn) { color: var(--color-danger); }
  #device .tbtn.danger:not(.b-pri):not(.b-sec):not(.snack .tbtn):hover { background: color-mix(in srgb, var(--color-danger) 9%, transparent); }
  :root[data-theme="dark"] #device .tbtn.danger:not(.b-pri):not(.b-sec):not(.snack .tbtn) { color: #F2A3B8; }
  #device :is(.obtn, .tbtn, .b-pri, .b-sec):focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  :root[data-theme="dark"] #device :is(.obtn, .tbtn, .b-pri, .b-sec):focus-visible { outline-color: var(--color-accent-text); }
  #device .btn-block { width: 100%; }
  /* text fields share the Secundaria stroke (1px, ≥ 3:1); in-place editors (063 title/description/number) keep their soft look */
  #device :is(.tin, .field input):not(.desc-in):not(.num):not(.title-in) { border: 1px solid var(--stroke); }
  #device :is(.tin, .field input):not(.desc-in):not(.num):not(.title-in):focus { border-color: var(--color-primary); box-shadow: 0 0 0 1px var(--color-primary); }
  :root[data-theme="dark"] #device :is(.tin, .field input):not(.desc-in):not(.num):not(.title-in):focus { border-color: var(--color-accent-text); box-shadow: 0 0 0 1px var(--color-accent-text); }
  #device :is(.tin, .field input).invalid { border-color: var(--color-danger); box-shadow: 0 0 0 1px var(--color-danger); }
  #device .banner-actions { gap: 8px; }
  /* the -8px pull is for borderless text buttons; an outlined button ends the row on the content edge */
  #device .banner-actions:has(> :is(.obtn, .b-pri, .b-sec):last-child) { margin-right: 0; }
  /* 063 Estado under the 064 system: status on top, one action row below (right-aligned, Principal last) */
  #device.r6 .ebar.inline { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px 16px; }
  #device .ebar .eactions { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
  #device .ebar .eactions .push { margin-right: auto; margin-left: -12px; }
  #device .ebar .eactions > .tbtn:first-child:not(.b-pri):not(.b-sec) { margin-left: -12px; }
  #device.r6 .ebar.inline .obtn { background: var(--color-bg); }
  #device .cta2 { width: 100%; }
  #device .tbtn.bgg-more { width: 100%; border-radius: 0 0 var(--radius-lg) var(--radius-lg); }

/* ================= 065 only: what a composed walk needs =================
   Nothing here restyles a page. It covers the two things no single sketch could own:
   the phone soft keyboard (059/061 flagged it, nobody tested it) and the walk chrome. */
  /* iOS zooms the page in when a focused field's text is under 16px. Every admin field was 14-15px,
     and the shipped answer was "fix it with the viewport meta" — but maximum-scale=1 also kills
     pinch-zoom for everyone. Instead: fields grow to 16px on touch pointers only. */
  @media (pointer: coarse) {
    #device :is(.tin, .field input, .sfield input, .title-in, .desc-in, textarea) { font-size: 16px; }
    .polish #device .tin, #device .polish .tin, .polish .tin, .polish .sfield input, .polish .tin.desc-in { font-size: 16px; }
  }
  /* The soft keyboard covers the bottom of the screen. A bottom tab bar there is either hidden behind
     the keyboard (iOS, which doesn't resize the layout viewport) or pressed right against its top row
     (Android), where it gets mis-tapped. So while a field has focus the tab bar leaves. */
  .device .tabs { transition: transform var(--duration-base) var(--ease-out-soft); }
  .device.kbd .tabs { transform: translateY(100%); pointer-events: none; }
  .device.kbd.desk .tabs { transform: none; pointer-events: auto; }
  /* the keyboard itself, so the composition can be judged and asserted at a real height */
  .kbdsim { position: absolute; left: 0; right: 0; bottom: 0; height: var(--kbh, 292px); z-index: 80;
    background: repeating-linear-gradient(90deg, #b9b3c4 0 12.5%, #cdc7d6 12.5% 25%); border-top: 1px solid #9a93a8;
    display: flex; align-items: flex-start; justify-content: center; padding-top: 6px; font: 11px system-ui; color: #4b4356; letter-spacing: .08em; }
  :root[data-theme="dark"] .kbdsim { background: repeating-linear-gradient(90deg, #2b2438 0 12.5%, #3a3149 12.5% 25%); border-top-color: #4a4159; color: #b2a8c2; }
  /* with the keyboard up the page keeps its own bottom room, and any sheet sits on top of the keyboard */
  .device.kbd .scroller { padding-bottom: calc(var(--kbh, 292px) + 16px); }
  .device.kbd .sheet { bottom: var(--kbh, 292px); max-height: calc(100% - var(--kbh, 292px) - 24px); }
  .device.kbd .snack { bottom: calc(var(--kbh, 292px) + 12px); }
  .device.kbd.desk .scroller { padding-bottom: 0; }
  .device.kbd.desk .sheet { bottom: auto; max-height: none; }

  /* walk chrome (not part of the design) */
  #walk { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #walk .step-n { opacity: .6; font-variant-numeric: tabular-nums; }
  .stab.done { opacity: .5; }
</style>

const PHONE_TABS = ['panel', 'juegos', 'secciones', 'estantes'];

const home = () => 'panel';

const activeTop = () => SCREENS[S.screen].parent || S.screen;
const signedIn = () => S.mode !== 'out';

/* ---------------- ONE row anatomy ----------------
   [28px slot: icon or avatar] [label (+ secondary line)] [count] [chevron]; only a tone class varies. */
function row({ act, nav, icon, avatar, avatarText, label, sub, count, tone = '', chev = true, isStatic = false, on = false, extra = '', wrap = false }) {
  const tag = isStatic ? 'div' : 'button';
  const attrs = isStatic ? '' : (act ? `data-act="${act}" ${extra}` : `data-nav="${nav}"`);
  const slot = avatar || avatarText ? `<span class="avatar">${avatarText || USER.initials}</span>` : ic(icon, 'ico');
  return `<${tag} class="dlink ${tone} ${isStatic ? 'static' : ''} ${on ? 'on' : ''}" ${attrs} ${on ? 'aria-current="page"' : ''}>
    <span class="slot">${slot}</span><span class="lbl ${wrap ? 'wrap' : ''}">${label}${sub ? `<span class="sub">${sub}</span>` : ''}</span>
    ${count ? `<span class="count" aria-label="${count} pendientes">${count}</span>` : ''}${chev && !isStatic ? ic('chevR', 'chev') : ''}</${tag}>`;
}
const group = (label, rows) => `<div class="group-label">${label}</div><div class="dlinks">${rows}</div>`;

/* Drawer never repeats the nav menu (tab bar). Admin: only sections the tab bar lacks (phone: Revisar niveles,
   Staff; desktop: none, the tab row holds everything). Public page signed in: no tab bar, so one way in: "Ir a Admin". */
const drawerAdminKeys = () => {
  if (S.mode !== 'admin') return ['panel'];
  const inNav = S.vp === 'desk' ? topKeys() : PHONE_TABS;
  return topKeys().filter(k => !inNav.includes(k));
};
const panelRows = () => {
  const top = S.mode === 'admin' ? activeTop() : null;
  return drawerAdminKeys().map(k => row({ nav: k, icon: SCREENS[k].icon, label: S.mode === 'admin' ? SCREENS[k].title : 'Ir a Admin', count: cnt(k), on: top === k })).join('');
};
const siteRows = () => row({ nav: 'pub:inicio', icon: 'home', label: 'Inicio', on: S.mode !== 'admin' }) + row({ nav: 'pub:about', icon: 'about', label: 'Quiénes Somos' });
const accountRows = () =>

/* ================= from 062: the one counter source (DATA/cnt) ================= */
/* ONE counter source. The dashboard boxes, the drawer counts and the tab badges all read DATA()/cnt()
   and nothing else — sketch 065 showed what happens otherwise: the Admin boxes kept a load-time number
   while the page underneath them emptied out. A count pill ALWAYS means pending work. */
const DATA = () => ({
  drafts: jCount('draft'), total: TOTAL, placed: placedN(), mismatches: V.mis.length,
  sections: V.sections.filter(s => !s.hidden).length, staff: V.staff.length,
  invites: V.staff.filter(p => p.st === 'pending').length,
});
function cnt(k) {
  const d = DATA();
  const n = { juegos: d.drafts, estantes: d.total - d.placed, niveles: d.mismatches }[k] || 0;
  return n ? String(n) : '';
}
/* ================= from 060: the page head + the Admin home dashboard ================= */
function pageHead() {
  const sc = SCREENS[S.screen];
  // Back row only for genuine drill-downs (page-shell.md rule). Pages reached from a tab or the
  // drawer are siblings of Admin, not children, so they get no "‹ Admin".
  const parent = sc.parent || null;
  return `${parent ? `<button class="back" data-nav="${parent}">${ic('chevL')}${SCREENS[parent].title}</button>` : ''}
    <h1 class="ptitle">${sc.title}</h1>${sc.sub ? `<p class="psub">${sc.sub}</p>` : '<div style="height:12px"></div>'}`;
}
/* ================= 060: the Admin home page — a minimal dashboard of boxes =================
   ONE box anatomy, centered: [icon · name] → big number → (optional meter) → one note line. 2 columns (desktop 3).
   The whole box is the tap target (border tint on hover, press scale, focus ring). No filled buttons.
   Pending work = the same accent count bubble used in the drawer and tab badges; otherwise a muted foot line. */
const nf = n => n.toLocaleString('es-AR');
/* Box = name → number → ONE line that adds meaning. The line never repeats the name as a unit
   ("Juegos · 412 juegos"); it says what's pending or what the number means for this section. */
function boxData(k) {
  const d = DATA(), unplaced = d.total - d.placed;
  return {
    juegos:    { num: nf(d.total), note: d.drafts ? `${d.drafts} ${d.drafts === 1 ? 'borrador' : 'borradores'}` : 'Todos publicados', pend: !!d.drafts },
    secciones: { num: d.sections, note: 'filas en el inicio' },
    estantes:  { num: `${Math.round(d.placed / d.total * 100)}%`, meter: d.placed / d.total, note: unplaced ? `${nf(unplaced)} sin ubicar` : 'Todos ubicados', pend: !!unplaced },
    niveles:   { num: d.mismatches, note: d.mismatches ? 'no coinciden con BGG' : 'Todo coincide con BGG', pend: !!d.mismatches },
    staff:     { num: d.staff, note: d.invites ? `${d.invites} ${d.invites === 1 ? 'invitación pendiente' : 'invitaciones pendientes'}` : 'Sin invitaciones pendientes', pend: !!d.invites },
  }[k];
}
function box(k) {
  const b = boxData(k);
  return `<button class="box" data-nav="${k}">
    <span class="box-head">${ic(SCREENS[k].icon, 'ico')}<span class="name">${SCREENS[k].title}</span></span>
    <span class="box-num">${b.num}</span>
    ${b.meter != null ? `<span class="meter" aria-hidden="true"><i style="width:${b.meter * 100}%"></i></span>` : ''}
    <span class="box-foot">${b.pend ? `<span class="pend">${b.note}</span>` : b.note}</span>
  </button>`;
}
const panelBody = () => `<div class="dash">${sections().map(box).join('')}</div>`;

  const base = { key: 's' + s.id, slot: slotIco(secIcon(s), s.featured ? 'feat' : ''), name: esc(s.name), sub: secMeta(s), muted: s.hidden };
  const trail = s.featured ? '<span class="fixed">Siempre primera</span>' : moveBtns('secciones', s.id, i, rest.length, s.name);
  if (V.variant === 'A') return splitRow({ ...base, act: 'v-open-sec', attrs: `data-id="${s.id}"`, trail });
  if (V.ordering === 'secciones') return splitRow({ ...base, trail });
  return tapRow({ ...base, act: 'v-open-sec', attrs: `data-id="${s.id}"` });
}
const webBody = () => `${head('Web', { sub: 'Elegí qué filas se ven en el inicio y en qué orden.' })}
  ${addForm({ id: 'sec-new', label: 'Nueva sección', ph: 'Nombre de la sección', value: V.newSec, err: V.newSecErr, btn: 'Crear' })}
  <section class="jsec">${lhead('Filas del inicio', 'secciones', true)}
    <div class="glist ${V.ordering === 'secciones' ? 'ordering' : ''}">${V.sections.map(secRow).join('')}</div>
    <p class="lnote">Las filas sin juegos publicados no se ven en el inicio.</p></section>`;

/* ---- Web › sección (settings + members) ---- */
function memRow(s, g, i, n) {
  const base = { key: 'm' + g.id, slot: thumbOf(g), name: esc(g.name), sub: meta(g.year, `${g.pl} jug.`) };
  const manual = s.sort === 'manual';
  if (V.variant === 'A') return splitRow({ ...base, trail: (manual ? moveBtns('members', g.id, i, n, g.name) : '') +
    `<button type="button" class="ibtn" data-act="v-rm-mem" data-id="${g.id}" aria-label="Quitar ${esc(g.name)}">${ic('minusC')}</button>` });
  if (V.ordering === 'members') return splitRow({ ...base, trail: moveBtns('members', g.id, i, n, g.name) });
  return tapRow({ ...base, act: 'v-mem-sheet', attrs: `data-id="${g.id}" aria-label="Opciones de ${esc(g.name)}"`, trail: ic('more', 'chev') });
}
function secBody() {
  const s = curSec();
  if (!V.ed) V.ed = { name: s.name, sub: s.sub || '', hidden: !!s.hidden, sort: s.sort };
  const e = V.ed, dirty = e.name !== s.name || e.sub !== (s.sub || '') || e.hidden !== !!s.hidden || e.sort !== s.sort;
  const n = s.kind === 'manual' ? s.members.length : s.n;
  const order = s.kind === 'recent'
    ? `<div class="srow static"><span class="gtxt"><span class="gname">Orden</span></span><span class="val">Más recientes primero</span></div>`
    : V.variant === 'B'
      ? `<button type="button" class="srow" data-act="v-sort-sheet" aria-haspopup="dialog"><span class="gtxt"><span class="gname">Orden</span></span><span class="val">${SORTS[e.sort]}</span>${ic('chevR', 'chev')}</button>`
      : '';
  const orderSelect = s.kind !== 'recent' && V.variant === 'A'
    ? `<label class="flabel" for="ed-sort" style="margin-top:16px">Orden</label><select id="ed-sort" class="tin full sel">${sortKeys(s).map(k => `<option value="${k}" ${e.sort === k ? 'selected' : ''}>${SORTS[k]}</option>`).join('')}</select>` : '';
  const settings = `<section class="jsec" aria-label="Ajustes">
    <div class="group-label" style="margin:0 0 8px">Ajustes</div>
    <label class="flabel" for="ed-name">Nombre</label><input id="ed-name" class="tin full" value="${esc(e.name)}" autocomplete="off">
    <label class="flabel" for="ed-sub">Subtítulo</label><input id="ed-sub" class="tin full" value="${esc(e.sub)}" autocomplete="off" placeholder="Una línea que explique la fila">
    ${orderSelect}
    <div class="sgroup">
      <label class="srow" for="ed-show"><span class="gtxt"><span class="gname">Mostrar en el inicio</span><span class="gsub">${e.hidden ? 'Oculta: nadie la ve en la web' : 'Se ve si tiene juegos publicados'}</span></span>
        <input type="checkbox" role="switch" id="ed-show" class="switch" ${e.hidden ? '' : 'checked'}></label>
      ${order}
    </div>
    ${dirty ? '<div class="saverow"><span class="dirty-note">Cambios sin guardar</span><button type="button" class="obtn" data-act="v-save-sec">Guardar cambios</button></div>' : ''}
  </section>`;
  let games;
  if (s.kind === 'weight_band') games = `<section class="jsec"><div class="group-label" style="margin:0 0 4px">Juegos</div>
    <p class="lnote">Los juegos salen solos de su nivel: <b>${BANDS[s.band].label}</b> (${nf(s.n)} publicados). Para mover uno, cambiá su nivel en Juegos o en Revisar niveles.</p></section>`;
  else if (s.kind === 'recent') games = `<section class="jsec"><div class="group-label" style="margin:0 0 4px">Juegos</div>
    <p class="lnote">Muestra solos los <b>20 juegos agregados más recientemente</b>.</p></section>`;
  else {
    const ms = s.sort === 'name' ? [...s.members].map(gById).sort((a, b) => a.name.localeCompare(b.name, 'es')) : s.members.map(gById);
    const q = norm(V.memQ.trim());
    const results = q ? G.filter(g => !s.members.includes(g.id) && norm(g.name).includes(q)).slice(0, 6) : [];
    const resHtml = !q ? '' : results.length
      ? `<div class="glist" style="margin-top:4px" aria-label="Resultados">${results.map(g => tapRow({ key: 'r' + g.id, act: 'v-add-mem', attrs: `data-id="${g.id}" aria-label="Agregar ${esc(g.name)}"`, slot: thumbOf(g), name: esc(g.name), sub: meta(g.year, `${g.pl} jug.`), trail: ic('plusC', 'trail-ico') })).join('')}</div><div class="divider" style="margin:4px 0 8px"></div>`
      : `<p class="lnote" style="margin:8px 2px 12px">Sin resultados para “${esc(V.memQ)}”.</p>`;
    games = `<section class="jsec">${lhead(`Juegos · ${n}${s.featured ? ' de 20' : ''}`, 'members', s.sort === 'manual')}
      ${sfield('mem-q', 'Buscar un juego para agregar', V.memQ)}
      <p class="ferr" role="alert">${V.memErr || ''}</p>
      ${resHtml}
      ${s.sort !== 'manual' ? `<div class="jsum"><span>Ordenados ${SORTS[s.sort].toLowerCase()}. Para ordenarlos vos, elegí “A mano”.</span></div>` : ''}
      ${ms.length ? `<div class="glist ${V.ordering === 'members' ? 'ordering' : ''}">${ms.map((g, i) => memRow(s, g, i, ms.length)).join('')}</div>`
        : `<div class="empty">${ic('listq')}<h2>Todavía no tiene juegos</h2><p>Buscá un juego arriba para agregarlo. La fila aparece en el inicio cuando tenga uno publicado.</p></div>`}
    </section>`;
  }
  return head(s.name, { parent: 'secciones', sub: secMeta(s).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim() }) + settings + games;
}

/* ---- Estantes ---- */
const progHtml = () => `<div class="prog"><div class="prog-line"><span>${nf(placedN())} de ${nf(TOTAL)} juegos ubicados</span>
  ${unplacedN() ? `<span class="pend">${nf(unplacedN())} sin ubicar</span>` : '<span>Todos ubicados</span>'}</div>
  <span class="meter" aria-hidden="true"><i style="width:${placedN() / TOTAL * 100}%"></i></span></div>`;
function shelfRow(sh, i) {

function estBody() {
  const seg = `<div class="seg two" role="radiogroup" aria-label="Vista">${[['cards', 'Estantes'], ['lista', 'Juegos por estante']].map(([k, l]) =>
    `<button type="button" role="radio" aria-checked="${V.vista === k}" class="${V.vista === k ? 'on' : ''}" data-act="v-vista" data-v="${k}">${l}</button>`).join('')}</div>`;
  if (V.vista === 'cards') return `${head('Estantes')}${progHtml()}${seg}
    ${addForm({ id: 'shelf-new', label: 'Nuevo estante', ph: 'Nombre del estante', value: V.newShelf, err: V.newShelfErr, btn: 'Crear' })}
    <section class="jsec">${lhead('Orden de recorrido', 'estantes', true)}
      <div class="glist ${V.ordering === 'estantes' ? 'ordering' : ''}">${V.shelves.map(shelfRow).join('')}</div>
      <p class="lnote">Tocá un estante para ubicar juegos en él.</p></section>`;
  // ?vista=lista — pick/restore list, walking order, "Sin ubicar" last; the filter never hides a group's heading (E5)
  const q = norm(V.listaQ.trim());
  const groups = [...V.shelves.map(sh => ({ name: sh.name, games: localOn(sh.id), n: shelfCount(sh) })), { name: 'Sin ubicar', games: unplacedLocal(), n: unplacedN(), pend: true }];
  const grp = g => {
    const gs = q ? g.games.filter(x => norm(x.name).includes(q)) : g.games.slice(0, 4);
    const count = g.pend && g.n ? `<span class="pend">${nf(g.n)}</span>` : `<span class="gcount">${nf(g.n)}</span>`;
    return `<div class="grp"><div class="lhead"><span class="group-label">${esc(g.name)}</span>${count}</div>
      ${gs.length ? `<div class="glist">${gs.map(x => staticRow({ key: 'l' + x.id, slot: thumbOf(x), name: esc(x.name), sub: meta(x.year, `${x.pl} jug.`) })).join('')}</div>
      ${!q && g.n > gs.length ? `<p class="lcap">y ${nf(g.n - gs.length)} más</p>` : ''}` : `<p class="lnote">${q ? 'Ninguno con ese nombre.' : 'Sin juegos.'}</p>`}</div>`;
  };
  return `${head('Estantes')}${progHtml()}${seg}${sfield('lista-q', 'Buscar por nombre', V.listaQ)}<div style="height:16px"></div>${groups.map(grp).join('')}`;
}

/* ---- Estantes › Asignar (walk the shelf) ---- */
function asgBody() {
  const sh = shelfById(V.curShelf), q = norm(V.asgQ.trim());
  const title = V.variant === 'A' && V.renaming
    ? `<h1 class="sr">${esc(sh.name)}</h1><form id="ren-form" class="renform" novalidate><label class="flabel" for="ren-in">Nombre del estante</label>
        <div class="addrow"><input id="ren-in" class="tin ${V.renErr ? 'invalid' : ''}" value="${esc(V.ren)}" autocomplete="off" enterkeyhint="done">
        <button type="button" class="tbtn" data-act="v-cancel-rename">Cancelar</button><button type="submit" class="obtn">Guardar</button></div>
        <p class="ferr" role="alert">${V.renErr || ''}</p></form>`
    : `<div class="trow"><h1 class="ptitle">${esc(sh.name)}</h1><button type="button" class="tbtn" data-act="v-rename">Renombrar</button></div>`;
  let list;
  if (q) {
    const rs = G.filter(g => norm(g.name).includes(q));
    list = `<section class="jsec"><div class="lhead"><span class="group-label">Resultados</span><span class="gcount">${rs.length}</span></div>
      ${rs.length ? `<div class="glist">${rs.map(g => V.place[g.id] === sh.id
        ? staticRow({ key: 'a' + g.id, slot: thumbOf(g), name: esc(g.name), sub: meta('Ya está en este estante'), trail: ic('tick', 'trail-ico ok') })
        : tapRow({ key: 'a' + g.id, act: 'v-assign', attrs: `data-id="${g.id}" aria-label="Ubicar ${esc(g.name)} en ${esc(sh.name)}"`, slot: thumbOf(g), name: esc(g.name),
            sub: V.place[g.id] ? meta(`En ${esc(shelfById(V.place[g.id]).name)}`) : '<span class="dot draft"></span><span class="st-draft">Sin ubicar</span>', trail: ic('plusC', 'trail-ico') })).join('')}</div>`
        : `<div class="empty">${ic('search')}<h2>Sin resultados para “${esc(V.asgQ)}”</h2><button class="tbtn" data-act="v-clear" data-for="asg-q">Borrar búsqueda</button></div>`}</section>`;
  } else {
    const un = unplacedLocal();
    list = `<section class="jsec"><div class="lhead"><span class="group-label">Sin ubicar</span>${unplacedN() ? `<span class="pend">${nf(unplacedN())}</span>` : ''}</div>
      ${un.length ? `<div class="glist">${un.map(g => tapRow({ key: 'a' + g.id, act: 'v-assign', attrs: `data-id="${g.id}" aria-label="Ubicar ${esc(g.name)} en ${esc(sh.name)}"`, slot: thumbOf(g), name: esc(g.name), sub: meta(g.year, `${g.pl} jug.`), trail: ic('plusC', 'trail-ico') })).join('')}</div>
        ${V.hiddenUnplaced ? `<div class="more"><button class="tbtn" data-act="v-more">Mostrar más</button><span class="cap">${un.length} de ${nf(unplacedN())}</span></div>` : ''}`
        : `<div class="empty">${ic('check')}<h2>Todos los juegos tienen estante</h2><p>Si llega uno nuevo, aparece acá para ubicarlo.</p></div>`}</section>`;
  }
  const on = localOn(sh.id);
  const onShelf = `<section class="jsec"><div class="glist">
      <button type="button" class="grow disclose" data-act="v-toggle-on" aria-expanded="${V.onShelfOpen}">${slotIco('estantes')}${txt('En este estante', meta(`${nf(shelfCount(sh))} juegos`))}${ic('chevR', 'chev')}</button>
      ${V.onShelfOpen ? on.map(g => staticRow({ key: 'o' + g.id, slot: thumbOf(g), name: esc(g.name), sub: meta(g.year, `${g.pl} jug.`) })).join('') : ''}
    </div>${V.onShelfOpen && sh.base ? `<p class="lcap">y ${nf(sh.base)} más</p>` : ''}</section>`;
  return `${head(sh.name, { parent: 'estantes', extra: title })}${progHtml()}${sfield('asg-q', 'Buscar cualquier juego', V.asgQ)}<div style="height:8px"></div>${list}${onShelf}`;
}

/* ---- Revisar niveles ---- */

  const sub = `<span>${from}</span><span class="arrow">→</span><span class="st-draft">${to}</span><span>·</span><span>BGG ${w2(m.w)}</span>`;
  if (V.variant === 'B') return tapRow({ key: 'n' + g.id, act: 'v-niv-sheet', attrs: `data-id="${g.id}"`, slot: thumbOf(g), name: esc(g.name), sub });
  return `<div class="grow niv" data-key="n${g.id}">${thumbOf(g)}<span class="gtxt"><span class="gname">${esc(g.name)}</span><span class="gsub">${sub}</span>
    <span class="ractions"><button type="button" class="tbtn" data-act="v-keep" data-id="${g.id}" aria-label="Mantener ${esc(g.name)} en ${from}">Mantener</button>
    <button type="button" class="tbtn" data-act="v-correct" data-id="${g.id}" aria-label="Corregir ${esc(g.name)}: pasar a ${to}">Corregir</button></span></span></div>`;
}
const nivBody = () => `${head('Revisar niveles', { sub: 'Juegos cuyo nivel en el club no coincide con su peso en BGG.' })}
  ${V.mis.length ? `<div class="jsum" aria-live="polite"><span>${V.mis.length} por revisar</span></div><div class="glist">${V.mis.map(nivRow).join('')}</div>`
    : `<div class="empty">${ic('check')}<h2>Todo coincide con BGG</h2><p>Si el peso en BGG de un juego no coincide con su nivel, aparece acá.</p></div>`}`;

/* ---- Staff (owner only) ---- */
const staffSub = p => p.role === 'owner' ? '<span class="dot published"></span><span>Dueña · vos</span>'
  : p.st === 'active' ? `<span class="dot published"></span><span>Activo</span><span>·</span><span>${p.note}</span>`
  : `<span class="dot draft"></span><span class="st-draft">Invitación pendiente</span><span>·</span><span>${p.note}</span>`;
const staffSubText = p => p.st === 'active' ? `Activo · ${p.note}` : `Invitación pendiente · ${p.note}`;
function staffRow(p) {

  if (p.role === 'owner') return staticRow(base);
  if (V.variant === 'A') return staticRow({ ...base, trail: `<button type="button" class="tbtn danger" data-act="v-ask-remove" data-email="${esc(p.email)}" aria-label="Quitar a ${esc(p.email)}">Quitar</button>` });

function staffBody() {
  const others = V.staff.filter(p => p.role !== 'owner').length, full = others >= 3;
  return `${head('Staff')}
    ${addForm({ id: 'inv-in', label: 'Invitar a staff', ph: 'nombre@gmail.com', type: 'email', value: V.inv, err: V.invErr, btn: 'Invitar', busy: V.inviting, disabled: full,
      help: full ? 'Ya hay 3 personas en el staff. Quitá a alguien para invitar a otra.' : `Le llega un link por mail para entrar. Quedan ${3 - others} de 3 lugares.` })}
    <section class="jsec"><div class="lhead"><span class="group-label">Equipo</span><span class="gcount">${V.staff.length}</span></div>
      <div class="glist">${V.staff.map(staffRow).join('')}</div>
      ${others ? '' : '<p class="lnote">Todavía no invitaste a nadie más.</p>'}</section>`;
}

function move(scope, id, dir) {
  const arr = scope === 'secciones' ? V.sections : scope === 'estantes' ? V.shelves : curSec().members;
  const key = { secciones: 's', estantes: 'e', members: 'm' }[scope];
  const idx = scope === 'members' ? arr.indexOf(id) : arr.findIndex(x => x.id === id), j = idx + dir;
  if (j < 0 || j >= arr.length || (scope === 'secciones' && arr[j].featured)) return;
  [arr[idx], arr[j]] = [arr[j], arr[idx]];
  patch(); flashKey(key + id);
  const sel = d => $(`[data-act="v-move"][data-scope="${scope}"][data-id="${id}"][data-dir="${d}"]`);
  const b = sel(dir) && !sel(dir).disabled ? sel(dir) : sel(-dir);
  if (b) { b.focus({ preventScroll: true }); b.scrollIntoView({ block: 'nearest' }); }
}
function assign(id) {
  const sid = V.curShelf, prev = V.place[id] ?? null, g = gById(id), sh = shelfById(sid);
  if (prev === sid) return;
  const inSearch = !!V.asgQ.trim();
  const commit = () => {
    if (V.failNext) { V.failNext = false; V.undo = null; patch(); return snack('No se pudo guardar', { label: 'Reintentar', act: 'v-assign', id }); }
    V.place[id] = sid; patch(); if (inSearch) flashKey('a' + id);
    V.undo = () => { V.place[id] = prev; patch(); flashKey('a' + id); };
    snack(prev == null ? `Ubicaste ${g.name}` : `Movido desde ${shelfById(prev).name}`, { label: 'Deshacer', act: 'v-undo' });
  };
  inSearch ? commit() : leave('a' + id, commit);
}
function decide(id, correct) {
  const idx = V.mis.findIndex(m => m.g === id), m = V.mis[idx]; if (!m) return;
  closeAll();
  leave('n' + id, () => {
    V.mis.splice(idx, 1); patch();
    V.undo = () => { V.mis.splice(idx, 0, m); patch(); flashKey('n' + id); };
    snack(correct ? `Pasó a ${BANDS[implied(m.w)].label}` : `Se mantiene en ${BANDS[m.band].label}`, { label: 'Deshacer', act: 'v-undo' });
  });
}
const confirmRemove = (p, back) => `<div class="group-label">Quitar del staff</div>
  <p class="sheet-text"><b>${esc(p.email)}</b> va a perder acceso a Admin de inmediato.${p.st === 'pending' ? ' El link de la invitación deja de funcionar.' : ''}</p>
  <div class="dlinks">${row({ act: 'v-remove', extra: `data-email="${esc(p.email)}"`, icon: 'userMinus', label: 'Sí, quitar', tone: 'danger', chev: false })}
  ${row({ act: back ? 'v-step-back' : 'v-close', extra: 'data-autofocus', icon: 'chevL', label: 'Cancelar', chev: false })}</div>`;
function removeStaff(t) {
  const email = t.dataset.email;
  t.disabled = true; t.querySelector('.slot').innerHTML = '<span class="spin"></span>'; t.querySelector('.lbl').textContent = 'Quitando…';
  t.closest('.dlinks').querySelectorAll('.dlink').forEach(b => { if (b !== t) b.disabled = true; });
  setTimeout(() => { closeAll(); setTimeout(() => leave('p-' + email, () => { V.staff = V.staff.filter(p => p.email !== email); patch(); snack(`Quitaste a ${email} del staff`); }), 200); }, 550);
}
function submitRename() {
  const sh = shelfById(V.curShelf), inp = document.getElementById('ren-in'), name = (inp ? inp.value : V.ren).trim();
  const err = !name ? 'Poné un nombre.' : V.shelves.some(x => x !== sh && norm(x.name) === norm(name)) ? 'Ya hay un estante con ese nombre.' : null;
  if (err) {
    V.renErr = err;
    if (V.variant === 'A') { patch(); $('#ren-in').focus(); }
    else { const e = $('#sheet-act .ferr'); e.textContent = err; inp.classList.add('invalid'); inp.focus(); }
    return;
  }
  sh.name = name; V.renaming = false; V.renErr = null; closeAll(); patch(); snack('Estante renombrado');
}

function vAct(t) {
  const a = t.dataset.act, id = +t.dataset.id;
  switch (a) {
    case 'v-open-sec': V.cur = id; V.ed = null; V.memQ = ''; V.memErr = null; V.ordering = null; S.screen = 'seccion'; return softSwap();
    case 'v-open-shelf': V.curShelf = id; V.asgQ = ''; V.onShelfOpen = false; V.renaming = false; V.ordering = null; S.screen = 'asignar'; return softSwap();
    case 'v-order': V.ordering = V.ordering === t.dataset.scope ? null : t.dataset.scope; patch(); return $(`[data-act="v-order"][data-scope="${t.dataset.scope}"]`)?.focus({ preventScroll: true });
    case 'v-move': return move(t.dataset.scope, id, +t.dataset.dir);
    case 'v-clear': { V[QMAP[t.dataset.for]] = ''; patch(); return document.getElementById(t.dataset.for)?.focus(); }
    case 'v-vista': V.vista = t.dataset.v; V.ordering = null; return patch();
    case 'v-sort-sheet': return openAct(`<div class="step step-account"><div class="group-label">Orden</div><div class="dlinks">${sortKeys(curSec()).map(k =>
      row({ act: 'v-pick-sort', extra: `data-v="${k}" aria-pressed="${V.ed.sort === k}"`, icon: V.ed.sort === k ? 'tick' : 'blank', label: SORTS[k], chev: false })).join('')}</div></div>`, t);

/* Header, tabs and drawer persist; only the page content swaps (LiveView navigate in one live_session). */
function softSwap() {
  const main = $('#main');
  if (!main || S.mode !== 'admin') return render();
  main.classList.add('swapping');
  setTimeout(() => {
    const top = activeTop();
    main.className = (S.screen === 'editar' ? 'wide' : '');
    main.innerHTML = adminBody();
    device.querySelectorAll('.tabs [data-tab]').forEach(b => {
      if (b.dataset.tab === 'account') return;
      const on = b.dataset.tab === top; b.classList.toggle('on', on); on ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current');
    });
    device.querySelectorAll('.drawer .dlink[data-nav]').forEach(b => {
      const on = b.dataset.nav === top; b.classList.toggle('on', on); on ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current');
    });
    $('.scroller').scrollTop = 0;
    syncBadges();
    main.classList.remove('swapping');
    /* A new page starts at its own title, not wherever the last page's focus was. Never a field:
       the editor's title IS an <input>, so focusing "the heading" there popped the phone keyboard
       just for arriving on the page. Landing focus goes on the page's heading text, silently. */
    const h = main.querySelector('h1.ptitle, h1, .thead');
    if (h && !isField(h)) { h.setAttribute('tabindex', '-1'); h.style.outline = 'none'; h.focus({ preventScroll: true }); }
    renderWalk();

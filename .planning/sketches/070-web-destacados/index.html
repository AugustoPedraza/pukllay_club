<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sketch 070 — Web: Destacados</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
  /* Sketch 070 — the admin Web tab, restarted from the job (notes/web-ui-redesign.md, decisions 1–6).
     Standalone: only the Web UI. Components are copied from 069 (header icons, rail, slots, sheets, dialog, snackbar,
     name sheet, Ordenar mode), not redrawn. */
  :root { --stroke: color-mix(in srgb, var(--color-text) 58%, var(--color-bg)); --ter: var(--color-secondary); }
  :root[data-theme="dark"] { --stroke: color-mix(in srgb, var(--color-text) 42%, var(--color-bg)); --ter: var(--color-text-muted); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --stroke: color-mix(in srgb, var(--color-text) 42%, var(--color-bg)); --ter: var(--color-text-muted); } }
  * { box-sizing: border-box; }
  body { margin: 0; background: #d9d4e0; font-family: var(--font-sans); color: var(--color-text); -webkit-font-smoothing: antialiased; }
  :root[data-theme="dark"] body { background: #120a1c; }
  button, input { font: inherit; color: inherit; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg { display: block; }

  .stage { min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 24px 16px 64px; }
  .device { position: relative; width: 375px; height: 740px; background: var(--color-bg); border-radius: 28px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(30, 10, 50, .25); display: flex; flex-direction: column; }
  @media (max-width: 430px) { .stage { padding: 0; } .device { width: 100%; height: 100vh; border-radius: 0; } }

  /* chrome — context only */
  .hdr { height: 53px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 4px; border-bottom: 1px solid var(--color-border); }
  .hdr .burger { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; }
  .hdr img { height: 26px; }
  .hdr .img-dark { display: none; }
  :root[data-theme="dark"] .hdr .img-light { display: none; } :root[data-theme="dark"] .hdr .img-dark { display: block; }
  .hdr .word { font-family: var(--font-display); font-size: 1.05rem; letter-spacing: .03em; }
  .scroller { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; display: flex; flex-direction: column; }
  .tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 67px; display: grid; grid-template-columns: repeat(5, 1fr); padding: 4px 4px 8px;
    background: var(--color-bg); border-top: 1px solid var(--color-border); z-index: 20; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--color-text-muted); }
  .tab .ti { width: 56px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
  .tab .ti svg { width: 20px; height: 20px; }
  .tab.on { color: var(--color-accent-text); } .tab.on .ti { background: var(--color-accent-bg); }
  :root[data-theme="dark"] .tab.on .ti { background: color-mix(in srgb, var(--color-accent-text) 22%, transparent); }
  .tab .av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; box-shadow: inset 0 0 0 1.5px var(--color-success); }

  main { padding: 16px 16px 79px; flex: 1 0 auto; display: flex; flex-direction: column; }
  .phead { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
  .ptitle { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 600; letter-spacing: -.01em; }
  .back { display: inline-flex; align-items: center; gap: 2px; height: 44px; margin-left: -10px; padding: 0 10px 0 4px; border: 0; background: none; font-size: 14px; font-weight: 600; color: var(--color-text-muted); cursor: pointer; align-self: flex-start; }
  .back svg { width: 18px; height: 18px; }
  .tbtn { height: 44px; padding: 0 12px; border: 0; background: none; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--ter); cursor: pointer; white-space: nowrap; }
  .tbtn.pull-r { margin-right: -12px; }
  .tbtn:hover { background: color-mix(in srgb, var(--ter) 8%, transparent); }
  .tbtn:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }
  .ibtn { width: 44px; height: 44px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; color: var(--color-text-muted); cursor: pointer; flex-shrink: 0; }
  .ibtn svg { width: 20px; height: 20px; }
  .ibtn:hover { background: var(--color-surface); color: var(--color-text); }
  .ibtn:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }
  .hacts { display: flex; align-items: center; margin-right: -12px; }
  .obtn { height: 44px; padding: 0 16px; border: 1px solid var(--stroke); background: var(--color-bg); border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .obtn.pri { border-color: var(--color-primary); color: var(--color-accent-text); }
  :root[data-theme="dark"] .obtn.pri { border-color: var(--color-accent-text); }
  .obtn.wide { width: 100%; }

  /* ---- decision 4: the row name under the title, prompt rank (17/600) + pencil ---- */
  /* the pencil's 44px box is taller than the 22px text line; the row is pulled up so the TEXT sits 16px under the title row */
  .fname { display: flex; align-items: center; gap: 0; min-height: 44px; margin-top: -3px; }
  .fname h2 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.3; min-width: 0; overflow-wrap: anywhere; }
  .fname .ibtn { margin-left: 2px; }
  .fctx { margin: -6px 0 0; font-size: 14px; line-height: 1.35; color: var(--color-text-muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: #D9892B; }

  /* ---- decisions 3 + 5: the rail, a "+" in every gap ---- */
  .shelf { position: relative; margin: 0 -16px; }
  .rail { display: flex; overflow-x: auto; scroll-snap-type: x proximity; padding: 16px 16px 8px; scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .shelf::before, .shelf::after { content: ""; position: absolute; top: 0; bottom: 0; width: 16px; z-index: 3; pointer-events: none; }
  .shelf::before { left: 0; background: linear-gradient(90deg, var(--color-bg), transparent); }
  .shelf::after { right: 0; background: linear-gradient(270deg, var(--color-bg), transparent); }
  .box { flex: 0 0 96px; width: 96px; display: flex; flex-direction: column; gap: 6px; border: 0; background: none; padding: 0; text-align: left; cursor: pointer;
    scroll-snap-align: center; position: relative; z-index: 1; }
  .box .bc { width: 96px; height: 100px; border-radius: 6px; object-fit: cover; background: var(--color-surface); display: grid; place-items: center; font-size: 28px; font-weight: 600;
    transition: transform var(--duration-base) var(--ease-out-soft), box-shadow var(--duration-base) var(--ease-out-soft); }
  .bc.l, .cov.l { background: hsl(var(--h) 45% 84%); color: hsl(var(--h) 40% 28%); }
  :root[data-theme="dark"] .bc.l, :root[data-theme="dark"] .cov.l { background: hsl(var(--h) 30% 30%); color: hsl(var(--h) 50% 88%); }
  .box .cap { font-size: 12px; line-height: 1.3; color: var(--color-text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 31px; }
  .box:hover .bc { box-shadow: 0 0 0 2px var(--color-surface-2); }
  .box:focus-visible { outline: none; } .box:focus-visible .bc { outline: 2px solid var(--color-primary); outline-offset: 3px; }
  .box.sel .bc { transform: translateY(-12px); box-shadow: 0 14px 22px -6px rgba(36, 18, 56, .45); }
  /* slot: a visible 24px "+" in a 20px column with 12px air each side → 44px between covers = the hit box */
  .slot { position: relative; flex: 0 0 20px; margin: 0 12px; align-self: stretch; border: 0; background: none; padding: 0; cursor: pointer; display: flex; justify-content: center; align-items: flex-start; min-width: 0; z-index: 2; }
  .slot::before { content: ""; position: absolute; top: 0; bottom: 0; left: -12px; right: -12px; }
  .slot:first-child { margin-left: 0; } .slot:last-child { margin-right: 0; }
  .slot:first-child::before { left: -16px; } .slot:last-child::before { right: -16px; }
  .slot .pl { flex-shrink: 0; width: 24px; height: 24px; margin-top: 38px; border-radius: 50%; border: 1px dashed var(--stroke); background: var(--color-bg); color: var(--color-text-muted); display: grid; place-items: center; }
  .slot .pl svg { width: 14px; height: 14px; }
  .slot:hover .pl, .slot:focus-visible .pl { border: 1px solid var(--color-primary); color: var(--color-accent-text); background: var(--color-surface); }
  .slot:focus-visible { outline: none; }
  .slot.full .pl { opacity: .45; }
  /* empty row: one "+" and a line */
  .rail.empty { align-items: center; gap: 12px; padding-bottom: 16px; }
  .rail.empty .slot { flex: 0 0 96px; height: 100px; margin: 0; border: 1px dashed var(--stroke); border-radius: 6px; align-items: center; }
  .rail.empty .slot .pl { margin: 0; border: 0; }
  .rail.empty .slot::before { display: none; }
  .emptyline { font-size: 14px; color: var(--color-text-muted); line-height: 1.4; }
  /* a moved or added cover settles into its spot */
  @keyframes land { 0% { transform: translateY(-40px) scale(.92); opacity: 0; } 60% { transform: translateY(4px) scale(1.02); opacity: 1; } 100% { transform: none; } }
  .box.landed .bc { animation: land 520ms cubic-bezier(.2, .8, .3, 1) both; }
  @media (prefers-reduced-motion: reduce) { .box.landed .bc { animation: none; } }

  /* ---- Filas del inicio (decision 6) ---- */
  .mhead { margin-bottom: 8px; }
  /* decision 7 — the highlighted row in its own group (069 Pendientes group anatomy: 15/600 heading + count, one hint line) */
  .lhead { margin: 8px 0 4px; font-size: 15px; font-weight: 600; line-height: 1.3; }
  .lhead .cnt { font-weight: 400; margin-left: 4px; color: var(--color-text-muted); }
  /* round 3 — measured on what you see: a row's tile ends 12px above its box, so 20px of margin reads as 32 (was 44) */
  .fgroup + .fgroup { margin-top: 12px; }
  .fgroup .hint { margin: 0 0 4px; }
  .hint { margin: 0 0 8px; font-size: 13px; color: var(--color-text-muted); line-height: 1.4; }
  .rows { margin: 0 -16px; }
  .row { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 16px; border: 0; background: none; text-align: left; cursor: pointer; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 68px; right: 0; height: 1px; background: var(--color-border); }
  .row:hover { background: var(--color-surface); }
  .txt { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .row .name { font-size: 15px; line-height: 1.3; }
  .sub { font-size: 13px; line-height: 1.35; color: var(--color-text-muted); display: flex; align-items: center; gap: 6px; }
  .tile { width: 40px; height: 40px; border-radius: 8px; background: var(--color-surface); display: grid; place-items: center; flex-shrink: 0; color: var(--color-accent-text); }
  .tile svg { width: 22px; height: 22px; }
  .row.hid .name { color: var(--color-text-muted); }
  .row.ord { cursor: default; } .row.ord:hover { background: none; }
  .handle { width: 44px; height: 44px; margin-right: -12px; flex-shrink: 0; border: 0; background: none; border-radius: 8px; display: grid; place-items: center; color: var(--color-text-muted); touch-action: none; cursor: grab; }
  .handle svg { width: 22px; height: 22px; }
  .handle[aria-pressed="true"] { background: var(--color-surface); color: var(--color-accent-text); }
  .handle:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }
  .arrows { display: flex; flex-shrink: 0; }
  .arrows .ibtn:disabled { opacity: .35; cursor: default; background: none; }
  .row.dragging { z-index: 5; background: var(--color-bg); box-shadow: var(--shadow-lg); border-radius: 8px; cursor: grabbing; }
  .row.dragging::before, .row.dragging + .row::before { display: none; }
  .rows.sorting .row:not(.dragging) { transition: transform 150ms var(--ease-out-soft); }
  .lock { width: 44px; height: 44px; margin-right: -12px; display: grid; place-items: center; color: var(--color-text-muted); opacity: .6; }
  .lock svg { width: 18px; height: 18px; }

  /* ---- sheets (D-19e) ---- */
  .backdrop { position: absolute; inset: 0; background: color-mix(in srgb, #231339 38%, transparent); opacity: 0; pointer-events: none; transition: opacity var(--duration-base); z-index: 40; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--color-bg); border-radius: 18px 18px 0 0; z-index: 41;
    transform: translateY(105%); transition: transform 260ms var(--ease-out-soft); box-shadow: var(--shadow-lg); max-height: 85%; overflow-y: auto;
    padding: 0 0 calc(16px + env(safe-area-inset-bottom, 0px)); scrollbar-width: none; }
  .sheet::-webkit-scrollbar { display: none; }
  .sheet.open { transform: none; }
  .sheet:focus { outline: none; }
  .sheet.full { top: 24px; max-height: none; }
  .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--color-surface-2); margin: 0 auto 8px; }
  .sh-top { position: sticky; top: 0; z-index: 4; background: var(--color-bg); padding-top: 8px; margin-bottom: 8px; }
  .sheet.full .sh-top { margin-bottom: 0; }
  .sh-head { display: flex; gap: 16px; align-items: center; padding: 8px 16px 16px; border-bottom: 1px solid var(--color-border); }
  .sh-head .cov { width: 56px; height: 60px; border-radius: 6px; object-fit: cover; display: grid; place-items: center; font-weight: 600; font-size: 20px; flex-shrink: 0; }
  .sh-head .tile { width: 56px; height: 60px; border-radius: 6px; }
  .sh-head .tile svg { width: 28px; height: 28px; }
  .sh-txt { flex: 1; min-width: 0; }
  .sh-title { font-size: 18px; font-weight: 600; line-height: 1.3; }
  .ctx { margin: 0 0 4px; font-size: 13px; line-height: 1.3; color: var(--color-text-muted); }
  .sh-x { width: 44px; height: 44px; margin: -6px -10px 0 0; align-self: flex-start; flex-shrink: 0; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; color: var(--color-text-muted); cursor: pointer; }
  .sh-x svg { width: 22px; height: 22px; }
  .sh-x:hover { background: var(--color-surface); }
  .sh-x:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }
  .dlink { width: 100%; display: flex; align-items: center; gap: 16px; min-height: 48px; padding: 0 16px; border: 0; background: none; font-size: 16px; text-align: left; cursor: pointer; }
  .dlink:hover { background: var(--color-surface); }
  .dlink svg { width: 22px; height: 22px; color: var(--color-text-muted); flex-shrink: 0; }
  .dlink.danger, .dlink.danger svg { color: var(--color-danger); }
  .dlink .dsub { display: block; font-size: 13px; color: var(--color-text-muted); }
  .dlink:has(.dsub) { min-height: 64px; padding-block: 8px; }
  .dlink:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }
  /* search inside the add sheet */
  .psearch { padding: 12px 16px 8px; }
  .sfield { position: relative; }
  .sfield input { width: 100%; height: 48px; padding: 0 48px 0 14px; border: 1px solid var(--stroke); border-radius: 8px; background: var(--color-bg); font-size: 16px; outline: none; }
  .sfield input::placeholder { color: var(--color-text-muted); }
  .sfield input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 1px var(--color-primary); }
  :root[data-theme="dark"] .sfield input:focus { border-color: var(--color-accent-text); box-shadow: 0 0 0 1px var(--color-accent-text); }
  .sfield input::-webkit-search-cancel-button { display: none; }
  .sfield .sico { position: absolute; right: 2px; top: 2px; width: 44px; height: 44px; display: grid; place-items: center; color: var(--color-text-muted); }
  .sfield .sico svg { width: 20px; height: 20px; }
  .pbody { padding: 0 16px 8px; }
  .pres { margin: 0 -16px; }
  .glabel { font-size: 13px; color: var(--color-text-muted); min-height: 28px; display: flex; align-items: center; margin-top: 4px; }
  .srow { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 16px; border: 0; background: none; text-align: left; cursor: pointer; }
  .srow:hover { background: var(--color-surface); }
  .srow .ttl { font-size: 15px; line-height: 1.3; }
  .srow .ttl mark { background: none; color: inherit; font-weight: 600; }
  .srow .cov { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: var(--color-surface); display: grid; place-items: center; font-weight: 600; flex-shrink: 0; }
  .srow.create .cov { color: var(--color-accent-text); } .srow.create .cov svg { width: 22px; height: 22px; }
  .srow.create .ttl { color: var(--color-accent-text); font-weight: 600; }
  .snone { padding: 14px 16px; font-size: 14px; color: var(--color-text-muted); }
  .mshelf { margin-top: 16px; }
  /* form sheet (restart 67) */
  .fbody { padding: 8px 16px 16px; }
  .flab { display: block; margin: 0 0 6px; font-size: 13px; font-weight: 600; }
  .tfield { width: 100%; height: 48px; padding: 0 14px; border: 1px solid var(--stroke); border-radius: 8px; background: var(--color-bg); font-size: 16px; outline: none; }
  .tfield:focus { border-color: var(--color-primary); box-shadow: 0 0 0 1px var(--color-primary); }
  .tfield[aria-invalid="true"] { border-color: var(--color-danger); box-shadow: 0 0 0 1px var(--color-danger); }
  .fbody .hint { margin: 6px 0 0; }
  .ferr { margin: 6px 0 0; font-size: 13px; color: var(--color-danger); }
  .ferr[hidden] { display: none; }
  .fbody .obtn.wide { margin-top: 16px; }
  .device.kbd2 .kbd-sim { display: grid; grid-template-rows: repeat(4, 1fr); gap: 10px; z-index: 45; }
  .device.kbd2 .sheet.full, .device.kbd2 .sheet.form { bottom: 292px; padding-bottom: 0; }

  /* ---- dialog (D-19f) ---- */
  .dscrim { position: absolute; inset: 0; z-index: 60; background: color-mix(in srgb, #231339 38%, transparent); display: grid; place-items: center; padding: 24px; opacity: 0; pointer-events: none; transition: opacity var(--duration-base); }
  .dscrim.open { opacity: 1; pointer-events: auto; }
  .dialog { width: 100%; max-width: 312px; background: var(--color-bg); border-radius: 16px; padding: 24px 24px 12px; box-shadow: var(--shadow-lg); transform: scale(.96); transition: transform var(--duration-base) var(--ease-out-soft); }
  .dscrim.open .dialog { transform: none; }
  .dialog h2 { margin: 0 0 8px; font-size: 18px; font-weight: 600; line-height: 1.3; }
  .dialog p { margin: 0 0 16px; font-size: 14px; line-height: 1.45; color: var(--color-text-muted); }
  .dacts { display: flex; justify-content: flex-end; gap: 8px; margin-right: -12px; }
  .tbtn.dan { color: var(--color-danger); }

  /* ---- snackbar (D-19b/c) ---- */
  .snack { position: absolute; left: 12px; right: 12px; bottom: 79px; z-index: 30; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 4px 4px 4px 16px;
    background: var(--color-text); color: var(--color-bg); border-radius: 8px; font-size: 14px; opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity var(--duration-base), transform var(--duration-base) var(--ease-out-soft); }
  .snack.show { opacity: 1; transform: none; pointer-events: auto; }
  .snack span { flex: 1; padding: 8px 0; }
  .snack .tbtn { color: var(--color-accent-bg); }
  .snack .x { width: 44px; height: 44px; border: 0; background: none; color: var(--color-bg); display: grid; place-items: center; cursor: pointer; }
  .snack .x svg { width: 18px; height: 18px; }
  .snack [hidden] { display: none; }

  .kbd-sim { position: absolute; left: 0; right: 0; bottom: 0; height: 292px; z-index: 25; background: #d2d4da; display: none; padding: 10px 4px; }
  :root[data-theme="dark"] .kbd-sim { background: #2b2b30; }
  .kbd-sim .krow { display: flex; gap: 5px; justify-content: center; }
  .kbd-sim .k { flex: 0 0 31px; border-radius: 5px; background: #fff; box-shadow: 0 1px 0 rgba(0,0,0,.3); display: grid; place-items: center; font: 17px system-ui; color: #111; }
  :root[data-theme="dark"] .kbd-sim .k { background: #6b6b70; color: #fff; }
  .kbd-sim .k.wide { flex-basis: 180px; font-size: 12px; }

  #tools { position: fixed; right: 12px; top: 12px; z-index: 99; font: 12px system-ui; background: rgba(0,0,0,.72); color: #fff; padding: 6px 10px; border-radius: 8px; }
  #tools > div + div { margin-top: 4px; }
  #tools button.on { background: #fff; color: #000; }
  #tools button { font: inherit; color: #fff; background: none; border: 1px solid rgba(255,255,255,.3); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
</style>
</head>
<body>
<div class="stage"><div class="device" id="device">
  <header class="hdr">
    <button class="burger" aria-label="Abrir menú"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <img class="img-light" src="../../../priv/static/images/isologo-light.png" alt=""><img class="img-dark" src="../../../priv/static/images/isologo-dark.png" alt="">
    <span class="word">PUKLLAY CLUB</span>
  </header>
  <div class="scroller" id="scroller"><main id="main"></main></div>
  <nav class="tabs" aria-label="Secciones de Admin">
    <span class="tab"><span class="ti" id="t-admin"></span>Admin</span><span class="tab"><span class="ti" id="t-juegos"></span>Juegos</span>
    <span class="tab on" aria-current="page"><span class="ti" id="t-web"></span>Web</span><span class="tab"><span class="ti" id="t-est"></span>Estantes</span>

function markMatch(name, q) { const n = norm(q.trim()), i = norm(name).indexOf(n); if (i < 0 || !n) return esc(name); return esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + n.length)) + '</mark>' + esc(name.slice(i + n.length)); }

/* ---------- Filas del inicio (decision 6) ---------- */

function ordMove(rid, to) { const from = ROWS.findIndex(r => r.id === rid); if (to < 1 || to >= ROWS.length || to === from) return false; const [r] = ROWS.splice(from, 1); ROWS.splice(to, 0, r); return true; }

  DRAG = { row, rid: +row.dataset.rid, grab: e.clientY - r.top, y0: e.clientY, moved: false }; e.preventDefault(); });
document.addEventListener('pointermove', e => {
  if (!DRAG) return; if (!DRAG.moved && Math.abs(e.clientY - DRAG.y0) < 5) return;
  const { row } = DRAG; if (!DRAG.moved) { DRAG.moved = true; row.classList.add('dragging'); row.parentElement.classList.add('sorting'); }
  row.style.transform = 'none'; let top = row.getBoundingClientRect().top;
  const want = e.clientY - DRAG.grab, mid = want + row.offsetHeight / 2, prev = row.previousElementSibling, next = row.nextElementSibling;
  if (prev && prev.querySelector('.handle') && mid < prev.getBoundingClientRect().top + prev.offsetHeight / 2) { row.parentElement.insertBefore(row, prev); top = row.getBoundingClientRect().top; }
  else if (next && mid > next.getBoundingClientRect().top + next.offsetHeight / 2) { row.parentElement.insertBefore(next, row); top = row.getBoundingClientRect().top; }
  row.style.transform = `translateY(${want - top}px)`;
});
document.addEventListener('pointerup', () => { if (!DRAG) return; const d = DRAG; DRAG = null; if (!d.moved) return;
  const order = [...document.querySelectorAll('#ordrows .row')].map(r => +r.dataset.rid); ROWS.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  ORD.arrows = null; ORD.justDragged = true; setTimeout(() => { if (ORD) ORD.justDragged = false; }, 60); renderOrder(); });

/* ---------- sheet / dialog / snackbar ---------- */
let opener = null;
function openSheet(head, body, from, opt = {}) {
  opener = from; const sh = $('#sheet'); sh.classList.toggle('full', !!opt.full); sh.classList.remove('form');
  sh.innerHTML = `<div class="sh-top"><div class="grab"></div><div class="sh-head">${head}<button class="sh-x" data-act="close" aria-label="Cerrar">${ic('x')}</button></div>${opt.top || ''}</div>${body}`;
  $('#backdrop').classList.add('open'); requestAnimationFrame(() => sh.classList.add('open'));
  sh.setAttribute('tabindex', '-1'); setTimeout(() => (opt.focus ? $(opt.focus) : sh)?.focus({ preventScroll: true }), 60);
}
function closeSheet() { ADD = null; MOVE = null; device.classList.remove('kbd2'); $('#sheet').classList.remove('open'); $('#backdrop').classList.remove('open'); opener && opener.isConnected && opener.focus?.({ preventScroll: true }); }
const DLG = { run: null };
function openDialog({ title, text, yes, run }) { DLG.run = run; $('#dlg-t').textContent = title; $('#dlg-d').textContent = text; $('[data-act="dlg-yes"]').textContent = yes; $('#dscrim').classList.add('open'); setTimeout(() => $('[data-act="dlg-no"]').focus(), 60); }
function closeDialog() { $('#dscrim').classList.remove('open'); DLG.run = null; }
function snack(msg, action) {
  const s = $('#snack'), b = s.querySelector('.tbtn'), x = s.querySelector('.x');
  s.querySelector('span').textContent = msg; b.hidden = !action; x.hidden = !action;
  const hide = () => s.classList.remove('show');
  if (action) { b.textContent = action.label; b.onclick = () => { action.run(); hide(); }; x.innerHTML = ic('x'); }
  x.onclick = hide; clearTimeout(s._t); s.classList.remove('show'); void s.offsetWidth; s.classList.add('show');
  s._t = setTimeout(hide, action ? 10000 : 4000);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const th = e.target.closest('[data-theme-set]'); if (th) { document.documentElement.dataset.theme = th.dataset.themeSet; return; }
  if (e.target.id === 'backdrop') return closeSheet();
  if (e.target.id === 'dscrim') return closeDialog();
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, id = +t.dataset.id, rid = +t.dataset.rid;
  if (act === 'close') return closeSheet();
  if (act === 'add') return addSheet(+t.dataset.pos, t);
  if (act === 'addpick') return putAt(id, ADD.pos);
  if (act === 'box') return boxSheet(byId(id), t);
  if (act === 'mover') { const g = byId(id); closeSheet(); return setTimeout(() => moveSheet(g, document.querySelector(`#rail [data-id="${id}"]`)), 280); }
  if (act === 'moveto') { const gid = MOVE.gid, rest = FEAT.ids.filter(x => x !== gid), p = +t.dataset.pos;
    const target = p === rest.length ? FEAT.ids.length : FEAT.ids.indexOf(rest[p]); return putAt(gid, target); }
  if (act === 'quitar') { const g = byId(id); closeSheet();
    return openDialog({ title: `¿Quitar ${g.name} de la fila?`, text: 'Deja de verse en el inicio.', yes: 'Quitar', run: () => {
      const before = FEAT.ids.slice(); FEAT.ids = FEAT.ids.filter(x => x !== id); render();
      snack('Juego quitado', { label: 'Deshacer', run: () => { FEAT.ids = before; render(); } }); } }); }
  if (act === 'dlg-no') return closeDialog();
  if (act === 'dlg-yes') { const run = DLG.run; closeDialog(); return run(); }
  if (act === 'rename') return nameSheet(FEAT, t);
  if (act === 'namesave') return nameSave();
  if (act === 'filas') { S.screen = 'filas'; render(); return $('#scroller').scrollTo({ top: 0 }); }
  if (act === 'back') { closeSheet(); ORD = null; S.screen = 'web'; render(); return $('#scroller').scrollTo({ top: 0 }); }
  if (act === 'rowsheet') return rowSheet(ROWS.find(r => r.id === rid), t);
  if (act === 'newrow') return nameSheet(null, t, true);
  if (act === 'editrow') { const r = ROWS.find(x => x.id === rid); closeSheet(); return setTimeout(() => nameSheet(r, document.querySelector(`[data-act="rowsheet"][data-rid="${rid}"]`)), 280); }
  if (act === 'destacar') return destacar(ROWS.find(x => x.id === rid));
  if (act === 'togglehide') { const r = ROWS.find(x => x.id === rid); r.hidden = !r.hidden; closeSheet(); render();
    return snack(r.hidden ? 'Fila oculta' : 'Fila visible', { label: 'Deshacer', run: () => { r.hidden = !r.hidden; render(); } }); }
  if (act === 'ordon') { ORD = { before: ROWS.map(r => r.id), arrows: null }; return render(); }
  if (act === 'handle') { if (ORD.justDragged) return; ORD.arrows = ORD.arrows === rid ? null : rid; return renderOrder(`.handle[data-rid="${rid}"]`); }
  if (act === 'ordup' || act === 'orddown') { const i = ROWS.findIndex(r => r.id === rid); if (ordMove(rid, i + (act === 'ordup' ? -1 : 1))) { renderOrder(`[data-act="${act}"][data-rid="${rid}"]:not(:disabled), .handle[data-rid="${rid}"]`); $('#ordlive').textContent = `${ROWS[i + (act === 'ordup' ? -1 : 1)].name}, posición ${i + (act === 'ordup' ? 0 : 2)} de ${ROWS.length}`; } return; }
  if (act === 'ordoff') { const before = ORD.before, changed = before.join() !== ROWS.map(r => r.id).join(); ORD = null; render();
    if (changed) snack('Orden guardado', { label: 'Deshacer', run: () => { ROWS.sort((a, b) => before.indexOf(a.id) - before.indexOf(b.id)); if (!ORD) render(); } }); return; }
  if (act === 'soon') { closeSheet(); return snack(`${t.dataset.what}: se diseña en otra ronda`); }
});
document.addEventListener('input', e => { if (e.target.id === 'aq') renderABody(); if (e.target.id === 'rn') { $('#rnerr').hidden = true; e.target.removeAttribute('aria-invalid'); } });
document.addEventListener('keydown', e => {
  if ($('#dscrim').classList.contains('open')) { if (e.key === 'Escape') closeDialog(); return; }
  if ($('#sheet').classList.contains('open') && e.key === 'Escape') return closeSheet();
  if (e.target.id === 'rn' && e.key === 'Enter') { e.preventDefault(); return nameSave(); }
  if (e.target.id === 'aq' && e.key === 'Enter') { e.preventDefault(); return $('#abody .srow')?.click(); }
});
let KBD_SIM = true;
document.addEventListener('focusin', e => { if (e.target.id === 'aq' || e.target.id === 'rn') { device.classList.toggle('kbd2', KBD_SIM); if (e.target.id === 'rn') e.target.select(); } });
document.addEventListener('focusout', e => { if (e.target.id === 'aq' || e.target.id === 'rn') setTimeout(() => { if (!['aq', 'rn'].includes(document.activeElement?.id)) device.classList.remove('kbd2'); }, 200); });
document.querySelectorAll('.kbd-sim .krow').forEach(r => { if (!r.querySelector('.k')) r.innerHTML = [...r.textContent].map(c => `<span class="k">${c}</span>`).join(''); });
document.addEventListener('click', e => {
  const k = e.target.closest('[data-kbd-set]'), f = e.target.closest('[data-fill]');
  if (k) { KBD_SIM = k.dataset.kbdSet === '1'; k.parentElement.querySelectorAll('[data-kbd-set]').forEach(x => x.classList.toggle('on', x === k)); }
  if (f) { const n = +f.dataset.fill; FEAT.ids = n === 0 ? [] : n === 7 ? DEV7.slice() : [...DEV7, ...MORE].slice(0, 20);
    f.parentElement.querySelectorAll('[data-fill]').forEach(x => x.classList.toggle('on', x === f)); S.screen = 'web'; ORD = null; render(); }
});
render();
</script>
</body>

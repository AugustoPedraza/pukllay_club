<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sketch 069 — Estantes: ubicar un juego</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
  /* Sketch 069 — the Estantes screen, restarted from the job (notes/estante-ui-restart.md, decisions 1–23).
     Standalone on purpose: only this UI, no 065 walk, no other admin pages. The shared system is kept
     (059–065 + 01.8.2 D-19): Inter 400/600, 22px/600 titles, 44px floor, 1px --stroke fields, A2 text
     actions pulled −12px, sheets of 48px rows with no buttons, one bottom snackbar. */
  :root { --stroke: color-mix(in srgb, var(--color-text) 58%, var(--color-bg)); --ter: var(--color-secondary); }
  /* 064: Terciaria is one step lighter than Principal — --color-secondary in light, --color-text-muted in dark */
  :root[data-theme="dark"] { --stroke: color-mix(in srgb, var(--color-text) 42%, var(--color-bg)); --ter: var(--color-text-muted); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --stroke: color-mix(in srgb, var(--color-text) 42%, var(--color-bg)); --ter: var(--color-text-muted); } }
  * { box-sizing: border-box; }
  body { margin: 0; background: #d9d4e0; font-family: var(--font-sans); color: var(--color-text); -webkit-font-smoothing: antialiased; }
  :root[data-theme="dark"] body { background: #120a1c; }
  button, input { font: inherit; color: inherit; }
  b { font-weight: 600; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg { display: block; }

  .stage { min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 24px 16px 64px; }
  .device { position: relative; width: 375px; height: 740px; background: var(--color-bg); border-radius: 28px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(30, 10, 50, .25); display: flex; flex-direction: column; }
  @media (max-width: 430px) { .stage { padding: 0; } .device { width: 100%; height: 100vh; border-radius: 0; } }

  /* chrome — context only, not this sketch's question */
  .hdr { height: 53px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 4px; border-bottom: 1px solid var(--color-border); }
  .hdr .burger { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; }
  .hdr img { height: 26px; }
  .hdr .img-dark { display: none; }
  :root[data-theme="dark"] .hdr .img-light { display: none; } :root[data-theme="dark"] .hdr .img-dark { display: block; }
  .hdr .word { font-family: var(--font-display); font-size: 1.05rem; letter-spacing: .03em; }
  .scroller { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; display: flex; flex-direction: column; }
  .tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 67px; display: grid; grid-template-columns: repeat(5, 1fr); padding: 4px 4px 8px;
    background: var(--color-bg); border-top: 1px solid var(--color-border); z-index: 20; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--color-text-muted); }
  .tab .ti { width: 56px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
  .tab .ti svg { width: 20px; height: 20px; }
  .tab.on { color: var(--color-accent-text); } .tab.on .ti { background: var(--color-accent-bg); }
  :root[data-theme="dark"] .tab.on .ti { background: color-mix(in srgb, var(--color-accent-text) 22%, transparent); }
  .tab .av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; box-shadow: inset 0 0 0 1.5px var(--color-success); }

  main { padding: 16px 16px 79px; flex: 1 0 auto; display: flex; flex-direction: column; }
  .device.kbd main { padding-bottom: 304px; }
  .body { display: flex; flex-direction: column; }
  .phead { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
  .ptitle { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 600; letter-spacing: -.01em; }
  .back { display: inline-flex; align-items: center; gap: 2px; height: 44px; margin-left: -10px; padding: 0 10px 0 4px; border: 0; background: none; font-size: 14px; font-weight: 600; color: var(--color-text-muted); cursor: pointer; }
  .back svg { width: 18px; height: 18px; }

  /* A2: text action — 44px, 12px side padding, pulled −12px so its label ends on the content edge */
  .tbtn { height: 44px; padding: 0 12px; border: 0; background: none; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--ter); cursor: pointer; white-space: nowrap; }
  .tbtn.pull-r { margin-right: -12px; } .tbtn.pull-l { margin-left: -12px; }
  .tbtn:hover { background: color-mix(in srgb, var(--ter) 8%, transparent); }
  /* A3: icon action — 44×44 borderless circle, 20px glyph, pulled −12px so the GLYPH lands on the content edge.
     Developer chose it over the "Administrar" text, which broke the header's balance. */
  .ibtn { width: 44px; height: 44px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; color: var(--color-text-muted); cursor: pointer; }
  .ibtn svg { width: 20px; height: 20px; }
  .ibtn.pull-r { margin-right: -12px; }
  .ibtn:hover { background: var(--color-surface); color: var(--color-text); }
  .ibtn:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }
  /* A1: outlined — Secundaria neutral stroke, Principal primary stroke */
  .obtn { height: 44px; padding: 0 16px; border: 1px solid var(--stroke); background: var(--color-bg); border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .obtn.pri { border-color: var(--color-primary); color: var(--color-accent-text); }
  :root[data-theme="dark"] .obtn.pri { border-color: var(--color-accent-text); }

  /* ---- search: placeholder with instructions, magnifier on the RIGHT (→ ✕ with text) ---- */
  /* decision 61 — raised-page rhythm. Measured before (375×667): title row → field 8, field → "Estante 1" 20, heading → lifted
     cover 8 (others 20), everything in the top 376px. Now title row → field 16 · field → answer 32 (a new group) · heading →
     lifted cover 16 (others 28). */
  .search { position: relative; margin-top: 16px; z-index: 12; }
  .sfield { position: relative; }
  .sfield input { width: 100%; height: 48px; padding: 0 48px 0 14px; border: 1px solid var(--stroke); border-radius: 8px; background: var(--color-bg); font-size: 16px; outline: none; }
  .sfield input::placeholder { color: var(--color-text-muted); }
  .sfield input { text-overflow: ellipsis; }                                            /* decision 60: a kept long name ends in … */
  .sfield input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 1px var(--color-primary); }
  :root[data-theme="dark"] .sfield input:focus { border-color: var(--color-accent-text); box-shadow: 0 0 0 1px var(--color-accent-text); }
  .sfield input::-webkit-search-cancel-button { display: none; }
  .sfield .sico { position: absolute; right: 2px; top: 2px; width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; color: var(--color-text-muted); border-radius: 8px; }
  .sfield .sico svg { width: 20px; height: 20px; }
  button.sico { cursor: pointer; }

  /* suggestions: drop DOWN OVER whatever is below (decision 12) */
  .sugg { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 12px;
    box-shadow: var(--shadow-lg); padding: 4px 0; max-height: 264px; overflow-y: auto; }
  /* 264px: the room between the dropdown's top (181px, field bottom 177 + 4) and a 292px phone keyboard (448) is 267px — measured after decision 61 moved the field down 8px (272 ran 5px under the keyboard). */
  .sugg[hidden] { display: none; }
  .srow { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 12px; border: 0; background: none; text-align: left; cursor: pointer; }
  .srow:hover, .srow.hl { background: var(--color-surface); }
  .srow .ttl { font-size: 15px; line-height: 1.3; }
  .srow .ttl mark { background: none; color: inherit; font-weight: 600; }
  /* decision 62 — a search with no match offers to create the game */
  .srow.create .cov { display: grid; place-items: center; background: var(--color-surface); color: var(--color-accent-text); }
  .srow.create .cov svg { width: 22px; height: 22px; }
  .srow.create .ttl { color: var(--color-accent-text); font-weight: 600; }
  .snone { padding: 14px 16px; font-size: 14px; color: var(--color-text-muted); }

  /* covers */
  .cov { width: 40px; height: 40px; border-radius: 6px; flex-shrink: 0; object-fit: cover; background: var(--color-surface); display: grid; place-items: center;
    font-weight: 600; font-size: 16px; }
  .cov.l { background: hsl(var(--h) 45% 84%); color: hsl(var(--h) 40% 28%); }
  :root[data-theme="dark"] .cov.l { background: hsl(var(--h) 30% 30%); color: hsl(var(--h) 50% 88%); }
  .txt { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .sub { font-size: 13px; line-height: 1.35; color: var(--color-text-muted); display: flex; align-items: center; gap: 6px; }
  /* decision 22 — a status is a DOT + TEXT, never a pill */
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: #D9892B; }

  /* ---- the answer ---- */
  .answer { margin-top: 32px; }
  #answer .rail { padding-top: 24px; }
  .answer[hidden] { display: none; }
  .aname { margin: 0 0 4px; font-size: 17px; font-weight: 600; line-height: 1.3; }
  /* decision 63 — the estante is context, not a heading: 18px estante icon + name, 14/600 muted (like the sheet, 33).
     Before: 17/600 in text colour read as a third heading between the page title (22/600) and the field. */
  .aname.e1 { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--color-text-muted); }
  .aname.e1 svg { width: 18px; height: 18px; flex-shrink: 0; }
  .shelf { position: relative; margin: 0 -16px; }
  .rail { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x proximity; padding: 16px 16px 8px; scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .shelf::before, .shelf::after { content: ""; position: absolute; top: 0; bottom: 0; width: 16px; z-index: 2; pointer-events: none; }
  .shelf::before { left: 0; background: linear-gradient(90deg, var(--color-bg), transparent); }
  .shelf::after { right: 0; background: linear-gradient(270deg, var(--color-bg), transparent); }
  .shelf .board { position: absolute; left: 16px; right: 16px; bottom: 50px; height: 4px; border-radius: 2px; background: var(--color-surface-2); z-index: 0; }
  .box { flex: 0 0 96px; width: 96px; display: flex; flex-direction: column; gap: 6px; border: 0; background: none; padding: 0; text-align: left; cursor: pointer;
    scroll-snap-align: center; position: relative; z-index: 1; }
  .box .bc { width: 96px; height: 100px; border-radius: 6px; object-fit: cover; background: var(--color-surface); display: grid; place-items: center; font-size: 28px; font-weight: 600;
    transition: transform var(--duration-base) var(--ease-out-soft), box-shadow var(--duration-base) var(--ease-out-soft); }
  .box .bc.l { background: hsl(var(--h) 45% 84%); color: hsl(var(--h) 40% 28%); }
  :root[data-theme="dark"] .box .bc.l { background: hsl(var(--h) 30% 30%); color: hsl(var(--h) 50% 88%); }
  .box .cap { font-size: 12px; line-height: 1.3; color: var(--color-text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 31px; }
  /* decision 23 — LIFTED: raised, with a shadow, as if pulled out of the shelf */
  .box.on .bc { transform: translateY(-12px); box-shadow: 0 14px 22px -6px rgba(36, 18, 56, .45); }
  :root[data-theme="dark"] .box.on .bc { box-shadow: 0 14px 22px -6px rgba(0, 0, 0, .8); }
  .box.on .cap { color: var(--color-text); font-weight: 600; }
  .box:focus-visible { outline: none; } .box:focus-visible .bc { outline: 2px solid var(--color-primary); outline-offset: 3px; }
  .hint { margin: 6px 0 0; font-size: 13px; color: var(--color-text-muted); }

  /* no spot yet (decision 5) */

  /* ---- recent lookups (decisions 20–21) ---- */
  .sec { margin-top: 24px; }
  .glabel { font-size: 13px; font-weight: 600; letter-spacing: .01em; margin: 0 0 4px; min-height: 28px; display: flex; align-items: center; }
  .rows { margin: 0 -16px; }
  .row { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; border: 0; background: none; text-align: left; cursor: pointer; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 68px; right: 0; height: 1px; background: var(--color-border); }
  .row:hover { background: var(--color-surface); }
  .row .name { font-size: 15px; line-height: 1.3; }
  .row .chev { width: 16px; height: 16px; color: var(--color-text-muted); }
  .glabel.quiet { font-weight: 400; color: var(--color-text-muted); }
  .row.compact { min-height: 48px; padding: 6px 16px; gap: 12px; }
  .row.compact .cov { width: 32px; height: 32px; font-size: 13px; border-radius: 5px; }
  .row.compact .name { font-size: 14px; }
  .row.compact .sub { font-size: 12px; }
  .row.compact + .row.compact::before { left: 60px; }

  /* ---- management page (decisions 43–47) ---- */
  .shelfico { width: 40px; height: 40px; border-radius: 8px; background: var(--color-surface); display: grid; place-items: center; flex-shrink: 0; color: var(--color-accent-text); }
  .shelfico > svg { width: 24px; height: 24px; }
  .mhead { margin-bottom: 8px; }
  .sh-head .estcov { display: grid; place-items: center; background: var(--color-surface); }
  .sh-head .estcov svg { width: 28px; height: 28px; }
  /* decision 51 — one list at a time under the search: Últimas búsquedas · Juegos afuera · Juegos sin ubicar */
  .dot.out { background: #3D7DD8; }
  .cnt { font-weight: 400; margin-left: 4px; }
  .more { min-height: 44px; margin-left: -12px; display: flex; align-items: center; gap: 2px; padding: 0 12px; border: 0; background: none; font-size: 14px; font-weight: 600; color: var(--ter); cursor: pointer; }
  .more svg { width: 16px; height: 16px; }
  .lhead { margin: 8px 0 4px; font-size: 15px; font-weight: 600; line-height: 1.3; min-height: 20px; }
  /* decision 58 — the Estantes page is the question + the search only. The lists move out:
     Últimas búsquedas → the search dropdown while the field is focused and empty (the standard search pattern);
     Afuera + Sin ubicar → a Pendientes page, reached from P1 a header icon with a count badge, or P2 one quiet line. */
  .sglabel { padding: 8px 16px 4px; font-size: 13px; color: var(--color-text-muted); }
  .hacts { display: flex; align-items: center; margin-right: -12px; }
  .ibtn.bd { position: relative; }
  .badge { position: absolute; top: 5px; right: 3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--color-primary); color: #fff;
    font-size: 11px; font-weight: 600; line-height: 18px; text-align: center; box-shadow: 0 0 0 2px var(--color-bg); }
  :root[data-theme="dark"] .badge { background: var(--color-accent-text); color: var(--color-bg); }
  #recent:empty { display: none; }
  .device:not(.raised) #recent { margin-top: 24px; }
  .psec + .psec { margin-top: 24px; }
  /* decision 66 — Crear opens the new-game editor (a stand-in here: the real one is Juegos, sketch 063), then "¿Dónde va?" */
  .flab { display: block; margin: 8px 0 6px; font-size: 13px; font-weight: 600; }
  .tfield { width: 100%; height: 48px; padding: 0 14px; border: 1px solid var(--stroke); border-radius: 8px; background: var(--color-bg); font-size: 16px; outline: none; }
  .tfield:focus { border-color: var(--color-primary); box-shadow: 0 0 0 1px var(--color-primary); }
  .standin { margin: 16px 0 0; padding: 12px 14px; border-radius: 8px; background: var(--color-surface); font-size: 13px; line-height: 1.45; color: var(--color-text-muted); }
  .obtn.wide { width: 100%; margin-top: 24px; }
  .psec .hint { margin: 0 0 4px; }
  .lempty { margin: 8px 0 0; font-size: 14px; color: var(--color-text-muted); min-height: 32px; }

  /* ---- sheet: rows only, commit first; closes with ✕ in the header (decision 29) ---- */
  .backdrop { position: absolute; inset: 0; background: color-mix(in srgb, #231339 38%, transparent); opacity: 0; pointer-events: none; transition: opacity var(--duration-base); z-index: 40; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--color-bg); border-radius: 18px 18px 0 0; padding: 8px 0 16px; z-index: 41;
    transform: translateY(105%); transition: transform 260ms var(--ease-out-soft); box-shadow: var(--shadow-lg); max-height: 85%; overflow-y: auto; }
  .sheet.open { transform: none; }
  .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--color-surface-2); margin: 0 auto 8px; }
  /* decision 31 — the header is not a row: bigger cover, 18px title, a full-width divider and 8px air before the rows.
     Measured before: header 58px vs 64px rows with the same anatomy (thumb · 16px title · 13px grey line) and 0px gap. */
  .sh-head { display: flex; gap: 16px; align-items: center; padding: 8px 16px 16px; border-bottom: 1px solid var(--color-border); margin-bottom: 8px; }
  .sh-head .cov { width: 56px; height: 60px; border-radius: 6px; }
  .sh-title { font-size: 18px; font-weight: 600; line-height: 1.3; }
  .sh-head .sub { font-size: 14px; margin-top: 2px; }
  /* decision 33 — the estante above the game name: icon + name, context rather than a subtitle */
  .est-meta { display: flex; align-items: center; gap: 6px; margin: 0 0 4px; font-size: 13px; line-height: 1.3; color: var(--color-text-muted); }
  .est-meta svg { width: 16px; height: 16px; flex-shrink: 0; }
  /* a quiet list label inside a sheet — the same treatment as "Últimas búsquedas" (decision 24) */
  .sh-label { font-size: 13px; color: var(--color-text-muted); min-height: 28px; display: flex; align-items: center; padding: 0 16px; }
  /* a sheet taller than 85% scrolls its rows under a pinned header (Ubicar: 9 estantes) — the ✕ never scrolls away */
  .sheet { scrollbar-width: none; } .sheet::-webkit-scrollbar { display: none; }
  .sheet { padding-top: 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }   /* review: the last row cleared the home indicator by 16px only on phones without one */
  .sh-top { position: sticky; top: 0; z-index: 2; background: var(--color-bg); padding-top: 8px; margin-bottom: 8px; }
  .sh-top .sh-head { margin-bottom: 0; }
  .dlink { width: 100%; display: flex; align-items: center; gap: 16px; min-height: 48px; padding: 0 16px; border: 0; background: none; font-size: 16px; text-align: left; cursor: pointer; }
  .dlink:hover { background: var(--color-surface); }
  .dlink svg { width: 22px; height: 22px; color: var(--color-text-muted); flex-shrink: 0; }
  .dlink.danger, .dlink.danger svg { color: var(--color-danger); }
  .dlink .dsub { display: block; font-size: 13px; color: var(--color-text-muted); }
  .dlink:has(.dsub) { min-height: 64px; padding-block: 8px; }   /* a two-line row takes 061's two-line height, not 48 */
  .dlink:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }
  .sheet:focus { outline: none; }
  /* decision 29 — a sheet closes with ✕ in its header, across from the cover (tap outside / drag / Esc still close).
     No Cancelar row: with ‹ it read as a back link, and at row weight it read as a 4th option. Applies to every admin sheet. */
  .sh-head .sh-txt { flex: 1; min-width: 0; }
  .sh-x { width: 44px; height: 44px; margin: -6px -10px 0 0; align-self: flex-start; flex-shrink: 0; border: 0; background: none; border-radius: 50%;
    display: grid; place-items: center; color: var(--color-text-muted); cursor: pointer; }
  .sh-x svg { width: 22px; height: 22px; }
  .sh-x:hover { background: var(--color-surface); }
  .sh-x:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }

  /* ---- decisions 35–36 — choosing the spot on the Estantes page ---- */
  /* an insertion slot: a visible 24px "+" between covers; its hit box is 44px wide and runs under the (inert) covers */
  .slot { position: relative; flex: 0 0 20px; align-self: stretch; border: 0; background: none; padding: 0; cursor: pointer; display: grid; place-items: start center; z-index: 2; }
  .slot::before { content: ""; position: absolute; top: 0; bottom: 0; left: -12px; right: -12px; }
  .slot .pl { width: 24px; height: 24px; border-radius: 50%; border: 1px dashed var(--stroke); background: var(--color-bg); color: var(--color-text-muted); display: grid; place-items: center; }
  .slot .pl svg { width: 14px; height: 14px; }
  .slot:hover .pl, .slot:focus-visible .pl { border: 1px solid var(--color-primary); color: var(--color-accent-text); background: var(--color-surface); }
  .slot:focus-visible { outline: none; }
  .placing .box { cursor: default; pointer-events: none; }
  .rail .slot .pl { margin-top: 38px; }
  /* decision 64 — the found game's rail offers "+" on each side of the selected cover: put a game right there */
  #rail { gap: 10px; }
  #rail .slot { margin: 0 2px; }   /* 12px to each cover: the 44px hit box (20 + 12 + 12) reaches the covers' edges without covering them */
  .rail.placing { gap: 4px; }

  /* decision 36 — the Estantes search reused to choose the spot ("place a game based on another") */
  .estcov { color: var(--color-accent-text); }
  .estcov svg { width: 22px; height: 22px; }
  .rail.placing .box.on .bc { transform: translateY(-8px); box-shadow: 0 10px 16px -6px rgba(36, 18, 56, .45); }
  .rail.placing .box.on .cap { color: var(--color-text); font-weight: 600; }
  .prows .row .cov { width: 40px; height: 40px; }
  /* decision 37 — "¿Dónde va?" in a full-height sheet (a large detent: 24px of page still shows above) */
  .sheet.full { top: 24px; max-height: none; }
  .pshelf { margin-top: 16px; }
  /* decision 39 — the placed game drops into its spot and settles lifted (−12px), with a soft overshoot */
  @keyframes land { 0% { transform: translateY(-56px) scale(.92); opacity: 0; } 55% { transform: translateY(-6px) scale(1.02); opacity: 1; }
    78% { transform: translateY(-15px) scale(1); } 100% { transform: translateY(-12px); } }
  @keyframes landcap { 0%, 40% { opacity: 0; } 100% { opacity: 1; } }
  .box.on.landed .bc { animation: land 620ms cubic-bezier(.2, .8, .3, 1) both; }

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const byId = id => G.find(g => g.id === id);
/* the 6 games with no spot are real games too; 428 are shelved across 9 estantes of 46–50 */
const NOSPOT = [17, 88, 151, 230, 301, 377];

{ let k = 0; const pool = G.map(g => g.id).filter(id => !NOSPOT.includes(id)); shelves.forEach((s, i) => { s.ids = pool.slice(k, k + SIZES[i]); k += SIZES[i]; }); }

  const el = $('#pqico'), q = $('#pq')?.value; if (!el) return;
  el.outerHTML = q ? `<button class="sico" id="pqico" data-act="pclear" aria-label="Borrar búsqueda">${ic('x')}</button>` : `<span class="sico" id="pqico">${ic('search')}</span>`;
}
function renderPBody() {
  const body = $('#pbody'); if (!body || !S.placing) return;
  const q = $('#pq')?.value || '';
  if (!q.trim()) S.placing.sid = S.placing.ref = S.placing.shown = null;   /* an empty field = choose again */
  if (q.trim() && q !== S.placing.shown) { const list = placeResults(q, S.placing.gid);
    body.innerHTML = `<div class="pres" role="listbox">${list.length ? list.map((r, i) => placeRow(r, i, q)).join('') : '<div class="snone">Ningún estante ni juego se llama así.</div>'}</div>`; return; }
  renderPlacingAnswer(body);
}
/* decision 39 — the placed cover drops into its spot and settles lifted; no motion under reduced-motion */
function landed(id) {
  requestAnimationFrame(() => { const b = document.querySelector(`#rail .box[data-id="${id}"]`); if (!b) return;
    b.classList.remove('landed'); void b.offsetWidth; b.classList.add('landed');
    b.addEventListener('animationend', () => b.classList.remove('landed'), { once: true }); });
}
function placeAt(g, s, pos) {
  const move = !!S.placing?.move, from = where(g.id);                /* decision 40 — remove + add happen together, only now */
  if (from) from.s.ids.splice(from.i, 1);
  s.ids.splice(pos, 0, g.id); S.placing = null;
  if (S.screen !== 'ubicar') { S.screen = 'ubicar'; render(); $('#scroller').scrollTo({ top: 0 }); }   /* placed from Pendientes → Estantes shows it landing */
  if ($('#sheet').classList.contains('open')) { $('#pq')?.blur(); closeSheet(); }
  const inp = $('#q'); if (inp) { inp.value = ''; inp.blur(); } hl = -1; renderSugg();   /* like decision 11: done → field clear, keyboard down */
  S.picked = g.id; S.sel = null; renderAnswer(); renderRecent();
  landed(g.id);
  snack(move ? 'Juego movido' : 'Juego ubicado', { label: 'Deshacer', run: () => {
    s.ids.splice(s.ids.indexOf(g.id), 1); if (from) from.s.ids.splice(from.i, 0, g.id);
    if (!from) S.picked = null; renderAnswer(); renderRecent(); syncLayout(); if (from) centerOn(g.id, false); } });
}

/* ---------- confirmation dialog (decision 41) ---------- */
const DLG = { run: null, opener: null };
function openDialog({ title, text, yes, run }) {
  DLG.run = run; DLG.opener = document.activeElement;
  $('#dlg-t').textContent = title; $('#dlg-d').textContent = text; $('[data-act="dlg-yes"]').textContent = yes;
  $('#dscrim').classList.add('open');
  setTimeout(() => $('[data-act="dlg-no"]').focus(), 60);             /* the safe action has focus */
}
function closeDialog() { $('#dscrim').classList.remove('open'); DLG.run = null; }
function doQuitar(id) {
  const w = where(id); w.s.ids.splice(w.i, 1);
  S.sel = null; S.picked = null; renderAnswer(); renderRecent(); syncLayout();   /* decision 36: no "Ubicar" answer any more */
  snack('Juego quitado del estante', { label: 'Deshacer', run: () => { w.s.ids.splice(w.i, 0, id); S.picked = id; renderAnswer(); renderRecent(); syncLayout(); } });
}

/* ---------- snackbar (10 s with an action, 4 s without) ---------- */
function snack(msg, action) {
  const s = $('#snack'), b = s.querySelector('.tbtn'), x = s.querySelector('.x');
  s.querySelector('span').textContent = msg; b.hidden = !action; x.hidden = !action;
  if (action) { b.textContent = action.label; b.onclick = () => { action.run(); hide(); }; x.innerHTML = ic('x'); }
  const hide = () => s.classList.remove('show'); x.onclick = hide;
  clearTimeout(s._t); s.classList.remove('show'); void s.offsetWidth; s.classList.add('show');
  s._t = setTimeout(hide, action ? 10000 : 4000);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const th = e.target.closest('[data-theme-set]'); if (th) { document.documentElement.dataset.theme = th.dataset.themeSet; return; }
  if (e.target.id === 'backdrop') return closeSheet();
  if (e.target.id === 'dscrim') return closeDialog();
  const t = e.target.closest('[data-act]'); if (!t) {
    if (!e.target.closest('.search')) { const box = $('#sugg'); if (box && !box.hidden) { box.hidden = true; $('#q')?.setAttribute('aria-expanded', 'false'); } }
    return;
  }
  const id = +t.dataset.id, act = t.dataset.act;
  if (act === 'pick') return pick(id);
  if (act === 'idle') return goIdle();
  if (act === 'create') {                                           /* decision 66 — the editor first, then where it goes */
    S.newAt = ADD ? { ...ADD } : null; ADD = null; S.newName = t.dataset.q;
    $('#sugg').hidden = true; if ($('#sheet').classList.contains('open')) closeSheet();
    const inp = $('#q'); if (inp) { inp.value = ''; inp.blur(); }
    S.picked = null; S.sel = null; S.screen = 'editor'; render(); syncLayout(); return $('#scroller').scrollTo({ top: 0 });
  }
  if (act === 'newsave') {
    const name = $('#nn').value.trim(); if (!name) return $('#nn').focus();
    const g = { id: Math.max(...G.map(x => x.id)) + 1, name, thumb: null, hue: hue(name) }; G.push(g);
    const at = S.newAt; S.newAt = null; S.screen = 'ubicar'; render(); syncLayout();
    if (at) { S.placing = { gid: g.id, move: false }; return placeAt(g, shelfById(at.sid), at.pos); }   /* from a rail "+": the spot is already chosen */
    return pick(g.id);                                                  /* from the search: no spot yet → "¿Dónde va?" (36) */
  }
  if (act === 'clear') { const i = $('#q'); i.value = ''; renderSugg(); return i.focus(); }
  if (act === 'box') {                                             /* decision 10 */
    const cur = S.sel || S.picked;
    if (id === cur) return boxSheet(byId(id), t);
    S.sel = id; renderAnswer(); centerOn(id, true);
    return document.querySelector(`#rail [data-id="${id}"]`)?.focus({ preventScroll: true });
  }
  if (act === 'close') return closeSheet();
  if (act === 'pref') {
    const ref = t.dataset.ref ? +t.dataset.ref : null, x = ref ? where(ref).s : shelfById(+t.dataset.sid), g = byId(S.placing.gid);
    if (!view(x).ids.length) return placeAt(g, x, 0);                        /* decision 35 — empty: directly */
    S.placing.sid = x.id; S.placing.ref = ref;
    /* decision 38 — the field keeps the chosen estante (picked by name or through a game on it) */
    const pq = $('#pq'); pq.value = S.placing.shown = x.name; pq.blur(); pqIcon(); return renderPBody();
  }
  if (act === 'addat') return addSheetOpen(+t.dataset.sid, +t.dataset.pos, t);
  if (act === 'addpick') return addPick(id);
  if (act === 'slot') return placeAt(byId(id), shelfById(+t.dataset.sid), +t.dataset.pos);
  if (act === 'pclear') { const pq = $('#pq'); pq.value = ''; S.placing.sid = S.placing.ref = S.placing.shown = null; pqIcon(); renderPBody(); return pq.focus(); }
  if (act === 'mover') {                                            /* decision 40 */
    closeSheet(); S.placing = { gid: id, sid: null, ref: null, move: true };
    return setTimeout(() => placeSheetOpen(byId(id), t), 280);        /* after the options sheet has gone down */
  }
  if (act === 'quitar') {                                           /* decision 41 — confirm in a dialog first */
    const g = byId(id); closeSheet();
    return openDialog({ title: `¿Quitar ${g.name} del estante?`, text: 'Queda sin lugar hasta que lo vuelvas a ubicar.', yes: 'Quitar', run: () => doQuitar(id) });
  }
  if (act === 'dlg-no') return closeDialog();
  if (act === 'dlg-yes') { const run = DLG.run; closeDialog(); return run(); }
  if (act === 'admin') { S.screen = 'admin'; render(); return $('#scroller').scrollTo({ top: 0 }); }
  if (act === 'back') { S.screen = 'ubicar'; render(); return syncLayout(); }
  if (act === 'esheet') return estSheet(shelfById(+t.dataset.sid), t);
  if (act === 'newest') return nameSheet(null, t);
  if (act === 'ordon') { ORD = { before: shelves.map(x => x.id), arrows: null }; renderAdmin(); return $('#scroller').scrollTo({ top: 0 }); }
  if (act === 'handle') { const sid = +t.dataset.sid; if (ORD.justDragged) return; ORD.arrows = ORD.arrows === sid ? null : sid; return renderOrder(`.handle[data-sid="${sid}"]`); }
  if (act === 'ordup' || act === 'orddown') { const sid = +t.dataset.sid, i = shelves.findIndex(x => x.id === sid); if (ordMove(sid, i + (act === 'ordup' ? -1 : 1))) { renderOrder(`[data-act="${act}"][data-sid="${sid}"]:not(:disabled), .handle[data-sid="${sid}"]`); ordSay(sid); } return; }
  if (act === 'ordoff') {
    const before = ORD.before, changed = before.join() !== shelves.map(x => x.id).join(); ORD = null; renderAdmin();
    if (changed) snack('Orden guardado', { label: 'Deshacer', run: () => { shelves.sort((a, b) => before.indexOf(a.id) - before.indexOf(b.id)); if (S.screen === 'admin' && !ORD) renderAdmin(); } });
    return;
  }
  if (act === 'editest') { const x = shelfById(+t.dataset.sid); closeSheet(); return setTimeout(() => nameSheet(x, document.querySelector(`[data-act="esheet"][data-sid="${x.id}"]`)), 280); }
  if (act === 'estsave') return estSave();
  if (act === 'eliminar') {
    const x = shelfById(+t.dataset.sid), n = x.ids.length; closeSheet();
    return openDialog({ title: `¿Eliminar ${x.name}?`, text: n ? `Sus ${jn(n)} quedan sin lugar hasta que los vuelvas a ubicar.` : 'Está vacío.', yes: 'Eliminar', run: () => {
      const i = shelves.indexOf(x); if (i >= 0) shelves.splice(i, 1); else WITH_EMPTY = false; render();
      snack('Estante eliminado', { label: 'Deshacer', run: () => { if (i >= 0) shelves.splice(i, 0, x); else WITH_EMPTY = true; if (S.screen === 'admin') render(); } }); } });
  }
  if (act === 'pend') { S.screen = 'pend'; S.picked = null; S.sel = null; render(); syncLayout(); return $('#scroller').scrollTo({ top: 0 }); }
  if (act === 'ppick') { if (where(id)) { S.screen = 'ubicar'; render(); } return pick(id); }   /* afuera → its spot on Estantes; sin ubicar → "¿Dónde va?" over Pendientes */
  if (act === 'soon') { closeSheet(); return snack(`${t.dataset.what}: se diseña en otro boceto`); }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { hl = -1; renderSugg(); }
  if (e.target.id === 'pq') { pqIcon(); renderPBody(); }
  if (e.target.id === 'aq') renderABody();   /* only the body re-renders: the field keeps focus */
 });
document.addEventListener('focusin', e => { if (e.target.id === 'q') { if (BVAR === 'B1' && e.target.value && e.target.value === S.shownName) e.target.select(); renderSugg(); } });
document.addEventListener('keydown', e => {
  if ($('#dscrim').classList.contains('open')) { if (e.key === 'Escape') closeDialog(); return; }
  if ($('#sheet').classList.contains('open') && e.key === 'Escape') return closeSheet();
  if (e.target.id === 'en' && e.key === 'Enter') { e.preventDefault(); return estSave(); }
  if (e.target.id === 'aq' && e.key === 'Enter') { e.preventDefault(); return $('#abody .srow')?.click(); }
  if (e.target.id === 'pq' && e.key === 'Enter') { e.preventDefault(); return $('#pbody .pres .srow')?.click(); }
  if (e.target.id !== 'q') return;
  const list = suggestions(e.target.value);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); hl = Math.max(0, Math.min(list.length - 1, hl + (e.key === 'ArrowDown' ? 1 : -1))); renderSugg(); }
  if (e.key === 'Enter') { e.preventDefault(); const g = list[hl >= 0 ? hl : 0]; if (g && (list.length === 1 || hl >= 0)) pick(g.id); }
  if (e.key === 'Escape') { $('#sugg').hidden = true; }
});
/* ---------- layout variants ---------- */
const root = document.documentElement, device = $('#device');
let KBD_SIM = true, SAVED = null;
const AFUERA_SEED = [shelves[2].ids[4], shelves[6].ids[11], shelves[0].ids[22]]; AFUERA = AFUERA_SEED;
document.querySelectorAll('.kbd-sim .krow').forEach(r => { if (!r.querySelector('.k')) r.innerHTML = [...r.textContent].map(c => `<span class="k">${c}</span>`).join(''); });
/* FLIP: B and C move the search between the middle and the top; the move is animated, not a jump */
function flip(change) {
  const els = [...main.querySelectorAll('.search, .body, .phead')], before = els.map(e => e.getBoundingClientRect().top);
  change();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  els.forEach((e, i) => { const d = before[i] - e.getBoundingClientRect().top; if (!d) return;
    e.style.transition = 'none'; e.style.transform = `translateY(${d}px)`;
    requestAnimationFrame(() => requestAnimationFrame(() => { e.style.transition = 'transform 280ms var(--ease-out-soft)'; e.style.transform = ''; })); });
}
function syncLayout() {
  const focused = document.activeElement && document.activeElement.id === 'q';
  const kbd = focused && KBD_SIM, raised = focused || !!S.picked;
  if (device.classList.contains('kbd') === kbd && device.classList.contains('raised') === raised) return;
  flip(() => { device.classList.toggle('kbd', kbd); device.classList.toggle('raised', raised); });
}
document.addEventListener('focusin', e => { if (e.target.id === 'q') syncLayout(); if (e.target.id === 'aq') device.classList.toggle('kbd2', KBD_SIM); if (e.target.id === 'en') { device.classList.toggle('kbd2', KBD_SIM); e.target.select(); } if (e.target.id === 'pq') { device.classList.toggle('kbd2', KBD_SIM); if (e.target.value && e.target.value === S.placing?.shown) e.target.select(); } });   /* typing replaces the kept estante */
document.addEventListener('focusout', e => { if (e.target.id === 'pq' || e.target.id === 'aq') device.classList.remove('kbd2');
  if (e.target.id === 'en') setTimeout(() => { if (document.activeElement?.id !== 'en') device.classList.remove('kbd2'); }, 200); });   /* a tap on the button lands before the keyboard goes */
document.addEventListener('input', e => { if (e.target.id === 'en') { $('#enerr').hidden = true; e.target.removeAttribute('aria-invalid'); } });
/* a tap on a suggestion blurs the field first; wait a beat so the layout does not drop and rise again */
document.addEventListener('focusout', e => { if (e.target.id === 'q') setTimeout(syncLayout, 160); });
document.addEventListener('click', e => {
  const k = e.target.closest('[data-kbd-set]');
  const em = e.target.closest('[data-empty-set]');
  const many = e.target.closest('[data-many]'), out = e.target.closest('[data-out]');
  if (out) { AFUERA = out.dataset.out === '3' ? AFUERA_SEED : []; out.parentElement.querySelectorAll('[data-out]').forEach(x => x.classList.toggle('on', x === out)); render(); syncLayout(); }
  if (many) { const on = many.dataset.many === '1';
    if (on && !SAVED) { SAVED = shelves.map(x => x.ids.slice()); shelves.forEach(x => { x.ids = []; }); }   /* after the D-05 migration: every game Sin ubicar */
    if (!on && SAVED) { shelves.forEach((x, i) => { x.ids = SAVED[i] || []; }); SAVED = null; }
    S.picked = null; S.sel = null; many.parentElement.querySelectorAll('[data-many]').forEach(x => x.classList.toggle('on', x === many)); render(); syncLayout(); }
  if (em) { WITH_EMPTY = em.dataset.emptySet === '1'; EMPTY_SHELF.ids = []; em.parentElement.querySelectorAll('[data-empty-set]').forEach(x => x.classList.toggle('on', x === em)); }
  if (k) { KBD_SIM = k.dataset.kbdSet === '1'; syncLayout(); k.parentElement.querySelectorAll('[data-kbd-set]').forEach(x => x.classList.toggle('on', x === k)); }
});
render();

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Export — OG Fallback Card (Variant B, ramp-800)</title>
<style>
  @font-face {
    font-family: "Bebas Neue";
    font-style: normal;
    font-weight: 400;
    src: url("../../../priv/static/fonts/bebas-neue-400-latin.woff2") format("woff2");
  }
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 400;
    src: url("../../../priv/static/fonts/inter-400-latin.woff2") format("woff2");
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden;
  }
  .og-card {
    width: 1200px; height: 630px;
    background: #551670;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px;
  }
  .og-card img.mark { width: 190px; height: auto; display: block; }
  .og-card .wordmark {
    font-family: "Bebas Neue", ui-sans-serif, sans-serif;
    color: #fff; font-size: 68px; letter-spacing: 0.08em; line-height: 1;
    text-transform: uppercase;
  }
  .og-card .tagline {
    font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    color: #E3D3F0; font-size: 27px; font-weight: 400; letter-spacing: 0.01em;
    line-height: 1.3; text-align: center;
  }
</style>
</head>
<body>
  <div class="og-card">
    <img class="mark" src="../../../priv/static/images/isologo-dark.png" alt="">
    <span class="wordmark">Pukllay Club</span>
    <span class="tagline">Tu club de juegos de mesa modernos — Jujuy</span>
  </div>
</body>
</html>

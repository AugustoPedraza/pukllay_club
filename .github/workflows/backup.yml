name: Nightly Backup

# DEPLOY-04: a nightly pg_dump of the production Postgres accessory, uploaded
# to Cloudflare R2. Runs over SSH from GitHub Actions rather than a host-side
# cron/systemd timer (00-06-PLAN.md assumption_delta_decision) so R2
# credentials stay in GitHub secrets (D-08 consistency) instead of living on
# host disk.
#
# ACCEPTED RISK (00-CONTEXT.md D-19 / 00-RESEARCH.md Pitfall 3): the repo is
# public, so GitHub auto-disables `schedule:`-triggered workflows after 60
# days without a repository commit. No keepalive mechanism is added — the
# project has several more phases of active planned development, so a
# 60-day commit gap is considered unlikely. See 00-06-SUMMARY.md for the
# explicit acceptance record.

on:
  schedule:
    - cron: "0 8 * * *" # nightly, 08:00 UTC
  workflow_dispatch: {} # manual trigger, used to verify the pipeline end-to-end

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Load deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # aws-cli ships preinstalled on GitHub-hosted ubuntu-latest runners, but
      # the plan flags this as unconfirmed (00-RESEARCH.md Open Question 2) —
      # verify explicitly and install on demand rather than assume.
      - name: Ensure aws-cli is available
        run: |
          if ! command -v aws &> /dev/null; then
            echo "aws-cli not found — installing"
            curl -sS "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            sudo ./aws/install
          fi
          aws --version

      - name: Dump production database over SSH
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          BACKUP_FILE="backup-$(date +%F).sql.gz"

          # WR-01: the password is sent over ssh's stdin (here-string below)
          # instead of being interpolated into the remote command string, so
          # it never appears as a `docker exec -e ...` argument in the
          # remote host's process list — the remote script only ever
          # references it via --env-file, read from a 0600 temp file that a
          # trap removes on exit.
          ssh -o StrictHostKeyChecking=accept-new "deploy@${{ secrets.DEPLOY_HOST }}" '
            set -euo pipefail
            ENV_FILE=$(mktemp)
            chmod 600 "$ENV_FILE"
            trap "rm -f \"$ENV_FILE\"" EXIT
            cat > "$ENV_FILE"
            sudo docker exec --env-file "$ENV_FILE" db bash -c "set -o pipefail; pg_dump -U postgres pukllay_club_prod | gzip"
          ' <<< "PGPASSWORD=$POSTGRES_PASSWORD" \
            > "$BACKUP_FILE"

          # Fail loudly instead of uploading a silently-broken/empty dump
          # (a remote-side pg_dump failure otherwise only surfaces as gzip
          # exiting 0 on empty/closed stdin — see CR-02).
          gzip -t "$BACKUP_FILE"
          test -s "$BACKUP_FILE"

      - name: Upload dump to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          aws s3 cp "backup-$(date +%F).sql.gz" \
            s3://pukllay-backups/ \
            --endpoint-url "$R2_ENDPOINT"

name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    # Docs-only pushes (.planning/, .claude/, docs/, any *.md — roughly 590
    # tracked files) must never trigger a full Elixir release build + Kamal
    # deploy, since the Dockerfile's COPY list (mix.exs, mix.lock, config,
    # priv, lib, assets, rel, docker-entrypoint) never touches those paths —
    # a documentation change provably cannot alter the built image. This job
    # classifies the push; it does NOT depend on `quality` (see below) and
    # `quality` does NOT depend on it (see the `quality` job's own comment).
    runs-on: ubuntu-latest
    # Least privilege: this job runs third-party JavaScript (paths-filter)
    # on the runner with a token. Scoping to contents:read (dropping the
    # packages:write / deploy secrets that other jobs need) means even a
    # fully compromised action here can only read repo contents, never push
    # an image or reach SECRET_KEY_BASE/DATABASE_URL/DEPLOY_SSH_KEY/
    # POSTGRES_PASSWORD, which are scoped to build-and-push/deploy only.
    permissions:
      contents: read
    outputs:
      # Fail-open by construction: compare against the literal string
      # 'false' rather than reading the raw output directly. If the filter
      # step errors, is skipped, or can't resolve a base commit, its output
      # is empty/absent — which is not the string 'false' — so this
      # expression resolves to true and build-and-push/deploy still run.
      # An unnecessary deploy is cheap; a silently skipped real deploy is
      # not, so every degradation path here deploys rather than skips.
      code: ${{ steps.filter.outputs.code != 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 (full history) is required because paths-filter
          # compares this same-branch push against the commit immediately
          # before it — a shallow checkout could leave that base commit
          # unreachable, which would otherwise silently break comparison.
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@v4
        # If this action errors or is unavailable, don't block or skip the
        # deploy — let the `code` output above resolve to true instead.
        continue-on-error: true
        with:
          # Default quantifier `some` ORs the negations below, so e.g. a
          # `.planning/*.md` file would satisfy "not under .claude" and get
          # classified as code. `every` requires a file to be simultaneously
          # not markdown, not under .planning, not under .claude, and not
          # under docs to count as code — the correct AND-of-negations
          # "anything that isn't documentation" semantics.
          predicate-quantifier: 'every'
          # Deny-list of documentation paths, deliberately not an allow-list
          # of code paths, so any new source directory added later defaults
          # to being treated as code (safe direction). `ideas.txt`, `.gsd/`,
          # and `.github/**` are intentionally NOT in this list and will
          # keep triggering deploys — conservative by design, not an
          # oversight.
          filters: |
            code:
              - '!**/*.md'
              - '!*.md'
              - '!.planning/**'
              - '!.claude/**'
              - '!docs/**'

  quality:
    # Re-run the quality gate on main before build/deploy, so a broken merge
    # never reaches production (D-04) — even though the PR that merged here
    # already passed this same gate once.
    #
    # Deliberately carries no `if:` and no `needs:` on the `changes` gate
    # above: this job's name is the required status check that GitHub branch
    # protection is configured against, and a required check that never
    # reports (because it was skipped) blocks merges indefinitely rather
    # than passing them. `quality` must run — and report — on every push,
    # documentation-only or not.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pukllay_club_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/pukllay_club_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5-otp-28"
          otp-version: "28.5"

      - name: Restore deps/_build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run quality gate (format, credo, sobelow, test)
        run: mix quality

  build-and-push:
    needs: [changes, quality]
    # Skip the build entirely for a docs-only push (see the `changes` job's
    # comment for why this is provably safe). `quality` stays in `needs` —
    # dropping it would let a broken merge reach production (D-04).
    if: needs.changes.outputs.code == 'true'
    # Native x86_64 build on a plain runner (D-20 supersedes D-01's native
    # arm64 assumption: production moved from a Hetzner CAX31 (arm64) to a
    # GCP e2-micro (x86_64) due to a 2026 capacity shortage). ubuntu-latest
    # runners are x86_64, so this is a native build for our target, not a
    # cross-build — no buildx platform override needed since
    # docker/build-push-action defaults to the runner's native platform.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Kamal computes its own image version as the full (40-char) git
          # SHA of the checked-out commit and expects to find that exact
          # tag in the registry when the deploy job runs `kamal ... --skip-push`
          # (it never builds — the build already happened in this job).
          # `type=sha,format=long,prefix=` produces that plain 40-char tag
          # with no "sha-" prefix, so the two jobs agree on one tag with
          # zero extra coordination. `latest` is kept only for human/manual
          # `docker pull` convenience — Kamal never uses it.
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Kamal's own `validate_image` check (run before every deploy)
          # requires a `service` label matching config/deploy.yml's
          # `service:` value — normally added automatically by `kamal
          # build`, but we build externally here (D-01/D-10), so it must
          # be added explicitly alongside metadata-action's OCI labels.
          labels: |
            ${{ steps.meta.outputs.labels }}
            service=pukllay_club
          # No cross-build override — the runner itself is x86_64, matching
          # the GCP e2-micro production target, so this is a native build,
          # not a QEMU-emulated cross-build (D-20 supersedes D-01).

  deploy:
    needs: [changes, build-and-push]
    # A skipped `build-and-push` already skips `deploy` via `needs:` alone,
    # so this condition is redundant today — stated anyway so the gate
    # survives a future edit that relaxes this job's `needs:` list.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Kamal
        run: gem install kamal --version "2.12.0"

      - name: Load deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Write .kamal/secrets
        # .kamal/secrets is intentionally gitignored (D-08, defense in
        # depth against ever pasting a literal secret value into it) so a
        # fresh checkout never has it — write it fresh on the runner every
        # run. Only $VAR-style references go in the file itself; the
        # literal values stay in the job's env, resolved by Kamal's own
        # $VAR substitution at deploy time (D-11, Pitfall 3).
        run: |
          mkdir -p .kamal
          cat > .kamal/secrets <<'EOF'
          KAMAL_REGISTRY_PASSWORD=$KAMAL_REGISTRY_PASSWORD
          SECRET_KEY_BASE=$SECRET_KEY_BASE
          DATABASE_URL=$DATABASE_URL
          SENTRY_DSN=$SENTRY_DSN
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          EOF

      - name: Deploy with Kamal
        env:
          # Every secret declared in config/deploy.yml's env.secret /
          # accessory env.secret must be exported here, right before
          # `kamal deploy` runs, so Kamal's own $VAR substitution
          # (.kamal/secrets) resolves them (D-11, Pitfall 3). Nothing here
          # is a literal value in git — these all come from GitHub repo
          # secrets, resolved only in this ephemeral job.
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        # Steady-state CI-driven deploy (D-02). `kamal setup` (which also
        # boots kamal-proxy + the db accessory + obtains the Let's Encrypt
        # cert) was used only for plan 00-05's one-time first bring-up on
        # the GCP host; that bootstrap is confirmed healthy and live, so
        # every deploy from here on uses the leaner `kamal deploy`.
        # --skip-push: the image was already built and pushed by the
        # build-and-push job above (D-01/D-10) — Kamal only needs to pull
        # the tag matching its computed version (the full git SHA of this
        # commit, which the previous job tagged via metadata-action).
        run: kamal deploy --skip-push

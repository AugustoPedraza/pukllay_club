name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    # Re-run the quality gate on main before build/deploy, so a broken merge
    # never reaches production (D-04) — even though the PR that merged here
    # already passed this same gate once.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pukllay_club_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/pukllay_club_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5-otp-28"
          otp-version: "28.5"

      - name: Restore deps/_build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run quality gate (format, credo, sobelow, test)
        run: mix quality

  build-and-push:
    needs: quality
    # Native x86_64 build on a plain runner (D-20 supersedes D-01's native
    # arm64 assumption: production moved from a Hetzner CAX31 (arm64) to a
    # GCP e2-micro (x86_64) due to a 2026 capacity shortage). ubuntu-latest
    # runners are x86_64, so this is a native build for our target, not a
    # cross-build — no buildx platform override needed since
    # docker/build-push-action defaults to the runner's native platform.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Kamal computes its own image version as the full (40-char) git
          # SHA of the checked-out commit and expects to find that exact
          # tag in the registry when the deploy job runs `kamal ... --skip-push`
          # (it never builds — the build already happened in this job).
          # `type=sha,format=long,prefix=` produces that plain 40-char tag
          # with no "sha-" prefix, so the two jobs agree on one tag with
          # zero extra coordination. `latest` is kept only for human/manual
          # `docker pull` convenience — Kamal never uses it.
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Kamal's own `validate_image` check (run before every deploy)
          # requires a `service` label matching config/deploy.yml's
          # `service:` value — normally added automatically by `kamal
          # build`, but we build externally here (D-01/D-10), so it must
          # be added explicitly alongside metadata-action's OCI labels.
          labels: |
            ${{ steps.meta.outputs.labels }}
            service=pukllay_club
          # No cross-build override — the runner itself is x86_64, matching
          # the GCP e2-micro production target, so this is a native build,
          # not a QEMU-emulated cross-build (D-20 supersedes D-01).

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Kamal
        run: gem install kamal --version "2.12.0"

      - name: Load deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Write .kamal/secrets
        # .kamal/secrets is intentionally gitignored (D-08, defense in
        # depth against ever pasting a literal secret value into it) so a
        # fresh checkout never has it — write it fresh on the runner every
        # run. Only $VAR-style references go in the file itself; the
        # literal values stay in the job's env, resolved by Kamal's own
        # $VAR substitution at deploy time (D-11, Pitfall 3).
        run: |
          mkdir -p .kamal
          cat > .kamal/secrets <<'EOF'
          KAMAL_REGISTRY_PASSWORD=$KAMAL_REGISTRY_PASSWORD
          SECRET_KEY_BASE=$SECRET_KEY_BASE
          DATABASE_URL=$DATABASE_URL
          SENTRY_DSN=$SENTRY_DSN
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          EOF

      - name: Deploy with Kamal
        env:
          # Every secret declared in config/deploy.yml's env.secret /
          # accessory env.secret must be exported here, right before
          # `kamal deploy` runs, so Kamal's own $VAR substitution
          # (.kamal/secrets) resolves them (D-11, Pitfall 3). Nothing here
          # is a literal value in git — these all come from GitHub repo
          # secrets, resolved only in this ephemeral job.
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        # Steady-state CI-driven deploy (D-02). `kamal setup` (which also
        # boots kamal-proxy + the db accessory + obtains the Let's Encrypt
        # cert) was used only for plan 00-05's one-time first bring-up on
        # the GCP host; that bootstrap is confirmed healthy and live, so
        # every deploy from here on uses the leaner `kamal deploy`.
        # --skip-push: the image was already built and pushed by the
        # build-and-push job above (D-01/D-10) — Kamal only needs to pull
        # the tag matching its computed version (the full git SHA of this
        # commit, which the previous job tagged via metadata-action).
        run: kamal deploy --skip-push
